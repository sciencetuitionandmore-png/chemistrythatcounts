<style>

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 var(--body);overflow-x:hidden}

<script>
"use strict";
/* Displayed-formula drawer. Grid text: letters = atoms, - = | / \ bonds,
   [ ] polymer brackets (span 2 rows up/down), ~ = subscript n. hl = [[row,col],...] */
function M(src,hl){
  var W=17,H=21,R=src.replace(/^\n/,"").split("\n"),cols=0,o="",i,r,c;
  for(i=0;i<R.length;i++)cols=Math.max(cols,R[i].length);
  var HS={};(hl||[]).forEach(function(p){HS[p[0]+","+p[1]]=1});
  function L(x1,y1,x2,y2,a){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"'+(a?' class="a"':'')+'/>'}
  for(r=0;r<R.length;r++){
    var s=R[r];
    for(c=0;c<s.length;c++){
      var ch=s[c],x=c*W,y=r*H,cx=x+W/2,cy=y+H/2,a=HS[r+","+c];
      if(ch===" ")continue;
      if(ch==="-"){o+=L(x+1,cy,x+W-1,cy,a);continue}
      if(ch==="="){o+=L(x+1,cy-3,x+W-1,cy-3,a)+L(x+1,cy+3,x+W-1,cy+3,a);continue}
      if(ch==="|"){o+=L(cx,y+1,cx,y+H-1,a);continue}
      if(ch==="/"){o+=L(x+2,y+H-2,x+W-2,y+2,a);continue}
      if(ch==="\\"){o+=L(x+2,y+2,x+W-2,y+H-2,a);continue}
      if(ch==="["||ch==="]"){var t=cy-2*H+2,b=cy+2*H-2,d=ch==="["?6:-6;
        o+=L(x,cy,x+W,cy,a)+'<path d="M'+(cx+d)+" "+t+"H"+cx+"V"+b+"H"+(cx+d)+'"/>';continue}
      if(ch==="~"){o+='<text x="'+(cx-3)+'" y="'+(cy+8)+'" style="font-size:12px;font-style:italic">n</text>';continue}
      var tok=ch;
      if(/[A-Za-z0-9]/.test(ch)){while(c+1<s.length&&/[A-Za-z0-9]/.test(s[c+1]))tok+=s[++c]}
      var tx,cw=9;
      var vb=(R[r-1]&&R[r-1][c-tok.length+1]==="|")||(R[r+1]&&R[r+1][c-tok.length+1]==="|");
      if(/^[A-Z][a-z]$/.test(tok)&&!vb){tx=x+W-cw}             /* Br, Cl: centre over two cells (unless bonded vertically) */
      else if(tok==="→"||tok==="+"){tx=cx-cw/2}
      else tx=cx-cw/2;
      var body=tok.replace(/(\d+)/g,'<tspan style="font-size:11px" dy="4">$1</tspan><tspan dy="-4"></tspan>');
      if(tok==="→")body='<tspan style="font-size:22px" dx="-3">→</tspan>';
      o+='<text x="'+tx+'" y="'+(cy+5)+'"'+(a?' class="a"':'')+'>'+body+"</text>";
    }
  }
  var w=cols*W,h=R.length*H;
  return '<svg class="mol" width="'+w+'" height="'+h+'" viewBox="-2 -2 '+(w+4)+" "+(h+4)+'" role="img" aria-label="displayed formula">'+o+"</svg>";
}

var PAGE={id:"y11-organic",year:"Year 11",group:"Organic chemistry part 2"};
function sp(n){return new Array(n+1).join(" ")}
var BUTANE=M("  H H H H\n  | | | |\nH-C-C-C-C-H\n  | | | |\n  H H H H");
var MEPROP=M("  H H H\n  | | |\nH-C-C-C-H\n  | | |\n  H | H\n    |\n  H-C-H\n    |\n    H",[[5,4],[6,4],[3,4],[4,4]]);
var BUTENE_SK=M("C=C-C-C",[[0,1]]);
var BUTENE=M("H H H H\n| | | |\nC=C-C-C-H\n|   | |\nH   H H",[[2,1]]);
var ETH_R=M("H H\n| |\nC=C + Br-Br\n| |\nH H",[[2,1]]);
var ETH_EQ=M("H H"+sp(14)+"H H\n| |"+sp(14)+"| |\nC=C + Br-Br → Br-C-C-Br\n| |"+sp(14)+"| |\nH H"+sp(14)+"H H",[[2,14],[2,16],[2,20],[2,21],[2,18]]);
var METH_EQ=M("  H"+sp(15)+"H\n  |"+sp(15)+"|\nH-C-H + Br-Br → H-C-Br + H-Br\n  |"+sp(15)+"|\n  H"+sp(15)+"H",[[2,19],[2,20],[2,25],[2,26],[2,27]]);

var QS=[
{id:"iso",name:"Isomers of C<sub>4</sub>H<sub>10</sub>",type:"Draw",marks:4,
title:"Draw and name the two isomers of C<sub>4</sub>H<sub>10</sub>",
tags:["Spec 4.3 isomerism","Spec 4.5 formulae from a molecular formula","Spec 4.21 alkanes"],
q:'<p>Butane is used as a fuel in camping gas. Its molecular formula is <mark>C<sub>4</sub>H<sub>10</sub></mark>. Two different compounds have this molecular formula.</p><p><mark>Draw</mark> the <mark>displayed formulae</mark> of the two structural isomers of C<sub>4</sub>H<sub>10</sub>, and <mark>name</mark> each one.</p><p class="mk">(4)</p>',
mk:[["M1","displayed formula of butane"],["M2","name: butane"],["M3","displayed formula of methylpropane"],["M4","name: methylpropane"]],
foot:"Isomers: same molecular formula, different structural formula.",
steps:[
{t:"What is an isomer?",x:"Isomers have the <b>same molecular formula</b> but a <b>different structural formula</b>: the atoms are joined in a different way. Both drawings must have 4 C and 10 H.",
 add:[{h:"Isomers: same molecular formula (C<sub>4</sub>H<sub>10</sub>), different structure.",c:"note"}],co:"4 C · 10 H in both drawings"},
{t:"Draw the straight chain",x:"Join 4 carbon atoms in a row. Then add H atoms so that every carbon has 4 bonds.",
 add:[{h:BUTANE,m:"M1"}],e:["M1"],
 tip:"A displayed formula shows <b>every</b> bond as a line. CH<sub>3</sub>CH<sub>2</sub>CH<sub>2</sub>CH<sub>3</sub> is a structural formula, not a displayed one."},
{t:"Name it",x:"“But-” means 4 carbon atoms. “-ane” means an alkane, with only single bonds.",
 add:[{h:"Name: <mark>butane</mark>",m:"M2"}],e:["M2"]},
{t:"Make a branch",x:"Take one carbon off the end of the chain and join it to the middle carbon. The longest chain is now 3 carbons, with a CH<sub>3</sub> branch.",
 add:[{h:MEPROP,m:"M3"}],e:["M3"],co:"longest chain = 3 C + one CH<sub>3</sub> branch",
 tip:"Bending the chain does <b>not</b> make a new isomer. Four carbons in an L-shape is still butane."},
{t:"Name the branched isomer",x:"Longest chain of 3 carbons → propane. The CH<sub>3</sub> branch → methyl. Put them together.",
 add:[{h:"Name: <mark>methylpropane</mark>",m:"M4"}],e:["M4"],tip:"Allow 2-methylpropane. Do not accept “isobutane” or “butane” for this one. (The spec only says you must name <b>unbranched</b> isomers, so a real paper may give this name or not ask for it, but it is good to know.)"},
{t:"Check and total",x:"<b>Total: 4 marks.</b> The most common mistakes are drawing butane twice (once bent) and missing an H atom.",
 add:[{h:"Check: each drawing has 4 C and 10 H, and every C has 4 bonds ✓",c:"note"}]}
],
yt:{k:"t",q:"C<sub>4</sub>H<sub>8</sub> has two unbranched alkene isomers. <mark>Give the structural formula</mark> and the <mark>name</mark> of each one. (4)",
 pts:["CH<sub>2</sub>=CHCH<sub>2</sub>CH<sub>3</sub>","…named but-1-ene","CH<sub>3</sub>CH=CHCH<sub>3</sub>","…named but-2-ene"]}
},

{id:"alk",name:"Naming an alkene",type:"Draw",marks:3,

  items.forEach(function(it){it[0].data=""});
  var i=0,p=0;
  (function tick(){
    if(g!==gen)return;
    var n=CH[spd];
    while(n>0&&i<items.length){
      var it=items[i],full=it[1];
      var take=Math.min(n,full.length-p);
      p+=take;n-=take;it[0].data=full.slice(0,p);
      if(p>=full.length){i++;p=0}
      if(take===0&&full.length===0){i++;p=0}
    }
    if(i<items.length)setTimeout(tick,DEL[spd]);else done();
  })();
}
$("#next").addEventListener("click",function(){go(k+1,true)});
$("#back").addEventListener("click",function(){go(k-1,false)});
$("#replay").addEventListener("click",function(){go(k===0?1:k,true)});
$("#dots").addEventListener("click",function(e){var d=e.target.closest(".dot");if(d)go(+d.dataset.j,+d.dataset.j===k+1)});
$("#speed").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;spd=+b.dataset.s;
  $$("#speed button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))})});
document.addEventListener("keydown",function(e){
  var t=e.target,tag=t&&t.tagName;
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||(t&&t.isContentEditable))return;
  if(e.altKey||e.ctrlKey||e.metaKey)return;
  if(e.key==="ArrowRight"){e.preventDefault();if(k<QS[qi].steps.length)go(k+1,true)}
  else if(e.key==="ArrowLeft"){e.preventDefault();if(k>0)go(k-1,false)}
});

/* your turn */
function num(s){s=String(s).trim().replace(/\s+/g,"");if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,"");else s=s.replace(",",".");return s===""?NaN:Number(s)}
function renderYT(q){
  var y=q.yt,el=$("#yt");
  if(y.k==="n"){
    el.innerHTML='<h3>Your turn</h3><div class="ytq">'+y.q+'</div><div class="row"><label class="sr" for="ytin">Your answer</label><input id="ytin" type="text" inputmode="decimal" autocomplete="off" placeholder="Answer"><span class="unit">'+y.unit+'</span><button class="btn pri" id="ytchk" type="button" style="flex:0 0 auto">Check</button><button class="btn" id="ytshow" type="button">Show worked answer</button></div><p class="fb" id="ytfb" aria-live="polite"></p><div class="work" id="ytwork" hidden></div>';
    var chk=function(){
      var v=num($("#ytin").value),fb=$("#ytfb");
      if(isNaN(v)){fb.className="fb no";fb.innerHTML="Type a number first.";return}
      if(Math.abs(v-y.ans)<=y.tol){fb.className="fb ok";fb.innerHTML="✓ Correct. <span>"+y.ok+"</span>";return}
      var why=y.no;(y.wrong||[]).forEach(function(w){if(Math.abs(v-w[0])<=(w[2]||0.001))why=w[1]});
      fb.className="fb no";fb.innerHTML="✗ Not yet. <span>"+why+"</span>";
    };
    $("#ytchk").addEventListener("click",chk);
    $("#ytin").addEventListener("keydown",function(e){if(e.key==="Enter")chk()});
    $("#ytshow").addEventListener("click",function(){
      var w=$("#ytwork"),b=this;b.disabled=true;w.hidden=false;w.innerHTML="";var i=0;
      (function add(){if(!document.body.contains(w))return;var d=document.createElement("div");d.className="ln";d.innerHTML=y.work[i];w.appendChild(d);i++;if(i<y.work.length)setTimeout(add,reduce?0:550)})();
    });
  }else{
    el.innerHTML='<h3>Your turn</h3><div class="ytq">'+y.q+'</div><label class="sr" for="ytta">Your answer</label><textarea id="ytta" placeholder="Write your answer here…"></textarea><div class="row"><button class="btn pri" id="ytshow" type="button" style="flex:0 0 auto">Show model answer</button></div><div class="work" id="ytmodel" hidden><div class="mono">Tick each point you made</div><ul class="ticks">'+
      y.pts.map(function(p,i){return '<li><label><input type="checkbox" data-i="'+i+'"><span>'+p+"</span></label></li>"}).join("")+
      '</ul><div class="score" aria-live="polite"><span id="ytsc">0</span> / '+y.pts.length+" marks</div></div>";
    $("#ytshow").addEventListener("click",function(){$("#ytmodel").hidden=false;this.disabled=true});
    $("#ytmodel").addEventListener("change",function(){$("#ytsc").textContent=$$("#ytmodel input:checked").length});
  }
}

/* checklist */
var KEY="igcse-chem-"+PAGE.id+"-ratings",RT={};
try{RT=JSON.parse(store.get(KEY)||"{}")||{}}catch(e){RT={}}
function buildSpec(){
  $("#speclist").innerHTML=SPEC.map(function(s,i){
    var links=(s.p||[]).map(function(id){var j=-1;QS.forEach(function(q,x){if(q.id===id)j=x});
      return j<0?"":'<button class="plink" type="button" data-q="'+j+'">Practise: '+QS[j].name+"</button>"}).join("");
    return '<div class="srow" data-i="'+i+'"><span class="snum">'+(s.n||"•")+'</span><div class="stext">'+s.s+(links?'<div class="plinks">'+links+"</div>":"")+'</div><div class="pills" role="group" aria-label="Rate spec point">'+
      ["Not yet","Nearly","Got it"].map(function(t,v){return '<button class="pill" type="button" data-v="'+v+'" aria-pressed="false">'+t+"</button>"}).join("")+"</div></div>"}).join("");
  paintSpec();
}
function paintSpec(){
  var cnt=[0,0,0],N=SPEC.length;
  $$(".srow").forEach(function(row){var key=String(row.dataset.i),v=RT.hasOwnProperty(key)?RT[key]:-1;
    if(v>=0)cnt[v]++;
    Array.prototype.forEach.call(row.querySelectorAll(".pill"),function(p){p.setAttribute("aria-pressed",String(+p.dataset.v===v))})});
  var nr=N-cnt[0]-cnt[1]-cnt[2];
  $("#counts").textContent=cnt[2]+" got it · "+cnt[1]+" nearly · "+cnt[0]+" not yet · "+nr+" not rated (of "+N+")";
  $("#bg").style.width=(cnt[2]/N*100)+"%";$("#bm").style.width=(cnt[1]/N*100)+"%";$("#br").style.width=(cnt[0]/N*100)+"%";
}
$("#speclist").addEventListener("click",function(e){
  var p=e.target.closest(".pill");
  if(p){var key=String(p.closest(".srow").dataset.i),v=+p.dataset.v;
    if(RT[key]===v)delete RT[key];else RT[key]=v;
    store.set(KEY,JSON.stringify(RT));paintSpec();return}
  var l=e.target.closest(".plink");if(l)select(+l.dataset.q,true);
});
$("#clear").addEventListener("click",function(){RT={};store.set(KEY,"{}");paintSpec()});

buildPicker();renderQ();buildSpec();
})();
