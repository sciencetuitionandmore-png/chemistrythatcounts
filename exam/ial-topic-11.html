<style>
:root{--bg:#eef2f4;--paper:#fff;--ink:#14313d;--muted:#5b7380;--line:#c9d5db;--accent:#0b5d75;--spark:#e08a00;--spark-soft:#fff1d6;--good:#1f7a4a;--good-soft:#dcf1e5;--bad:#b3261e;--bad-soft:#fbe4e2;
--h:'Lexend',system-ui,'Segoe UI',Arial,sans-serif;--b:'Atkinson Hyperlegible',system-ui,'Segoe UI',Arial,sans-serif;--m:'JetBrains Mono',ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--b)}
.wrap{max-width:760px;margin:0 auto;padding:14px 16px 20px}
h1,h2,h3{font-family:var(--h);margin:0;line-height:1.2}
.top h1{font-size:19px;font-weight:700}
.top p{margin:2px 0 10px;color:var(--muted);font-size:14px}
.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pick{font-family:var(--h);text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer;color:var(--ink);font-size:13.5px;font-weight:600;line-height:1.25;min-height:54px}
.pick small{display:block;font-family:var(--b);font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}
.pick:hover{border-color:var(--accent)}
.pick[aria-pressed=true]{border-color:var(--accent);background:#e3eff3;box-shadow:inset 0 0 0 1px var(--accent)}
.pick:focus-visible,.btn:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--spark);outline-offset:2px}
.eyebrow{font-family:var(--m);font-size:11.5px;letter-spacing:.02em;color:var(--accent);text-transform:uppercase}
#title{font-size:20px;margin:3px 0 8px}
.q{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;min-height:118px;font-size:15.5px}
.q p{margin:0 0 5px}.q p:last-child{margin:0}
.q .mk{float:right;font-family:var(--m);font-size:13px;color:var(--muted);margin-left:8px}
mark{background:var(--spark-soft);color:inherit;border-radius:3px;padding:0 2px;transition:box-shadow .3s}
mark.pulse{box-shadow:0 0 0 2px var(--spark)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 8px;min-height:30px}
.chips .lb{font-family:var(--m);font-size:11.5px;color:var(--muted);margin-right:2px}
.chip{font-size:12.5px;border:1.5px solid var(--line);border-radius:99px;padding:2px 9px 2px 6px;background:var(--paper);color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.chip b{font-family:var(--m);font-weight:500;font-size:12px}
.chip i{font-style:normal;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line);display:inline-grid;place-items:center;font-size:10px;line-height:1}
.chip.on{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.chip.on i{background:var(--good);border-color:var(--good);color:#fff}
.chip.on i::after{content:"\2713"}
.chip.new{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.12)}}
.stage{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:12px;min-height:392px;display:grid;grid-template-columns:330px 1fr;gap:14px;position:relative;
background-image:linear-gradient(transparent 27px,#f1f5f7 28px);background-size:100% 28px}
#diag svg{width:100%;height:auto;display:block}
#diag text{font-family:var(--b);font-size:12px;fill:var(--ink)}
#diag .sm{font-size:10.5px;fill:var(--muted)}
#diag .ax{stroke:var(--ink);stroke-width:1.3;fill:none}
#diag .grid{stroke:#e2e9ec;stroke-width:1}
#diag .bar{fill:var(--accent);transition:fill .3s}
#diag .bar.hot,#diag .pt.hot{fill:var(--spark)}
#diag .pt{fill:var(--accent);transition:fill .3s}
#diag .ln{stroke:var(--accent);stroke-width:2;fill:none}
#diag .an{fill:var(--spark)}#diag text.an{fill:#a86400;font-weight:700}
#diag .anl{stroke:var(--spark);stroke-width:2;fill:none;stroke-dasharray:5 4}
#diag .ring{fill:none;stroke:transparent;stroke-width:2.5;transition:stroke .3s}
#diag .ring.hot{stroke:var(--spark)}
#diag .bx{fill:#fff;stroke:var(--ink);stroke-width:1.3}
#diag .bx.hot{fill:var(--spark-soft);stroke:var(--spark)}
#diag .e{stroke:var(--ink);stroke-width:1.6;fill:none}
#diag .band{fill:var(--spark-soft);stroke:none}
#diag .sh{fill:none;stroke:#9fb3bd;stroke-width:1.2}
#diag .nuc{fill:var(--accent)}#diag text.nt{fill:#fff;font-weight:700;font-size:11px}
#diag .el{fill:var(--ink)}#diag .el.hot{fill:var(--spark)}
#diag [data-at]{opacity:0;transition:opacity calc(.8s*var(--sp,1))}
#diag [data-at].on{opacity:1}
#lines{font-size:15.5px;min-width:0}
#lines [data-at]{display:none}
#lines [data-at].on{display:block}
#lines .now{animation:rise calc(.9s*var(--sp,1)) ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.plan{font-size:13px;color:var(--muted);margin-bottom:8px;border-bottom:1px dashed var(--line);padding-bottom:7px}
.plan span{display:inline-block;background:#e3eff3;color:var(--accent);border-radius:5px;padding:1px 7px;margin:2px 3px 0 0;font-weight:700}
.wl{font-family:var(--m);font-size:14px;line-height:1.75;white-space:nowrap;overflow-x:auto}
.wl.ans1{font-size:15px}
.wl .box{border:2px solid var(--good);border-radius:5px;padding:1px 8px;background:var(--good-soft)}
.wl .mt,.ans .mt{font-family:var(--m)}
.mt{display:inline-block;font-size:11px;background:var(--good);color:#fff;border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px;line-height:1.5}
.ans{margin:0 0 8px}
.ans p{margin:0}
.hl{background:linear-gradient(var(--spark-soft),var(--spark-soft)) no-repeat 0 0/0 100%;transition:background-size .8s .15s;border-radius:3px;padding:0 1px;font-weight:700}
.on .hl{background-size:100% 100%}
.weak{display:none;font-size:13.5px;background:var(--bad-soft);border-radius:6px;padding:4px 8px;margin-bottom:5px}
.weak s{color:var(--bad)}
.weak em{font-style:normal;color:var(--ink)}
.now .weak{display:block}
.lab{font-family:var(--m);font-size:10.5px;text-transform:uppercase;border-radius:3px;padding:0 4px;margin-right:4px;color:#fff;vertical-align:1px}
.lab.bad{background:var(--bad)}.lab.ok{background:var(--good)}
.ans:not(.now) .lab.ok{display:none}
.now.ans p{background:#f3faf6;border-radius:6px;padding:3px 6px;margin-left:-6px}
.flyer{position:fixed;z-index:9;font-family:var(--m);font-size:14px;background:var(--spark);color:#fff;border-radius:4px;padding:0 4px;pointer-events:none}
[data-fly]{transition:color .2s}
[data-fly].wait{color:transparent}
[data-fly].land{background:var(--spark-soft);border-radius:3px}
.narr{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:10px;min-height:150px}
.stepc{font-family:var(--m);font-size:12px;color:var(--muted)}
#stitle{font-size:16.5px;margin:2px 0 4px}
#stext{margin:0 0 7px;font-size:15.5px}
.tip{background:var(--spark-soft);border-left:4px solid var(--spark);border-radius:6px;padding:6px 10px;font-size:14.5px}
.tip b{color:#9a5a00}
.mis{margin:4px 0 0;padding-left:20px;font-size:14.5px}
.mis li{margin-bottom:2px}
.ctrl{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{font-family:var(--h);font-size:14.5px;font-weight:600;border:1.5px solid var(--accent);background:var(--paper);color:var(--accent);border-radius:8px;padding:7px 14px;cursor:pointer;min-height:40px}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);color:#fff}
.dots{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
.dot{width:11px;height:11px;border-radius:50%;background:var(--line);border:0;padding:0;cursor:pointer}
.dot.done{background:var(--accent)}.dot.cur{background:var(--spark);transform:scale(1.25)}
.your{background:var(--paper);border:1.5px dashed var(--accent);border-radius:10px;padding:10px 14px;margin-top:12px;min-height:236px}
.your h3{font-size:16px;color:var(--accent)}
.your .yq{margin:4px 0 8px;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text]{font:15px var(--m);padding:7px 9px;border:1.5px solid var(--line);border-radius:7px;width:140px}
textarea{width:100%;min-height:74px;font:15px/1.4 var(--b);padding:7px 9px;border:1.5px solid var(--line);border-radius:7px;resize:vertical}
.fb{margin-top:7px;font-size:14.5px;border-radius:7px;padding:0}
.fb.ok{background:var(--good-soft);color:var(--good);padding:6px 10px}
.fb.no{background:var(--bad-soft);color:#7d1b15;padding:6px 10px}
.ms{list-style:none;padding:0;margin:6px 0 0;font-size:14.5px}
.ms li{margin:3px 0}
.ms label{display:flex;gap:7px;align-items:flex-start;cursor:pointer}
.ms input{margin-top:4px;width:17px;height:17px;accent-color:var(--good)}
.warn{background:var(--spark-soft);border-radius:6px;padding:5px 9px;margin-top:6px;font-size:14px}
.tally{font-family:var(--m);font-size:13px;color:var(--good);margin-top:4px}
sub,sup{line-height:0}
@media (max-width:720px){.stage{grid-template-columns:1fr}#diag{max-width:360px;margin:0 auto;width:100%}.picker{grid-template-columns:repeat(2,1fr)}}
@media (max-width:400px){.picker{grid-template-columns:1fr 1fr}.pick{font-size:12.5px}.dots{margin-left:0;width:100%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.specs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.specs .sp{font-family:var(--m);font-size:12px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:#fff}
.specs .sp b{color:var(--accent);font-weight:600;margin-right:3px}
.ck{margin-top:16px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px}
.ck h3{margin:0 0 2px;font-size:1.05rem}
.ck .ckp{margin:0 0 10px;font-size:.92rem;color:var(--muted)}
.ck .bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:#e6ecef;margin:4px 0 4px}
.ck .bar i{display:block;height:100%;transition:width .4s}
.ck .bar .g{background:#1f7a4a}.ck .bar .a{background:#e08a00}.ck .bar .r{background:#b9473a}
.ck .sum{font-family:var(--m);font-size:12px;color:var(--muted);margin-bottom:8px}
.ck ul{list-style:none;margin:0;padding:0}
.ck li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 0;border-top:1px solid #e6ecef}
.ck .no{font-family:var(--m);font-size:12px;color:var(--accent);min-width:38px;font-weight:600}
.ck .tx{flex:1 1 260px;font-size:.92rem;min-width:0}
.ck .rag{display:flex;gap:4px}
.ck .rag button{font:600 12px var(--h);border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:4px 9px;cursor:pointer;min-height:30px}
.ck .rag button[aria-pressed=true][data-v=r]{background:#fbe4de;border-color:#b9473a;color:#8f2d22}
.ck .rag button[aria-pressed=true][data-v=a]{background:#fff1d6;border-color:#e08a00;color:#8a5200}
.ck .rag button[aria-pressed=true][data-v=g]{background:#dcf1e5;border-color:#1f7a4a;color:#1f7a4a}
.ck .go{font:600 12px var(--h);border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;padding:4px 2px}
.ck .rag button:focus-visible,.ck .go:focus-visible{outline:3px solid #e08a00;outline-offset:2px}
.ck .rst{margin-top:8px;font:600 12px var(--h);border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:8px;padding:5px 10px;cursor:pointer}
.specs{margin-top:6px}.wrap{max-width:1100px}
.picker{grid-template-columns:repeat(4,1fr)}
.play{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start;margin-top:10px}
.play .stage{grid-template-columns:minmax(200px,330px) minmax(0,1fr)}
.play .wl{white-space:normal}
.side .ctrl{margin-top:0;gap:6px}.side .ctrl .btn{padding:7px 10px}
.side .ctrl .pri{margin-left:auto}.side .dots{margin-left:0;width:100%;order:9}
.side .chips{margin:10px 0 0}.side .narr{margin-top:10px}
@media (max-width:860px){.play{grid-template-columns:1fr}.side{display:contents}.ctl{order:-2}.chips{order:-1}.stage{order:0}.nar{order:1}.sc,#sx,.yt{order:2}.picker{grid-template-columns:repeat(2,1fr)}}
@media (max-width:720px){.play .stage{grid-template-columns:1fr}}
.spd{order:10;width:100%;display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}
.spd button{font:600 12px var(--h);border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:3px 10px;cursor:pointer;min-height:28px}
.spd button[aria-pressed=true]{border-color:var(--accent);background:var(--accent);color:#fff}

#diag text.il{font-size:10px;font-weight:700;fill:var(--ink)}
#diag text.hd{font-family:var(--h);font-size:12.5px;font-weight:700;fill:var(--ink)}
#diag text.at{font-family:var(--h);font-size:17px;font-weight:700;fill:var(--ink)}
#diag text.big{font-family:var(--h);font-size:15px;font-weight:700;fill:#a86400}
#diag text.dl{font-size:11px;font-weight:700;fill:var(--accent)}
#diag text.xe{font-size:17px;font-weight:700;fill:var(--accent);transition:fill .3s}
#diag .hot text.xe,#diag .hot .de{fill:var(--spark)}
#diag .de{fill:var(--ink);transition:fill .3s}
#diag .ip{fill:#d9ecf2;stroke:var(--accent);stroke-width:1.4;transition:stroke .3s,stroke-width .3s}
#diag .in{fill:#fbe9d6;stroke:#b86a12;stroke-width:1.4;transition:stroke .3s,stroke-width .3s}
#diag .ip.hot,#diag .in.hot{stroke:var(--spark);stroke-width:3}
#diag .ghost{fill:none;stroke:#b8c6cd;stroke-width:1.2;stroke-dasharray:4 4}
#diag path.in.on ~ .cl0{opacity:0}
#diag .cl0{transition:opacity calc(.8s*var(--sp,1))}
#diag .share{fill:rgba(224,138,0,.35)}
#diag .dp{stroke:var(--accent);stroke-width:2;fill:none;marker-end:url(#ah)}
#diag .po{stroke:var(--spark);stroke-width:2.2;fill:none;marker-end:url(#ao)}
#diag .barr{stroke:var(--spark);stroke-width:3.5;fill:none;marker-end:url(#ao)}
#diag .bd{stroke:var(--ink);stroke-width:2.4;transition:stroke .3s}
#diag .bd.cv.hot{stroke:var(--spark);stroke-width:3.4}
#diag .wedge{fill:var(--ink)}
#diag .brk{fill:none;stroke:var(--ink);stroke-width:2}
#diag .lobe{fill:#e3eff3;stroke:var(--accent);stroke-width:1.3;transition:fill .3s}
#diag .lobe.hot{fill:var(--spark-soft);stroke:var(--spark)}
#diag .atn{fill:#2c4b57}#diag .atc{fill:#3f9a5a}#diag .ath{fill:#fff;stroke:var(--ink);stroke-width:1.3}
#diag .ats{fill:#8a6d3b}#diag .ato{fill:#c8442f}
#diag .atn+text.il,#diag .atc+text.il,#diag .ats+text.il,#diag .ato+text.il{fill:#fff}
#diag .imf{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-dasharray:3 4;transition:stroke .3s}
#diag .imf.hot{stroke:var(--spark);stroke-width:2.4}
#diag .sea{fill:#e8f1f4}

#diag .sk{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;transition:stroke .3s}
#diag .sk.hot{stroke:var(--spark);stroke-width:3.4}
#diag .sk.dup{stroke:#9fb3bd;stroke-dasharray:5 4}
#diag text.nm{font-family:var(--h);font-size:13px;font-weight:700;fill:var(--ink)}
#diag text.num{font-family:var(--m);font-size:11px;fill:var(--accent);font-weight:700}
#diag text.eq{font-family:var(--m);font-size:13px;fill:var(--ink)}
#diag text.at2{font-family:var(--h);font-size:15px;font-weight:700;fill:var(--ink);transition:fill .3s}
#diag text.at2.hot{fill:var(--spark)}
#diag text.at2s{font-family:var(--h);font-size:11px;font-weight:700;fill:var(--muted)}
#diag text.plus{font-size:18px;font-weight:700;fill:var(--spark)}
#diag .cut{stroke:var(--spark);stroke-width:2.5;stroke-dasharray:4 3}
#diag .card{fill:#fff;stroke:var(--line);stroke-width:1.4}
#diag .card.g{fill:var(--good-soft);stroke:var(--good)}
#diag .card.o{fill:var(--spark-soft);stroke:var(--spark)}
#diag .card.t{fill:#e3eff3;stroke:var(--accent)}
#diag .card.hot2{stroke:var(--spark);stroke-width:2.5}
#diag .loop{fill:none;stroke:var(--spark);stroke-width:2;marker-end:url(#ao)}
#diag .ca{fill:none;stroke:var(--spark);stroke-width:2.2;marker-end:url(#ao)}
#diag .fh{fill:none;stroke:var(--spark);stroke-width:2;marker-end:url(#hh)}
#diag .glass{fill:none;stroke:var(--ink);stroke-width:2}
#diag .liq{fill:#e8892b;opacity:.85}
#diag .clear{fill:#f3f8fb}
#diag .sig{fill:rgba(11,93,117,.25);stroke:var(--accent);stroke-width:1.2;transition:fill .3s}
#diag .sig.hot{fill:rgba(224,138,0,.45)}
#diag .pib{fill:rgba(224,138,0,.35)}
#diag .bd.ext.hot{stroke:var(--spark)}

#diag text.th{font-size:10.5px;font-weight:700;fill:var(--ink)}
#diag .lvl{stroke:var(--ink);stroke-width:2.4}
#diag .lvl.hot{stroke:var(--spark)}
#diag text.sm2{font-size:11px;font-weight:700;fill:var(--accent)}
#diag .card.hot{stroke:var(--spark);stroke-width:2.5;fill:var(--spark-soft)}
#diag .ln2{stroke:var(--spark);stroke-width:2.2;fill:none}
#diag .ln3{stroke:#3f9a5a;stroke-width:2.2;fill:none}
#diag .band2{fill:rgba(63,154,90,.18)}
#diag .pk{stroke:var(--accent);stroke-width:2.4}
#diag .pk.hot{stroke:var(--spark)}
#diag .spot{fill:#c8442f;opacity:.75}
#diag .spot2{fill:#0b5d75;opacity:.75}
</style>
</head>

<div class="wrap">
<div class="top"><h1>Kinetics: how to answer exam questions</h1>
<p>Pick a question. Click <b>Next step</b> (or press →) to watch the answer build, mark by mark.</p></div>
<div class="picker" id="picker" role="group" aria-label="Choose a walkthrough"></div>

<div class="q" id="q"></div>

</div></div>

<script>
(function(){
"use strict";
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function $(id){return document.getElementById(id)}
function T(x,y,s,c,ex){return '<text x="'+x+'" y="'+y+'"'+(c?' class="'+c+'"':'')+(ex?' '+ex:'')+'>'+s+'</text>'}
function A(at){return at==null?'':' data-at="'+at+'"'}
function svg(w,h,body){return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="diagram">'+body+'</svg>'}

/* mass spectrum */
function spec(o){
  var w=330,h=o.h||230,L=44,R=w-10,Tp=14,B=h-34,s='';
  function X(m){return o.px?L+o.px[m]*(R-L):L+(m-o.min)/(o.max-o.min)*(R-L)}
  function Y(v){return B-v/o.ymax*(B-Tp)}
  for(var t=0;t<=o.ymax;t+=o.step){s+='<line class="grid" x1="'+L+'" x2="'+R+'" y1="'+Y(t)+'" y2="'+Y(t)+'"/>'+T(L-6,Y(t)+4,t,'sm','text-anchor="end"')}
  s+='<path class="ax" d="M'+L+' '+Tp+'V'+B+'H'+R+'"/>';
  if(o.brk){var bx=L+o.brk*(R-L);s+='<path d="M'+(bx-6)+' '+(B+5)+'l6 -10M'+bx+' '+(B+5)+'l6 -10" stroke="#14313d" stroke-width="1.3"/><rect x="'+(bx-3)+'" y="'+(B-2)+'" width="6" height="4" fill="#fff"/>'}
  o.bars.forEach(function(b){var x=X(b.m),y=Y(b.v);
    s+='<rect class="bar"'+(b.hot?' data-hot="'+b.hot+'"':'')+' x="'+(x-7)+'" y="'+y+'" width="14" height="'+(B-y)+'"/>';
    s+=T(x,B+15,b.m,'',b.km?'text-anchor="middle" data-k="'+b.km+'"':'text-anchor="middle"');
    if(b.lab)s+=T(x,y-5,b.lab,'sm',(b.kv?'data-k="'+b.kv+'" ':'')+'text-anchor="middle"');});
  s+=T((L+R)/2,h-3,'<tspan font-style="italic">m/z</tspan>','sm','text-anchor="middle"');
  s+=T(12,(Tp+B)/2,o.yl,'sm','text-anchor="middle" transform="rotate(-90 12 '+(Tp+B)/2+')"');
  return {s:s,X:X,Y:Y,B:B};
}
/* line / point graph */
function lineG(o){
  var w=330,h=o.h||240,L=46,R=w-10,Tp=14,B=h-36,n=o.v.length,s='';
  function X(i){return L+14+i*(R-L-28)/(n-1)}
  function Y(v){return B-(v-o.y0)/(o.y1-o.y0)*(B-Tp)}
  for(var t=o.y0;t<=o.y1+1e-9;t+=o.step){var tt=Math.round(t*10)/10;s+='<line class="grid" x1="'+L+'" x2="'+R+'" y1="'+Y(tt)+'" y2="'+Y(tt)+'"/>'+T(L-6,Y(tt)+4,tt,'sm','text-anchor="end"')}
  s+='<path class="ax" d="M'+L+' '+Tp+'V'+B+'H'+R+'"/>';
  var d='';o.v.forEach(function(v,i){d+=(i?'L':'M')+X(i)+' '+Y(v)});
  s+='<path class="ln" d="'+d+'"/>';
  o.v.forEach(function(v,i){s+='<circle class="pt" r="4" cx="'+X(i)+'" cy="'+Y(v)+'"'+(o.hot&&o.hot[i]?' data-hot="'+o.hot[i]+'"':'')+'/>'+T(X(i),B+15,o.lab[i],'sm','text-anchor="middle"')});
  s+=T((L+R)/2,h-4,o.xl,'sm','text-anchor="middle"');
  s+=T(11,(Tp+B)/2,o.yl,'sm','text-anchor="middle" transform="rotate(-90 11 '+(Tp+B)/2+')"');
  return {s:s,X:X,Y:Y,B:B};
}

function arrow(x,y,up){return up?'<path class="e" d="M'+x+' '+(y+20)+'V'+(y+5)+'l-4 6"/>':'<path class="e" d="M'+x+' '+(y+5)+'V'+(y+20)+'l4 -6"/>'}

/* shell diagram */
function atom(cx,cy,z,sh,hotOuter){
  var s='',r=16;
  sh.forEach(function(n,k){var R=r+8+k*13;s+='<circle class="sh" cx="'+cx+'" cy="'+cy+'" r="'+R+'"/>';
    for(var j=0;j<n;j++){var a=-Math.PI/2+j*2*Math.PI/n+(k%2?0.3:0);var last=k===sh.length-1;
      s+='<circle class="el"'+(last&&hotOuter?' data-hot="'+hotOuter+'"':'')+' r="3.2" cx="'+(cx+R*Math.cos(a)).toFixed(1)+'" cy="'+(cy+R*Math.sin(a)).toFixed(1)+'"/>'}});
  s+='<circle class="nuc" cx="'+cx+'" cy="'+cy+'" r="'+r+'"/>'+T(cx,cy+4,z+'+','nt','text-anchor="middle"');
  return s;
}

{t:'The first half-life',x:'Start at 0.80 mol dm<sup>−3</sup>. Half of this is 0.40. Go across to the curve and down to the time axis: 50 s.',tip:'You can start a half-life anywhere on the curve, not just at t = 0.'},
{t:'More half-lives',x:'0.40 to 0.20 takes 50 s, and 0.20 to 0.10 takes another 50 s. The half-life does not change as the concentration falls.',tip:'For a first order reaction the half-life stays the same. For a second order reaction it gets longer as the concentration falls.'},
{t:'Calculate k',x:'For a first order reaction, <i>k</i> = ln 2 ÷ <i>t</i><sub>½</sub>. ln 2 = 0.693.',tip:'Keep 3 significant figures unless the question says otherwise.'},
{t:'Units',x:'Rate = <i>k</i>[X], so <i>k</i> = rate ÷ [X]. The concentration units cancel and leave s<sup>−1</sup>.',tip:'First order: s<sup>−1</sup>. Second order: dm<sup>3</sup> mol<sup>−1</sup> s<sup>−1</sup>. Zero order: mol dm<sup>−3</sup> s<sup>−1</sup>.'},
{t:'Check against the mark scheme',x:'All four marks earned. These mistakes lose marks most often:',end:1}],
mis:['Using only one half-life as evidence.','Saying the graph is "curved" so it must be first order.','Reading the time at half the axis (0.40 on the scale) instead of half the starting concentration.','Leaving out the units of <i>k</i> or writing them as mol dm<sup>−3</sup> s<sup>−1</sup>.'],
your:{kind:'num',q:'A different first order reaction has a half-life of 40 s. Calculate the rate constant, <i>k</i>, in s<sup>−1</sup>. Give 3 significant figures.',ans:0.0173,tol:0.0002,
 ok:'Correct: <i>k</i> = 0.693 ÷ 40 = <b>0.0173 s<sup>−1</sup></b>.',
 wrong:[[57.7,0.5,'You divided 40 by 0.693. Use <i>k</i> = 0.693 ÷ <i>t</i><sub>½</sub>.'],[0.025,0.0005,'That is 1 ÷ 40. You need ln 2 = 0.693 on the top.'],[0.0125,0.0003,'Check your value of ln 2: it is 0.693, not 0.5.']]}
});
/* ---------- 3 rate-concentration graphs ---------- */
W.push({btn:'Rate–concentration graphs',spec:[["11.5 ii","order from a rate–concentration graph"],["11.5 i","concentration–time graphs"]],type:'Sketch',marks:3,
title:'The shapes of rate–concentration graphs for orders 0, 1 and 2',
q:'<p><span class="mk">(3)</span><mark>Sketch</mark> a graph of rate against concentration for a reactant that is <mark>zero order</mark>, <mark>first order</mark> and <mark>second order</mark>. Explain each shape.</p>',
diag:function(){var s='';
  [[0,'zero order','rate = k',function(c){return 0.5}],[1,'first order','rate = k[A]',function(c){return c*0.8}],[2,'second order','rate = k[A]²',function(c){return c*c*0.85}]].forEach(function(o,i){var x0=8+i*108,g;
   g=gax({x0:0,x1:1,y0:0,y1:1,L:x0+22,w:x0+104+12,r:12,t:28,h:150,b:30,xl:'[A]',noxl:true,yl:''});
   var sv=g.s+T(x0+60,18,o[1],'hd','text-anchor="middle"');
   sv+=PL(fpath(o[3],0,1,g.X,g.Y),'ln');
   sv+=T(x0+60,148,o[2],'an','text-anchor="middle"');
   s+=G(i+1,sv)});
  s+=G(1,T(10,182,'0: rate does not change with [A]','sm'));
  s+=G(2,T(10,198,'1: straight line through the origin','sm'));
  s+=G(3,T(10,214,'2: curve upwards; doubling [A] gives rate × 4','sm'));
  return svg(330,224,s)},
lines:plan(['zero order','first order','second order'])+
 ans(1,'A line going down.','A line going down is a zero order <b>concentration–time</b> graph. Read the axes.','Zero order: a <span class="hl">horizontal line</span>. The rate does not depend on [A].','M1')+
 ans(2,'','','First order: a <span class="hl">straight line through the origin</span>. Rate is directly proportional to [A].','M2')+
 ans(3,'','','Second order: a <span class="hl">curve getting steeper</span>, through the origin. Rate ∝ [A]<sup>2</sup>.','M3'),
chips:[['M1','zero order: horizontal line',1],['M2','first order: straight line through origin',2],['M3','second order: upward curve',3]],
steps:[
{t:'Read and plan',x:'Check the axes first. A <b>rate–concentration</b> graph is not the same as a <b>concentration–time</b> graph. The same order gives a different shape on each.',tip:'Label both axes on every sketch, even when it is "only a sketch".'},
{t:'Zero order',x:'rate = <i>k</i>[A]<sup>0</sup> = <i>k</i>. Changing [A] has no effect, so the line is flat. The height of the line is <i>k</i>.',tip:'On a concentration–time graph, zero order gives a straight line going down.'},
{t:'First order',x:'rate = <i>k</i>[A]. Rate is proportional to [A], so the graph is a straight line through the origin. Its gradient is <i>k</i>.',tip:'Remember the line must pass through (0, 0).'},
{t:'Second order',x:'rate = <i>k</i>[A]<sup>2</sup>. Doubling [A] makes the rate four times bigger, so the line curves upwards.',tip:'To confirm second order, plot rate against [A]<sup>2</sup>: it gives a straight line through the origin.'},
{t:'Check against the mark scheme',x:'All three marks earned. These mistakes lose marks most often:',end:1}],
mis:['Drawing concentration–time shapes when the question asks for rate–concentration.','A first order line that does not go through the origin.','Drawing a second order curve that levels off (that is the wrong way round).','No labels on the axes.'],
your:{kind:'text',marks:3,q:'Describe the shape of a <b>concentration–time</b> graph for a zero order and a first order reaction, and say how you would use each graph to find the rate at a given time. (3)',
 ms:['Zero order: a straight line with a negative (downward) gradient.','First order: a curve getting less steep, with a constant half-life.','The rate at any time is the gradient of a tangent to the curve at that time (for zero order the gradient is the same everywhere).'],
 warn:[[/horizontal|flat/i,'A horizontal line is the zero order <b>rate–concentration</b> graph. On a concentration–time graph the concentration still falls.']]}
});
/* ---------- 4 rate-determining step ---------- */
W.push({btn:'Rate-determining step: propanone + iodine',spec:[["11.6","orders, rate-determining step and mechanism"],["11.7","rate equation ↔ rate-determining step"],["11.12","CP9 iodine–propanone"]],type:'Explain',marks:4,
title:'What the rate equation tells you about the mechanism',
q:'<p><span class="mk">(4)</span>Propanone reacts with iodine in acid:</p><p>CH<sub>3</sub>COCH<sub>3</sub> + I<sub>2</sub> → CH<sub>3</sub>COCH<sub>2</sub>I + H<sup>+</sup> + I<sup>−</sup></p><p>The rate equation is <mark>rate = <i>k</i>[CH<sub>3</sub>COCH<sub>3</sub>][H<sup>+</sup>]</mark>.</p><p><mark>Explain</mark> what this tells you about the <mark>rate-determining step</mark> and the role of H<sup>+</sup>.</p>',
diag:function(){var s='';
  s+=box2(14,14,302,46,'card t',null)+T(165,34,'rate = k[CH₃COCH₃][H⁺]','big','text-anchor="middle"')+T(165,52,'I₂ is not in the rate equation','sm','text-anchor="middle"');
  s+=G(1,box2(14,80,302,50,'card o','')+T(24,100,'Step 1 (slow): CH₃COCH₃ + H⁺ → intermediate','')+T(24,120,'contains propanone and H⁺ → rate-determining','an'));
  s+=G(2,box2(14,142,302,44,'card','')+T(24,160,'Step 2 (fast): intermediate + I₂ → products','')+T(24,178,'I₂ reacts after the slow step: zero order','sm'));
  s+=G(3,box2(14,198,302,44,'card g','')+T(24,216,'Final step: H⁺ is given back','')+T(24,234,'H⁺ is a catalyst','an'));
  return svg(330,252,s)},
lines:plan(['what is in the rate equation','what is missing','where I₂ reacts','role of H⁺'])+
 ans(1,'','','Propanone and H<sup>+</sup> are both first order, so <span class="hl">one molecule of each</span> takes part in (or before) the <span class="hl">rate-determining step</span>.','M1')+
 ans(2,'Iodine is not needed for the reaction.','Iodine is needed, but not in the slow step.','Iodine is <span class="hl">zero order</span>, so I<sub>2</sub> is <span class="hl">not involved in the rate-determining step</span>. It reacts in a later, faster step.','M2')+
 ans(3,'','','So the mechanism has <span class="hl">more than one step</span>: the slow step must come before the step involving iodine.','M3')+
 ans(3,'H⁺ is a reactant.','H<sup>+</sup> is in the rate equation but it is not used up overall: it is made again.','H<sup>+</sup> appears in the rate equation but is regenerated at the end, so it acts as a <span class="hl">catalyst</span>.','M4'),
chips:[['M1','propanone + H⁺ in the rate-determining step',1],['M2','I₂ zero order → not in slow step',2],['M3','multi-step mechanism',3],['M4','H⁺ is a catalyst',3]],
steps:[
{t:'Read and plan',x:'The <b>rate-determining step</b> is the slowest step in a mechanism. The species in the rate equation, and their orders, tell you what takes part in that step.',tip:'Order 1 means one particle of that species in the slow step. Order 2 means two.'},
{t:'What is in the rate equation',x:'Propanone and H<sup>+</sup> each have order 1. So one propanone and one H<sup>+</sup> are involved in the slow step (or in a fast step before it).',tip:'Use the phrase "involved in the rate-determining step".'},
{t:'What is missing',x:'I<sub>2</sub> is in the overall equation, but not in the rate equation. Changing [I<sub>2</sub>] does not change the rate, so iodine must react after the slow step.',tip:'Zero order does not mean "not needed". It means "not in the slow step".'},
{t:'The role of H⁺',x:'H<sup>+</sup> speeds up the reaction but is not used up: it is a product in the overall equation as well. This makes it a catalyst. This is an example of acid catalysis.',tip:'A species that is in the rate equation but not in the overall equation as a reactant is usually a catalyst.'},
{t:'Check against the mark scheme',x:'All four marks earned. These mistakes lose marks most often:',end:1}],
mis:['Saying iodine is not needed at all.','Saying the reaction happens in one step.','Calling H<sup>+</sup> a reactant without saying it is regenerated.','Writing the rate equation from the overall equation.'],
your:{kind:'text',marks:3,q:'The hydrolysis of 2-bromo-2-methylpropane, (CH<sub>3</sub>)<sub>3</sub>CBr, with hydroxide ions has the rate equation rate = <i>k</i>[(CH<sub>3</sub>)<sub>3</sub>CBr]. <b>Explain</b> what this tells you about the mechanism. (3)',
 ms:['Only (CH<sub>3</sub>)<sub>3</sub>CBr is in the rate-determining step; OH<sup>−</sup> is zero order.','The slow step is the C–Br bond breaking to form a carbocation, (CH<sub>3</sub>)<sub>3</sub>C<sup>+</sup>, and Br<sup>−</sup>.','OH<sup>−</sup> attacks the carbocation in a fast second step, so the mechanism is S<sub>N</sub>1 (two steps).'],
 warn:[[/SN2|S<sub>N<\/sub>2|one step/i,'A rate equation with only the halogenoalkane in it points to S<sub>N</sub>1, a two-step mechanism.']]}
});
/* ---------- 5 SN1 vs SN2 ---------- */
W.push({btn:'S<sub>N</sub>2 or S<sub>N</sub>1? Using the rate equation',spec:[["11.9","rate equations and halogenoalkane mechanisms"],["11.8","mechanism from rate and stoichiometric equations"]],type:'Mechanism',marks:4,
title:'Using kinetics to decide the mechanism for hydrolysing 1-bromobutane',
q:'<p><span class="mk">(4)</span>1-Bromobutane reacts with aqueous hydroxide ions. The rate equation is <mark>rate = <i>k</i>[C<sub>4</sub>H<sub>9</sub>Br][OH<sup>−</sup>]</mark>.</p><p><mark>Name</mark> the mechanism and <mark>draw</mark> it, showing the <mark>transition state</mark>.</p>',
diag:function(){var s=DEFS2;
  s+=AT(40,92,'HO⁻','at2')+X(30,106)+X(52,106);
  s+=AT(140,92,'C','at2')+L(148,92,196,92,'bd')+AT(212,92,'Br','at2')+T(124,76,'δ+','dl')+T(214,74,'δ−','dl');
  s+=L(140,82,140,56,'bd')+AT(140,48,'C₃H₇','at2s')+L(132,98,114,118,'bd')+AT(108,128,'H','at2')+L(148,98,166,118,'bd')+AT(172,128,'H','at2');
  s+=CA('M58 92C80 80 104 84 126 90',1);
  s+=CA('M172 86C182 72 202 66 210 76',2);
  s+=G(3,T(86,182,'[','at2')+AT(150,176,'HO····C····Br','at2')+T(208,182,']⁻','at2')+T(150,196,'transition state: 5 groups round C','an','text-anchor="middle"'));
  s+=G(4,T(30,232,'→  C₃H₇CH₂OH  +  Br⁻','big'));
  s+=G(1,T(236,30,'both in the','an')+T(236,46,'rate equation','an')+T(236,62,'→ SN2, one step','an'));
  return svg(330,248,s)},
lines:plan(['read the orders','name the mechanism','arrow: lone pair → C','arrow: C–Br → Br','transition state'])+
 ans(1,'','','Both the halogenoalkane and OH<sup>−</sup> are first order, so <span class="hl">both are in the rate-determining step</span>: a one-step mechanism, <span class="hl">S<sub>N</sub>2</span>.','M1')+
 ans(1,'Arrow from the C to the OH⁻.','Electrons move from the nucleophile to the δ+ carbon.','Curly arrow from a <span class="hl">lone pair on O of OH<sup>−</sup> to the δ+ carbon</span>.','M2')+
 ans(2,'','','Curly arrow from the <span class="hl">C–Br bond to Br</span>.','M3')+
 ans(3,'','','The <span class="hl">transition state</span> has partial bonds to OH and Br, in square brackets with an overall − charge. The products are butan-1-ol and Br<sup>−</sup>.','M4'),
chips:[['M1','both in slow step → SN2',1],['M2','arrow from OH⁻ lone pair to C',1],['M3','arrow from C–Br bond to Br',2],['M4','transition state with partial bonds',3]],
steps:[
{t:'Read and plan',x:'There are two mechanisms for nucleophilic substitution. In <b>S<sub>N</sub>2</b>, the bonds break and form in one step. In <b>S<sub>N</sub>1</b>, a carbocation forms first.',tip:'The "2" in S<sub>N</sub>2 means two species in the rate-determining step.'},
{t:'Use the rate equation',x:'Both reactants are first order, so both are in the rate-determining step. A primary halogenoalkane like 1-bromobutane reacts this way. The first arrow goes from a lone pair on the OH<sup>−</sup> to the δ+ carbon.',tip:'Draw the lone pair on the oxygen. The arrow must start there, not at the minus sign.'},
{t:'Break the C–Br bond',x:'As the new bond forms, the C–Br bond breaks heterolytically. Both electrons go to bromine.',tip:'In S<sub>N</sub>2 both arrows happen together, in one step.'},
{t:'Transition state',x:'Halfway through, the carbon has a partial bond to OH and a partial bond to Br. The OH comes in on the opposite side to the Br. This is a transition state, not an intermediate.',tip:'Draw partial bonds as dotted lines and put the whole structure in square brackets with a − charge.'},
{t:'Products',x:'The products are butan-1-ol and a bromide ion.',tip:'Compare with S<sub>N</sub>1: the rate equation for a tertiary halogenoalkane has only the halogenoalkane in it.'},
{t:'Check against the mark scheme',x:'All four marks earned. These mistakes lose marks most often:',end:1}],
mis:['Calling the transition state an intermediate.','Arrows starting from the minus sign instead of a lone pair.','Choosing S<sub>N</sub>1 because the halogenoalkane is first order, ignoring OH<sup>−</sup>.','Missing the negative charge on the transition state.'],
your:{kind:'text',marks:3,q:'Explain why tertiary halogenoalkanes usually react by S<sub>N</sub>1 and primary halogenoalkanes by S<sub>N</sub>2. (3)',
 ms:['Tertiary carbocations are more stable (three alkyl groups push electrons towards / stabilise the positive charge).','In tertiary halogenoalkanes, the three alkyl groups block (sterically hinder) attack on the carbon from the back.','Primary carbocations are unstable, but the carbon is easy to reach, so the one-step S<sub>N</sub>2 route is used.'],
 warn:[[/radical/i,'This is about nucleophilic substitution, not free radicals.']]}
});
/* ---------- 6 activation energy ---------- */
W.push({btn:'Activation energy from an Arrhenius plot',spec:[["11.10","activation energy from data"],["11.13","CP10 activation energy"]],type:'Calculate',marks:4,
title:'Finding the activation energy from a graph of ln k against 1/T',
q:'<p><span class="mk">(4)</span>The rate constant, <i>k</i>, was measured at several temperatures. The graph in the stage shows ln <i>k</i> against 1/<i>T</i>.</p><p>The Arrhenius equation is <mark>ln <i>k</i> = −<i>E</i><sub>a</sub>/<i>RT</i> + ln <i>A</i></mark>. Use the graph to calculate the <mark>activation energy</mark>, <i>E</i><sub>a</sub>, in kJ mol<sup>−1</sup>. <i>R</i> = 8.31 J K<sup>−1</sup> mol<sup>−1</sup>.</p>',
diag:function(){var g=gax({x0:3.0,x1:3.6,xs:0.1,xf:function(v){return v.toFixed(1)},y0:-6,y1:-2,ys:1,xl:'(1/T) × 10³ / K⁻¹',yl:'ln k',h:240,L:42}),X=g.X,Y=g.Y,s=g.s;
  var f=function(x){return -2.5-6.2*(x-3.05)};
  s+=PL(fpath(f,3.02,3.55,X,Y,4),'ln');
  [3.1,3.2,3.3,3.4,3.5].forEach(function(x,i){s+=dot(X(x),Y(f(x)+[0.04,-0.05,0.03,-0.03,0.05][i]))});
  s+=G(1,'<path class="anl" d="M'+X(3.1)+' '+Y(f(3.1))+'H'+X(3.5)+'V'+Y(f(3.5))+'"/>'+T(X(3.3),Y(f(3.1))-6,'Δx = 0.40 × 10⁻³','an','text-anchor="middle"')+T(X(3.5)-6,Y(-4.2),'Δy','an','text-anchor="end"')+T(X(3.5)-6,Y(-4.2)+14,'= −2.48','an','text-anchor="end"'));
  s+=G(2,T(20,258,'gradient = −2.48 ÷ 0.00040 = −6200 K','eq'));
  return svg(330,266,s)},
lines:plan(['draw a large triangle','calculate the gradient','gradient = −Ea/R','convert to kJ'])+
 ans(1,'','','From the line: Δln <i>k</i> = −2.48 over Δ(1/<i>T</i>) = 0.40 × 10<sup>−3</sup> K<sup>−1</sup>.','M1')+
 ans(2,'Gradient = −2.48 ÷ 0.40 = −6.2','Read the axis label: the x values are × 10<sup>−3</sup>. Use 0.00040.','Gradient = −2.48 ÷ 0.00040 = <span class="hl">−6200 K</span>','M2')+
 ans(3,'','','Gradient = −<i>E</i><sub>a</sub>/<i>R</i>, so <i>E</i><sub>a</sub> = 6200 × 8.31 = <span class="hl">51 500 J mol<sup>−1</sup></span>','M3')+
 ans(4,'Ea = 51 500 kJ mol⁻¹','The value from <i>R</i> is in J. Divide by 1000.','<i>E</i><sub>a</sub> = <span class="hl">+51.5 kJ mol<sup>−1</sup></span>','M4'),
chips:[['M1','large gradient triangle',1],['M2','gradient = −6200 K',2],['M3','Ea = −gradient × R',3],['M4','Ea = +51.5 kJ mol⁻¹',4]],
steps:[
{t:'Read and plan',x:'The Arrhenius equation has the form y = mx + c, with y = ln <i>k</i> and x = 1/<i>T</i>. So the gradient of the line is −<i>E</i><sub>a</sub>/<i>R</i>.',tip:'Write the link "gradient = −<i>E</i><sub>a</sub>/<i>R</i>" in your answer. It is often a mark on its own.'},
{t:'Draw a gradient triangle',x:'Use a triangle that covers more than half the line. Read the coordinates of two points that are on the line (not data points that are off it).',tip:'A small triangle gives a less accurate gradient.'},
{t:'Calculate the gradient',x:'Watch the axis: the label says (1/<i>T</i>) × 10<sup>3</sup>, so a reading of 0.40 really means 0.00040 K<sup>−1</sup>. The gradient is negative because the line goes down.',tip:'The gradient has units of K, because ln <i>k</i> has no units and 1/<i>T</i> is in K<sup>−1</sup>.'},
{t:'Use the gradient',x:'<i>E</i><sub>a</sub> = −gradient × <i>R</i> = −(−6200) × 8.31.',tip:'Activation energy is always positive.'},
{t:'Convert the units',x:'<i>R</i> is in J K<sup>−1</sup> mol<sup>−1</sup>, so the answer is in J mol<sup>−1</sup>. Divide by 1000 for kJ mol<sup>−1</sup>.',tip:'Give 3 significant figures and a + sign or no sign.'},
{t:'Check against the mark scheme',x:'All four marks earned. These mistakes lose marks most often:',end:1}],
mis:['Ignoring the × 10<sup>−3</sup> in the axis label.','Giving a negative activation energy.','Forgetting to divide by 1000 to get kJ mol<sup>−1</sup>.','Using two data points that are not on the best-fit line.'],
your:{kind:'num',q:'Another reaction gives a line with gradient −9500 K on a graph of ln <i>k</i> against 1/<i>T</i>. Calculate <i>E</i><sub>a</sub> in kJ mol<sup>−1</sup>. Give 3 significant figures.',ans:78.9,tol:0.15,
 ok:'Correct: <i>E</i><sub>a</sub> = 9500 × 8.31 = 78 945 J mol<sup>−1</sup> = <b>78.9 kJ mol<sup>−1</sup></b>.',
 wrong:[[78945,30,'That is in J mol<sup>−1</sup>. Divide by 1000.'],[-78.9,0.2,'Activation energy is positive: <i>E</i><sub>a</sub> = −gradient × <i>R</i>.'],[1.14,0.02,'You divided by <i>R</i>. Multiply the gradient by <i>R</i> instead.']]}

title:'How a heterogeneous catalyst speeds up a gas reaction',

function flyAll(){
  var targets=document.querySelectorAll('#lines [data-at="'+n+'"] [data-fly]');
  [].forEach.call(targets,function(t,i){
    var src=document.querySelector('[data-k="'+t.getAttribute('data-fly')+'"]');
