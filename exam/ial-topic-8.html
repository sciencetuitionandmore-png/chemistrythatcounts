<script>

var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

function T(x,y,s,c,ex){return '<text x="'+x+'" y="'+y+'"'+(c?' class="'+c+'"':'')+(ex?' '+ex:'')+'>'+s+'</text>'}

/* mass spectrum */
function spec(o){
  var w=330,h=o.h||230,L=44,R=w-10,Tp=14,B=h-34,s='';
  function X(m){return o.px?L+o.px[m]*(R-L):L+(m-o.min)/(o.max-o.min)*(R-L)}
  function Y(v){return B-v/o.ymax*(B-Tp)}
  for(var t=0;t<=o.ymax;t+=o.step){s+='<line class="grid" x1="'+L+'" x2="'+R+'" y1="'+Y(t)+'" y2="'+Y(t)+'"/>'+T(L-6,Y(t)+4,t,'sm','text-anchor="end"')}
  s+='<path class="ax" d="M'+L+' '+Tp+'V'+B+'H'+R+'"/>';
  if(o.brk){var bx=L+o.brk*(R-L);s+='<path d="M'+(bx-6)+' '+(B+5)+'l6 -10M'+bx+' '+(B+5)+'l6 -10" stroke="#14313d" stroke-width="1.3"/><rect x="'+(bx-3)+'" y="'+(B-2)+'" width="6" height="4" fill="#fff"/>'}
  o.bars.forEach(function(b){var x=X(b.m),y=Y(b.v);
    s+='<rect class="bar"'+(b.hot?' data-hot="'+b.hot+'"':'')+' x="'+(x-7)+'" y="'+y+'" width="14" height="'+(B-y)+'"/>';
    s+=T(x,B+15,b.m,'',b.km?'text-anchor="middle" data-k="'+b.km+'"':'text-anchor="middle"');
    if(b.lab)s+=T(x,y-5,b.lab,'sm',(b.kv?'data-k="'+b.kv+'" ':'')+'text-anchor="middle"');});
  s+=T((L+R)/2,h-3,'<tspan font-style="italic">m/z</tspan>','sm','text-anchor="middle"');
  s+=T(12,(Tp+B)/2,o.yl,'sm','text-anchor="middle" transform="rotate(-90 12 '+(Tp+B)/2+')"');
  return {s:s,X:X,Y:Y,B:B};
}
/* line / point graph */
function lineG(o){
  var w=330,h=o.h||240,L=46,R=w-10,Tp=14,B=h-36,n=o.v.length,s='';
  function X(i){return L+14+i*(R-L-28)/(n-1)}
  function Y(v){return B-(v-o.y0)/(o.y1-o.y0)*(B-Tp)}
  for(var t=o.y0;t<=o.y1+1e-9;t+=o.step){var tt=Math.round(t*10)/10;s+='<line class="grid" x1="'+L+'" x2="'+R+'" y1="'+Y(tt)+'" y2="'+Y(tt)+'"/>'+T(L-6,Y(tt)+4,tt,'sm','text-anchor="end"')}
  s+='<path class="ax" d="M'+L+' '+Tp+'V'+B+'H'+R+'"/>';
  var d='';o.v.forEach(function(v,i){d+=(i?'L':'M')+X(i)+' '+Y(v)});
  s+='<path class="ln" d="'+d+'"/>';
  o.v.forEach(function(v,i){s+='<circle class="pt" r="4" cx="'+X(i)+'" cy="'+Y(v)+'"'+(o.hot&&o.hot[i]?' data-hot="'+o.hot[i]+'"':'')+'/>'+T(X(i),B+15,o.lab[i],'sm','text-anchor="middle"')});
  s+=T((L+R)/2,h-4,o.xl,'sm','text-anchor="middle"');
  s+=T(11,(Tp+B)/2,o.yl,'sm','text-anchor="middle" transform="rotate(-90 11 '+(Tp+B)/2+')"');
  return {s:s,X:X,Y:Y,B:B};
}

  if(c==='u')s+=arrow(x+14,y,1);if(c==='ud')s+=arrow(x+9,y,1)+arrow(x+19,y,0);return s}
function orbRow(y,el,cfg,s3,p3,ie,hot){
  var s=T(6,y+18,el,'',' font-weight="700" font-size="15"')+T(36,y+18,'[Ne]','sm');

  return s;
}
/* shell diagram */
function atom(cx,cy,z,sh,hotOuter){
  var s='',r=16;
  sh.forEach(function(n,k){var R=r+8+k*13;s+='<circle class="sh" cx="'+cx+'" cy="'+cy+'" r="'+R+'"/>';
    for(var j=0;j<n;j++){var a=-Math.PI/2+j*2*Math.PI/n+(k%2?0.3:0);var last=k===sh.length-1;
      s+='<circle class="el"'+(last&&hotOuter?' data-hot="'+hotOuter+'"':'')+' r="3.2" cx="'+(cx+R*Math.cos(a)).toFixed(1)+'" cy="'+(cy+R*Math.sin(a)).toFixed(1)+'"/>'}});
  s+='<circle class="nuc" cx="'+cx+'" cy="'+cy+'" r="'+r+'"/>'+T(cx,cy+4,z+'+','nt','text-anchor="middle"');
  return s;
}

W.push({btn:'Group 2 trends',spec:[["8.12","reactivity down Groups 1 and 2"],["8.11","ionisation energy trend"],["8.15","solubility of hydroxides and sulfates"]],type:'Explain',marks:4,
title:'Explaining the trend in reactivity of the Group 2 metals with water',
q:'<p><span class="mk">(4)</span>Magnesium reacts very slowly with cold water, but barium reacts quickly.</p><p><mark>Explain</mark> this trend and describe the trends in <mark>solubility</mark> of the Group 2 hydroxides and sulfates.</p>',
diag:function(){var s='';
  s+=tbl(10,10,[70,80,80,80],28,[['metal','reactivity','M(OH)₂','MSO₄'],['Mg','slow','sparingly','soluble'],['Ca','moderate','slightly','slightly'],['Sr','fast','more','less'],['Ba','fastest','soluble','insoluble']],{1:'1',4:'2 3 4'});
  s+=G(1,T(20,170,'down the group: bigger atoms, more shielding','an'));
  s+=G(2,T(20,190,'→ outer electrons lost more easily','an'));
  return svg(330,202,s)},
lines:plan(['atomic radius and shielding','ionisation energy','reactivity','solubility trends'])+
 ans(1,'','','Down the group, atoms have <span class="hl">more shells</span>, so the outer electrons are <span class="hl">further from the nucleus</span> and <span class="hl">more shielded</span>.','M1')+
 ans(2,'','','The attraction for the outer electrons is weaker, so the <span class="hl">first and second ionisation energies decrease</span>.','M2')+
 ans(3,'','','So the metals lose electrons more easily and become <span class="hl">more reactive</span>: M + 2H<sub>2</sub>O → M(OH)<sub>2</sub> + H<sub>2</sub>.','')+
 ans(4,'Both hydroxides and sulfates get more soluble.','They go in opposite directions.','Hydroxides become <span class="hl">more soluble</span> down the group; sulfates become <span class="hl">less soluble</span> (BaSO<sub>4</sub> is insoluble).','M3 M4'),
chips:[['M1','more shells/shielding',1],['M2','ionisation energies fall',2],['M3','hydroxides more soluble',4],['M4','sulfates less soluble',4]],
steps:[
{t:'Read and plan',x:'Reactivity of metals depends on how easily they lose their outer electrons. Group 2 metals lose two electrons to form M<sup>2+</sup>.',tip:'Use nuclear charge, distance and shielding together.'},
{t:'Size and shielding',x:'Each element down the group has an extra shell. The increase in nuclear charge is outweighed by the extra distance and shielding.',tip:'Write "the outer electrons are further from the nucleus".'},
{t:'Ionisation energy',x:'Less energy is needed to remove the two outer electrons.',tip:'This is the same reason Group 1 metals get more reactive down the group.'},
{t:'Reactivity',x:'Barium reacts rapidly with cold water; magnesium reacts very slowly with cold water but burns in steam to form MgO + H<sub>2</sub>.',tip:'The solutions formed are alkaline, and more alkaline down the group.'},
{t:'Solubility',x:'Group 2 hydroxides become more soluble down the group. Sulfates become less soluble. Barium chloride is used to test for sulfate ions: a white precipitate of BaSO<sub>4</sub>.',tip:'Mg(OH)<sub>2</sub> is used as an antacid because it is only sparingly soluble.'},
{t:'Check against the mark scheme',x:'All four marks earned. These mistakes lose marks most often:',end:1}],
mis:['Saying nuclear charge decreases down the group.','Saying the atoms "want" to lose electrons.','Mixing up the hydroxide and sulfate trends.','Forgetting to mention ionisation energy.'],
your:{kind:'text',marks:2,q:'Describe how to test a solution for sulfate ions, giving the result. (2)',
 ms:['Add dilute hydrochloric acid (to remove carbonate), then barium chloride solution.','A white precipitate of barium sulfate forms if sulfate ions are present.'],

document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest(".spd button");if(b)setSP(+b.getAttribute("data-sp"))});
setTimeout(function(){setSP(SP)},0);
var cur=0,n=0,w=null;

W.forEach(function(x,i){var b=document.createElement('button');b.className='pick';b.innerHTML=(i+1)+'. '+x.btn+'<small>'+x.type+' · '+x.marks+' marks</small>';b.onclick=function(){load(i)};pk.appendChild(b)});
function load(i){
  cur=i;w=W[i];n=0;
  [].forEach.call(pk.children,function(b,k){b.setAttribute('aria-pressed',k===i)});
  $('eyebrow').textContent='IAL Chemistry · Unit 2 · Topic 8 · Exam-style question · '+w.marks+' marks';
  $('title').innerHTML=w.title;$('spec').innerHTML=(w.spec||[]).map(function(c){return '<span class="sp"><b>Spec '+c[0]+'</b>'+c[1]+'</span>'}).join('');$('q').innerHTML=w.q;
  $('diag').innerHTML=w.diag();$('lines').innerHTML=w.lines;
  $('chips').innerHTML='<span class="lb">MARK SCHEME</span>'+w.chips.map(function(c){return '<span class="chip" data-c="'+c[2]+'"><i></i><b>'+c[0]+'</b>'+c[1]+'</span>'}).join('');
  var d='';for(var k=0;k<w.steps.length;k++)d+='<button class="dot" aria-label="Go to step '+(k+1)+'" data-k="'+k+'"></button>';$('dots').innerHTML=d;
  buildYour();update(true);
}
var FL=[];
function update(quiet){
  FL.forEach(function(a){try{a.finish()}catch(e){}});FL=[];
  var st=w.steps[n],root=document.querySelector('.wrap');
  [].forEach.call(document.querySelectorAll('#stage [data-at]'),function(e){var a=+e.getAttribute('data-at');e.classList.toggle('on',a<=n);e.classList.toggle('now',a===n&&!quiet)});
  [].forEach.call(document.querySelectorAll('#stage [data-hot]'),function(e){e.classList.toggle('hot',e.getAttribute('data-hot').split(' ').indexOf(String(n))>=0)});
  var nw=document.querySelectorAll('#lines .now');[].forEach.call(nw,function(e,k){e.style.animationDelay=(RM?0:k*1.1*SP)+'s'});[].forEach.call(document.querySelectorAll('#diag .now'),function(e){e.style.transitionDelay=(RM?0:0.3*SP)+'s'});var cd=(quiet||RM)?0:((Math.max(nw.length,1)*1.1+0.3)*SP);(window.__ct||[]).forEach(clearTimeout);window.__ct=[];[].forEach.call(document.querySelectorAll('#chips .chip'),function(c){var a=+c.getAttribute('data-c'),fresh=a===n&&!quiet;c.classList.remove('new');if(fresh&&cd>0){c.classList.remove('on');window.__ct.push(setTimeout(function(){c.classList.add('on');void c.offsetWidth;c.classList.add('new')},cd*1000))}else{c.classList.toggle('on',a<=n);if(fresh){void c.offsetWidth;c.classList.add('new')}}});
  $('stepc').textContent='Step '+(n+1)+' of '+w.steps.length;
  $('stitle').innerHTML=st.t;$('stext').innerHTML=st.x;
  $('sextra').innerHTML=st.end?'<ul class="mis">'+w.mis.map(function(m){return '<li>'+m+'</li>'}).join('')+'</ul>':'<div class="tip"><b>Exam tip:</b> '+st.tip+'</div>';
  [].forEach.call(document.querySelectorAll('#dots .dot'),function(d,k){d.className='dot'+(k<n?' done':'')+(k===n?' cur':'')});
  $('back').disabled=n===0;
  var last=n===w.steps.length-1;$('next').innerHTML=last?'Start again':'Next step →';
  [].forEach.call(document.querySelectorAll('#q mark'),function(m){m.classList.remove('pulse')});
  if(!quiet)flyAll();

function flyAll(){
  var targets=document.querySelectorAll('#lines [data-at="'+n+'"] [data-fly]');
  [].forEach.call(targets,function(t,i){
    var src=document.querySelector('[data-k="'+t.getAttribute('data-fly')+'"]');
    if(!src)return;
    if(src.tagName==='MARK')src.classList.add('pulse');
    if(RM||!t.animate){t.classList.add('land');return}
    var a=src.getBoundingClientRect(),b=t.getBoundingClientRect();
    if(!a.width||!b.width){t.classList.add('land');return}
    var f=document.createElement('span');f.className='flyer';f.textContent=t.textContent;f.style.left=a.left+'px';f.style.top=a.top+'px';
    t.classList.add('wait');document.body.appendChild(f);
    var an=f.animate([{transform:'translate(0,0)',opacity:.3},{transform:'translate(0,0)',opacity:1,offset:.15},{transform:'translate('+(b.left-a.left)+'px,'+(b.top-a.top)+'px)',opacity:1}],{duration:1200*SP,delay:((function(){var l=t.closest('[data-at]');return l?(parseFloat(l.style.animationDelay)||0)*1000:0})())+(350+(i%3)*300)*SP,easing:'ease-in-out',fill:'both'});
    FL.push(an);an.onfinish=function(){f.remove();t.classList.remove('wait');t.classList.add('land')};
  });
}
function go(k){if(!w)return;k=Math.max(0,Math.min(w.steps.length-1,k));if(k===n)return;n=k;update()}
$('next').onclick=function(){if(n===w.steps.length-1){n=0;update()}else go(n+1)};
$('back').onclick=function(){go(n-1)};
$('replay').onclick=function(){n=0;update()};
$('dots').onclick=function(e){var k=e.target.getAttribute('data-k');if(k!==null)go(+k)};
document.addEventListener('keydown',function(e){var tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA')return;if(e.key==='ArrowRight'){go(n+1);e.preventDefault()}else if(e.key==='ArrowLeft'){go(n-1);e.preventDefault()}});
var tx=null;$('stage').addEventListener('touchstart',function(e){tx=e.touches[0].clientX},{passive:true});
$('stage').addEventListener('touchend',function(e){if(tx===null)return;var dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50)go(n+(dx<0?1:-1))});

function buildYour(){
  var y=w.your,h='<h3>Your turn</h3><p class="yq">'+y.q+'</p>';
  if(y.kind==='num'){h+='<div class="row"><label for="yin" style="font-size:14px">Answer:</label><input type="text" id="yin" inputmode="decimal" autocomplete="off"><button class="btn pri" id="ychk">Check</button><button class="btn" id="yshow">Show answer</button></div><div class="fb" id="yfb" aria-live="polite"></div>';}
  else{h+='<label for="yta" class="sr" style="position:absolute;left:-9999px">Your answer</label><textarea id="yta" placeholder="Write your answer here, one idea per sentence…"></textarea><div class="row" style="margin-top:6px"><button class="btn pri" id="yms">Show mark scheme</button></div><div id="yfb" aria-live="polite"></div>';}
  $('your').innerHTML=h;
  if(y.kind==='num'){
    var chk=function(){var raw=$('yin').value.replace(',', '.').replace(/[^\d.\-]/g,''),v=parseFloat(raw),fb=$('yfb');
      if(isNaN(v)){fb.className='fb no';fb.textContent='Type a number first.';return}
      for(var i=0;i<y.wrong.length;i++){if(Math.abs(v-y.wrong[i][0])<=y.wrong[i][1]){fb.className='fb no';fb.innerHTML=y.wrong[i][2];return}}
      if(Math.abs(v-y.ans)<=y.tol){fb.className='fb ok';fb.innerHTML=y.ok;return}
      fb.className='fb no';fb.innerHTML='Not quite. Go back through the walkthrough steps and check each line of working.';};
    $('ychk').onclick=chk;$('yin').onkeydown=function(e){if(e.key==='Enter')chk()};
    $('yshow').onclick=function(){$('yfb').className='fb ok';$('yfb').innerHTML=y.ok};
  }else{
    $('yms').onclick=function(){var txt=$('yta').value,fb=$('yfb'),s='<ul class="ms">';
      y.ms.forEach(function(m,i){s+='<li><label><input type="checkbox" data-i="'+i+'"><span><b class="mt" style="margin:0 4px 0 0">M'+(i+1)+'</b>'+m+'</span></label></li>'});
      s+='</ul><div class="tally" id="ytal">Tick the points you made: 0 / '+y.marks+'</div>';
      var warns=y.warn.filter(function(x){return x[0].test(txt)});
      if(!txt.trim())s+='<div class="warn">Tip: write your answer first, then mark it. You learn more that way.</div>';
      warns.forEach(function(x){s+='<div class="warn"><b>Watch out:</b> '+x[1]+'</div>'});
      fb.innerHTML=s;
      fb.onchange=function(){var c=fb.querySelectorAll('input:checked').length;$('ytal').textContent='Tick the points you made: '+c+' / '+y.marks+(c===y.marks?' — full marks!':'')};
    };
  }
}
