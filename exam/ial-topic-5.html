<style>
:root{--bg:#eef2f4;--paper:#fff;--ink:#14313d;--muted:#5b7380;--line:#c9d5db;--accent:#0b5d75;--spark:#e08a00;--spark-soft:#fff1d6;--good:#1f7a4a;--good-soft:#dcf1e5;--bad:#b3261e;--bad-soft:#fbe4e2;
--h:'Lexend',system-ui,'Segoe UI',Arial,sans-serif;--b:'Atkinson Hyperlegible',system-ui,'Segoe UI',Arial,sans-serif;--m:'JetBrains Mono',ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--b)}
.wrap{max-width:760px;margin:0 auto;padding:14px 16px 20px}
h1,h2,h3{font-family:var(--h);margin:0;line-height:1.2}
.top h1{font-size:19px;font-weight:700}
.top p{margin:2px 0 10px;color:var(--muted);font-size:14px}
.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pick{font-family:var(--h);text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer;color:var(--ink);font-size:13.5px;font-weight:600;line-height:1.25;min-height:54px}
.pick small{display:block;font-family:var(--b);font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}
.pick:hover{border-color:var(--accent)}
.pick[aria-pressed=true]{border-color:var(--accent);background:#e3eff3;box-shadow:inset 0 0 0 1px var(--accent)}
.pick:focus-visible,.btn:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--spark);outline-offset:2px}
.eyebrow{font-family:var(--m);font-size:11.5px;letter-spacing:.02em;color:var(--accent);text-transform:uppercase}
#title{font-size:20px;margin:3px 0 8px}
.q{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;min-height:118px;font-size:15.5px}
.q p{margin:0 0 5px}.q p:last-child{margin:0}
.q .mk{float:right;font-family:var(--m);font-size:13px;color:var(--muted);margin-left:8px}
mark{background:var(--spark-soft);color:inherit;border-radius:3px;padding:0 2px;transition:box-shadow .3s}
mark.pulse{box-shadow:0 0 0 2px var(--spark)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 8px;min-height:30px}
.chips .lb{font-family:var(--m);font-size:11.5px;color:var(--muted);margin-right:2px}
.chip{font-size:12.5px;border:1.5px solid var(--line);border-radius:99px;padding:2px 9px 2px 6px;background:var(--paper);color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.chip b{font-family:var(--m);font-weight:500;font-size:12px}
.chip i{font-style:normal;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line);display:inline-grid;place-items:center;font-size:10px;line-height:1}
.chip.on{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.chip.on i{background:var(--good);border-color:var(--good);color:#fff}
.chip.on i::after{content:"\2713"}
.chip.new{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.12)}}
.stage{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:12px;min-height:392px;display:grid;grid-template-columns:330px 1fr;gap:14px;position:relative;
background-image:linear-gradient(transparent 27px,#f1f5f7 28px);background-size:100% 28px}
#diag svg{width:100%;height:auto;display:block}
#diag text{font-family:var(--b);font-size:12px;fill:var(--ink)}
#diag .sm{font-size:10.5px;fill:var(--muted)}
#diag .ax{stroke:var(--ink);stroke-width:1.3;fill:none}
#diag .grid{stroke:#e2e9ec;stroke-width:1}
#diag .bar{fill:var(--accent);transition:fill .3s}
#diag .bar.hot,#diag .pt.hot{fill:var(--spark)}
#diag .pt{fill:var(--accent);transition:fill .3s}
#diag .ln{stroke:var(--accent);stroke-width:2;fill:none}
#diag .an{fill:var(--spark)}#diag text.an{fill:#a86400;font-weight:700}
#diag .anl{stroke:var(--spark);stroke-width:2;fill:none;stroke-dasharray:5 4}
#diag .ring{fill:none;stroke:transparent;stroke-width:2.5;transition:stroke .3s}
#diag .ring.hot{stroke:var(--spark)}
#diag .bx{fill:#fff;stroke:var(--ink);stroke-width:1.3}
#diag .bx.hot{fill:var(--spark-soft);stroke:var(--spark)}
#diag .e{stroke:var(--ink);stroke-width:1.6;fill:none}
#diag .band{fill:var(--spark-soft);stroke:none}
#diag .sh{fill:none;stroke:#9fb3bd;stroke-width:1.2}
#diag .nuc{fill:var(--accent)}#diag text.nt{fill:#fff;font-weight:700;font-size:11px}
#diag .el{fill:var(--ink)}#diag .el.hot{fill:var(--spark)}
#diag [data-at]{opacity:0;transition:opacity calc(.8s*var(--sp,1))}
#diag [data-at].on{opacity:1}
#lines{font-size:15.5px;min-width:0}
#lines [data-at]{display:none}
#lines [data-at].on{display:block}
#lines .now{animation:rise calc(.9s*var(--sp,1)) ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.plan{font-size:13px;color:var(--muted);margin-bottom:8px;border-bottom:1px dashed var(--line);padding-bottom:7px}
.plan span{display:inline-block;background:#e3eff3;color:var(--accent);border-radius:5px;padding:1px 7px;margin:2px 3px 0 0;font-weight:700}
.wl{font-family:var(--m);font-size:14px;line-height:1.75;white-space:nowrap;overflow-x:auto}
.wl.ans1{font-size:15px}
.wl .box{border:2px solid var(--good);border-radius:5px;padding:1px 8px;background:var(--good-soft)}
.wl .mt,.ans .mt{font-family:var(--m)}
.mt{display:inline-block;font-size:11px;background:var(--good);color:#fff;border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px;line-height:1.5}
.ans{margin:0 0 8px}
.ans p{margin:0}
.hl{background:linear-gradient(var(--spark-soft),var(--spark-soft)) no-repeat 0 0/0 100%;transition:background-size .8s .15s;border-radius:3px;padding:0 1px;font-weight:700}
.on .hl{background-size:100% 100%}
.weak{display:none;font-size:13.5px;background:var(--bad-soft);border-radius:6px;padding:4px 8px;margin-bottom:5px}
.weak s{color:var(--bad)}
.weak em{font-style:normal;color:var(--ink)}
.now .weak{display:block}
.lab{font-family:var(--m);font-size:10.5px;text-transform:uppercase;border-radius:3px;padding:0 4px;margin-right:4px;color:#fff;vertical-align:1px}
.lab.bad{background:var(--bad)}.lab.ok{background:var(--good)}
.ans:not(.now) .lab.ok{display:none}
.now.ans p{background:#f3faf6;border-radius:6px;padding:3px 6px;margin-left:-6px}
.flyer{position:fixed;z-index:9;font-family:var(--m);font-size:14px;background:var(--spark);color:#fff;border-radius:4px;padding:0 4px;pointer-events:none}
[data-fly]{transition:color .2s}
[data-fly].wait{color:transparent}
[data-fly].land{background:var(--spark-soft);border-radius:3px}
.narr{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:10px;min-height:150px}
.stepc{font-family:var(--m);font-size:12px;color:var(--muted)}
#stitle{font-size:16.5px;margin:2px 0 4px}
#stext{margin:0 0 7px;font-size:15.5px}
.tip{background:var(--spark-soft);border-left:4px solid var(--spark);border-radius:6px;padding:6px 10px;font-size:14.5px}
.tip b{color:#9a5a00}
.mis{margin:4px 0 0;padding-left:20px;font-size:14.5px}
.mis li{margin-bottom:2px}
.ctrl{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{font-family:var(--h);font-size:14.5px;font-weight:600;border:1.5px solid var(--accent);background:var(--paper);color:var(--accent);border-radius:8px;padding:7px 14px;cursor:pointer;min-height:40px}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);color:#fff}
.dots{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
.dot{width:11px;height:11px;border-radius:50%;background:var(--line);border:0;padding:0;cursor:pointer}
.dot.done{background:var(--accent)}.dot.cur{background:var(--spark);transform:scale(1.25)}
.your{background:var(--paper);border:1.5px dashed var(--accent);border-radius:10px;padding:10px 14px;margin-top:12px;min-height:236px}
.your h3{font-size:16px;color:var(--accent)}
.your .yq{margin:4px 0 8px;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text]{font:15px var(--m);padding:7px 9px;border:1.5px solid var(--line);border-radius:7px;width:140px}
textarea{width:100%;min-height:74px;font:15px/1.4 var(--b);padding:7px 9px;border:1.5px solid var(--line);border-radius:7px;resize:vertical}
.fb{margin-top:7px;font-size:14.5px;border-radius:7px;padding:0}
.fb.ok{background:var(--good-soft);color:var(--good);padding:6px 10px}
.fb.no{background:var(--bad-soft);color:#7d1b15;padding:6px 10px}
.ms{list-style:none;padding:0;margin:6px 0 0;font-size:14.5px}
.ms li{margin:3px 0}
.ms label{display:flex;gap:7px;align-items:flex-start;cursor:pointer}
.ms input{margin-top:4px;width:17px;height:17px;accent-color:var(--good)}
.warn{background:var(--spark-soft);border-radius:6px;padding:5px 9px;margin-top:6px;font-size:14px}
.tally{font-family:var(--m);font-size:13px;color:var(--good);margin-top:4px}
sub,sup{line-height:0}
@media (max-width:720px){.stage{grid-template-columns:1fr}#diag{max-width:360px;margin:0 auto;width:100%}.picker{grid-template-columns:repeat(2,1fr)}}
@media (max-width:400px){.picker{grid-template-columns:1fr 1fr}.pick{font-size:12.5px}.dots{margin-left:0;width:100%}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.specs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.specs .sp{font-family:var(--m);font-size:12px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:#fff}
.specs .sp b{color:var(--accent);font-weight:600;margin-right:3px}
.ck{margin-top:16px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px}
.ck h3{margin:0 0 2px;font-size:1.05rem}
.ck .ckp{margin:0 0 10px;font-size:.92rem;color:var(--muted)}
.ck .bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:#e6ecef;margin:4px 0 4px}
.ck .bar i{display:block;height:100%;transition:width .4s}
.ck .bar .g{background:#1f7a4a}.ck .bar .a{background:#e08a00}.ck .bar .r{background:#b9473a}
.ck .sum{font-family:var(--m);font-size:12px;color:var(--muted);margin-bottom:8px}
.ck ul{list-style:none;margin:0;padding:0}
.ck li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 0;border-top:1px solid #e6ecef}
.ck .no{font-family:var(--m);font-size:12px;color:var(--accent);min-width:38px;font-weight:600}
.ck .tx{flex:1 1 260px;font-size:.92rem;min-width:0}
.ck .rag{display:flex;gap:4px}
.ck .rag button{font:600 12px var(--h);border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:4px 9px;cursor:pointer;min-height:30px}
.ck .rag button[aria-pressed=true][data-v=r]{background:#fbe4de;border-color:#b9473a;color:#8f2d22}
.ck .rag button[aria-pressed=true][data-v=a]{background:#fff1d6;border-color:#e08a00;color:#8a5200}
.ck .rag button[aria-pressed=true][data-v=g]{background:#dcf1e5;border-color:#1f7a4a;color:#1f7a4a}
.ck .go{font:600 12px var(--h);border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;padding:4px 2px}
.ck .rag button:focus-visible,.ck .go:focus-visible{outline:3px solid #e08a00;outline-offset:2px}
.ck .rst{margin-top:8px;font:600 12px var(--h);border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:8px;padding:5px 10px;cursor:pointer}
.specs{margin-top:6px}.wrap{max-width:1100px}
.picker{grid-template-columns:repeat(4,1fr)}
.play{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start;margin-top:10px}
.play .stage{grid-template-columns:minmax(200px,330px) minmax(0,1fr)}
.play .wl{white-space:normal}
.side .ctrl{margin-top:0;gap:6px}.side .ctrl .btn{padding:7px 10px}
.side .ctrl .pri{margin-left:auto}.side .dots{margin-left:0;width:100%;order:9}
.side .chips{margin:10px 0 0}.side .narr{margin-top:10px}
@media (max-width:860px){.play{grid-template-columns:1fr}.side{order:-1}.picker{grid-template-columns:repeat(2,1fr)}}
@media (max-width:720px){.play .stage{grid-template-columns:1fr}}
.spd{order:10;width:100%;display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}
.spd button{font:600 12px var(--h);border:1.5px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:3px 10px;cursor:pointer;min-height:28px}
.spd button[aria-pressed=true]{border-color:var(--accent);background:var(--accent);color:#fff}

#diag text.il{font-size:10px;font-weight:700;fill:var(--ink)}
#diag text.hd{font-family:var(--h);font-size:12.5px;font-weight:700;fill:var(--ink)}
#diag text.at{font-family:var(--h);font-size:17px;font-weight:700;fill:var(--ink)}
#diag text.big{font-family:var(--h);font-size:15px;font-weight:700;fill:#a86400}
#diag text.dl{font-size:11px;font-weight:700;fill:var(--accent)}
#diag text.xe{font-size:17px;font-weight:700;fill:var(--accent);transition:fill .3s}
#diag .hot text.xe,#diag .hot .de{fill:var(--spark)}
#diag .de{fill:var(--ink);transition:fill .3s}
#diag .ip{fill:#d9ecf2;stroke:var(--accent);stroke-width:1.4;transition:stroke .3s,stroke-width .3s}
#diag .in{fill:#fbe9d6;stroke:#b86a12;stroke-width:1.4;transition:stroke .3s,stroke-width .3s}
#diag .ip.hot,#diag .in.hot{stroke:var(--spark);stroke-width:3}
#diag .ghost{fill:none;stroke:#b8c6cd;stroke-width:1.2;stroke-dasharray:4 4}
#diag path.in.on ~ .cl0{opacity:0}
#diag .cl0{transition:opacity calc(.8s*var(--sp,1))}
#diag .share{fill:rgba(224,138,0,.35)}
#diag .dp{stroke:var(--accent);stroke-width:2;fill:none;marker-end:url(#ah)}
#diag .po{stroke:var(--spark);stroke-width:2.2;fill:none;marker-end:url(#ao)}
#diag .barr{stroke:var(--spark);stroke-width:3.5;fill:none;marker-end:url(#ao)}
#diag .bd{stroke:var(--ink);stroke-width:2.4;transition:stroke .3s}
#diag .bd.cv.hot{stroke:var(--spark);stroke-width:3.4}
#diag .wedge{fill:var(--ink)}
#diag .brk{fill:none;stroke:var(--ink);stroke-width:2}
#diag .lobe{fill:#e3eff3;stroke:var(--accent);stroke-width:1.3;transition:fill .3s}
#diag .lobe.hot{fill:var(--spark-soft);stroke:var(--spark)}
#diag .atn{fill:#2c4b57}#diag .atc{fill:#3f9a5a}#diag .ath{fill:#fff;stroke:var(--ink);stroke-width:1.3}
#diag .ats{fill:#8a6d3b}#diag .ato{fill:#c8442f}
#diag .atn+text.il,#diag .atc+text.il,#diag .ats+text.il,#diag .ato+text.il{fill:#fff}
#diag .imf{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-dasharray:3 4;transition:stroke .3s}
#diag .imf.hot{stroke:var(--spark);stroke-width:2.4}
#diag .sea{fill:#e8f1f4}

#diag .sk{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round;transition:stroke .3s}
#diag .sk.hot{stroke:var(--spark);stroke-width:3.4}
#diag .sk.dup{stroke:#9fb3bd;stroke-dasharray:5 4}
#diag text.nm{font-family:var(--h);font-size:13px;font-weight:700;fill:var(--ink)}
#diag text.num{font-family:var(--m);font-size:11px;fill:var(--accent);font-weight:700}
#diag text.eq{font-family:var(--m);font-size:13px;fill:var(--ink)}
#diag text.at2{font-family:var(--h);font-size:15px;font-weight:700;fill:var(--ink);transition:fill .3s}
#diag text.at2.hot{fill:var(--spark)}
#diag text.at2s{font-family:var(--h);font-size:11px;font-weight:700;fill:var(--muted)}
#diag text.plus{font-size:18px;font-weight:700;fill:var(--spark)}
#diag .cut{stroke:var(--spark);stroke-width:2.5;stroke-dasharray:4 3}
#diag .card{fill:#fff;stroke:var(--line);stroke-width:1.4}
#diag .card.g{fill:var(--good-soft);stroke:var(--good)}
#diag .card.o{fill:var(--spark-soft);stroke:var(--spark)}
#diag .card.t{fill:#e3eff3;stroke:var(--accent)}
#diag .card.hot2{stroke:var(--spark);stroke-width:2.5}
#diag .loop{fill:none;stroke:var(--spark);stroke-width:2;marker-end:url(#ao)}
#diag .ca{fill:none;stroke:var(--spark);stroke-width:2.2;marker-end:url(#ao)}
#diag .fh{fill:none;stroke:var(--spark);stroke-width:2;marker-end:url(#hh)}
#diag .glass{fill:none;stroke:var(--ink);stroke-width:2}
#diag .liq{fill:#e8892b;opacity:.85}
#diag .clear{fill:#f3f8fb}
#diag .sig{fill:rgba(11,93,117,.25);stroke:var(--accent);stroke-width:1.2;transition:fill .3s}
#diag .sig.hot{fill:rgba(224,138,0,.45)}
#diag .pib{fill:rgba(224,138,0,.35)}
#diag .bd.ext.hot{stroke:var(--spark)}
</style>

<div class="top"><h1>Alkenes: how to answer exam questions</h1>
<p>Pick a question. Click <b>Next step</b> (or press →) to watch the answer build, mark by mark.</p></div>

<script>
(function(){
"use strict";
var RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function $(id){return document.getElementById(id)}
function T(x,y,s,c,ex){return '<text x="'+x+'" y="'+y+'"'+(c?' class="'+c+'"':'')+(ex?' '+ex:'')+'>'+s+'</text>'}
function A(at){return at==null?'':' data-at="'+at+'"'}
function svg(w,h,body){return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="diagram">'+body+'</svg>'}

/* mass spectrum */
function spec(o){
  var w=330,h=o.h||230,L=44,R=w-10,Tp=14,B=h-34,s='';
  function X(m){return o.px?L+o.px[m]*(R-L):L+(m-o.min)/(o.max-o.min)*(R-L)}
  function Y(v){return B-v/o.ymax*(B-Tp)}

  var nw=document.querySelectorAll('#lines .now');[].forEach.call(nw,function(e,k){e.style.animationDelay=(RM?0:k*1.1*SP)+'s'});[].forEach.call(document.querySelectorAll('#diag .now'),function(e){e.style.transitionDelay=(RM?0:0.3*SP)+'s'});var cd=(quiet||RM)?0:((Math.max(nw.length,1)*1.1+0.3)*SP);(window.__ct||[]).forEach(clearTimeout);window.__ct=[];[].forEach.call(document.querySelectorAll('#chips .chip'),function(c){var a=+c.getAttribute('data-c'),fresh=a===n&&!quiet;c.classList.remove('new');if(fresh&&cd>0){c.classList.remove('on');window.__ct.push(setTimeout(function(){c.classList.add('on');void c.offsetWidth;c.classList.add('new')},cd*1000))}else{c.classList.toggle('on',a<=n);if(fresh){void c.offsetWidth;c.classList.add('new')}}});
  $('stepc').textContent='Step '+(n+1)+' of '+w.steps.length;
  $('stitle').innerHTML=st.t;$('stext').innerHTML=st.x;
  $('sextra').innerHTML=st.end?'<ul class="mis">'+w.mis.map(function(m){return '<li>'+m+'</li>'}).join('')+'</ul>':'<div class="tip"><b>Exam tip:</b> '+st.tip+'</div>';
  [].forEach.call(document.querySelectorAll('#dots .dot'),function(d,k){d.className='dot'+(k<n?' done':'')+(k===n?' cur':'')});
  $('back').disabled=n===0;
  var last=n===w.steps.length-1;$('next').innerHTML=last?'Start again':'Next step →';
  [].forEach.call(document.querySelectorAll('#q mark'),function(m){m.classList.remove('pulse')});

function flyAll(){
  var targets=document.querySelectorAll('#lines [data-at="'+n+'"] [data-fly]');
  [].forEach.call(targets,function(t,i){
    var src=document.querySelector('[data-k="'+t.getAttribute('data-fly')+'"]');
    if(!src)return;
    if(src.tagName==='MARK')src.classList.add('pulse');
    if(RM||!t.animate){t.classList.add('land');return}
    var a=src.getBoundingClientRect(),b=t.getBoundingClientRect();
    if(!a.width||!b.width){t.classList.add('land');return}
    var f=document.createElement('span');f.className='flyer';f.textContent=t.textContent;f.style.left=a.left+'px';f.style.top=a.top+'px';
    t.classList.add('wait');document.body.appendChild(f);
    var an=f.animate([{transform:'translate(0,0)',opacity:.3},{transform:'translate(0,0)',opacity:1,offset:.15},{transform:'translate('+(b.left-a.left)+'px,'+(b.top-a.top)+'px)',opacity:1}],{duration:1200*SP,delay:((function(){var l=t.closest('[data-at]');return l?(parseFloat(l.style.animationDelay)||0)*1000:0})())+(350+(i%3)*300)*SP,easing:'ease-in-out',fill:'both'});
    FL.push(an);an.onfinish=function(){f.remove();t.classList.remove('wait');t.classList.add('land')};
  });
}
function go(k){if(!w)return;k=Math.max(0,Math.min(w.steps.length-1,k));if(k===n)return;n=k;update()}
$('next').onclick=function(){if(n===w.steps.length-1){n=0;update()}else go(n+1)};
$('back').onclick=function(){go(n-1)};
$('replay').onclick=function(){n=0;update()};
$('dots').onclick=function(e){var k=e.target.getAttribute('data-k');if(k!==null)go(+k)};
document.addEventListener('keydown',function(e){var tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA')return;if(e.key==='ArrowRight'){go(n+1);e.preventDefault()}else if(e.key==='ArrowLeft'){go(n-1);e.preventDefault()}});
var tx=null;$('stage').addEventListener('touchstart',function(e){tx=e.touches[0].clientX},{passive:true});
$('stage').addEventListener('touchend',function(e){if(tx===null)return;var dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50)go(n+(dx<0?1:-1))});

function buildYour(){
  var y=w.your,h='<h3>Your turn</h3><p class="yq">'+y.q+'</p>';
  if(y.kind==='num'){h+='<div class="row"><label for="yin" style="font-size:14px">Answer:</label><input type="text" id="yin" inputmode="decimal" autocomplete="off"><button class="btn pri" id="ychk">Check</button><button class="btn" id="yshow">Show answer</button></div><div class="fb" id="yfb" aria-live="polite"></div>';}
  else{h+='<label for="yta" class="sr" style="position:absolute;left:-9999px">Your answer</label><textarea id="yta" placeholder="Write your answer here, one idea per sentence…"></textarea><div class="row" style="margin-top:6px"><button class="btn pri" id="yms">Show mark scheme</button></div><div id="yfb" aria-live="polite"></div>';}
  $('your').innerHTML=h;
  if(y.kind==='num'){
    var chk=function(){var raw=$('yin').value.replace(',', '.').replace(/[^\d.\-]/g,''),v=parseFloat(raw),fb=$('yfb');
      if(isNaN(v)){fb.className='fb no';fb.textContent='Type a number first.';return}
      for(var i=0;i<y.wrong.length;i++){if(Math.abs(v-y.wrong[i][0])<=y.wrong[i][1]){fb.className='fb no';fb.innerHTML=y.wrong[i][2];return}}
      if(Math.abs(v-y.ans)<=y.tol){fb.className='fb ok';fb.innerHTML=y.ok;return}
      fb.className='fb no';fb.innerHTML='Not quite. Go back through the walkthrough steps and check each line of working.';};
    $('ychk').onclick=chk;$('yin').onkeydown=function(e){if(e.key==='Enter')chk()};
    $('yshow').onclick=function(){$('yfb').className='fb ok';$('yfb').innerHTML=y.ok};
  }else{
    $('yms').onclick=function(){var txt=$('yta').value,fb=$('yfb'),s='<ul class="ms">';
      y.ms.forEach(function(m,i){s+='<li><label><input type="checkbox" data-i="'+i+'"><span><b class="mt" style="margin:0 4px 0 0">M'+(i+1)+'</b>'+m+'</span></label></li>'});
      s+='</ul><div class="tally" id="ytal">Tick the points you made: 0 / '+y.marks+'</div>';
      var warns=y.warn.filter(function(x){return x[0].test(txt)});
      if(!txt.trim())s+='<div class="warn">Tip: write your answer first, then mark it. You learn more that way.</div>';
      warns.forEach(function(x){s+='<div class="warn"><b>Watch out:</b> '+x[1]+'</div>'});
      fb.innerHTML=s;
      fb.onchange=function(){var c=fb.querySelectorAll('input:checked').length;$('ytal').textContent='Tick the points you made: '+c+' / '+y.marks+(c===y.marks?' — full marks!':'')};
    };
  }
}
