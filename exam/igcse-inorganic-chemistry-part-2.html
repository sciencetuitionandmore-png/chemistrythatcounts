<style>
:root{--paper:#f2f5f8;--sheet:#fff;--ink:#1c2736;--muted:#5a6878;--line:#cdd6df;--accent:#4a44b5;--accent-soft:#e7e6fb;--good:#1d7a46;--good-soft:#e2f3e8;--bad:#b3261e;--bad-soft:#fbe8e6;--hl:#fff1c7;--amber:#e0a526;--amber-ink:#875700;--amber-soft:#fff8e7}

.bar{height:8px;border-radius:99px;background:var(--paper);overflow:hidden;display:flex;margin:12px 0 6px;border:1px solid var(--line)}

.prac{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px 14px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;cursor:pointer;font-size:15px;text-align:left}

@media (max-width:470px){.picker{grid-template-columns:minmax(0,1fr)}.qc{min-height:0}}

<script>
var PAGE={key:"y11-inorganic",year:"Year 11",group:"Inorganic chemistry part 2",
qs:[
{id:"o2",name:"Percentage of oxygen in air",type:"Calculation",marks:3,
title:"Core practical: percentage of oxygen in air",
spec:["Spec 2.14 core practical: oxygen in air","Spec 2.10 finding % oxygen"],
q:"<p>A student pushes some damp iron wool into the bottom of a measuring cylinder. She turns the cylinder upside down in a trough of water.</p><p>At the start the volume of air in the cylinder is [[92.0 cm³]]. After one week the volume of gas is [[73.4 cm³]].</p><p>[[Calculate]] the percentage by volume of oxygen in the air. Give your answer to [[3 significant figures]]. <b>(3)</b></p>",
M:["Volume of oxygen = 18.6 cm³","18.6 ÷ 92.0 × 100","20.2 % (3 s.f.)"],
foot:"% oxygen = (start volume − end volume) ÷ start volume × 100",
S:[
{t:"Why does the volume fall?",x:"The iron rusts. Rusting uses up the oxygen in the air. Water rises up the cylinder to take its place.",L:["Iron + oxygen + water → rust, so the oxygen is removed."],c:"Oxygen used = start volume − end volume"},
{t:"Volume of oxygen used",x:"Subtract the end volume from the start volume.",L:["{M1}V(oxygen) = 92.0 − 73.4 = **18.6 cm³**"],m:[0],c:"Oxygen used = 18.6 cm³"},
{t:"Turn it into a percentage",x:"Divide by the <b>start</b> volume, because that was 100 % of the air.",tip:"Dividing by the end volume (18.6 ÷ 73.4) gives 25.3 %. This is the most common wrong answer.",L:["{M2}% oxygen = 18.6 ÷ **92.0** × 100"],m:[1]},
{t:"Round to 3 significant figures",x:"The calculator shows 20.217... Three significant figures gives 20.2.",L:["{= M3}% oxygen = **20.2 %**"],m:[2]},
{t:"Check it makes sense",x:"<b>Total: 3 marks.</b> Air is about 21 % oxygen, so 20.2 % is sensible. A slightly low value means not all the oxygen reacted (it was not left long enough).",tip:"If you get an answer like 79.8 %, you have worked out the gas that is left (mostly nitrogen), not the oxygen.",L:["Air is about 21 % oxygen, so 20.2 % is sensible."]}
],
Y:{k:"calc",q:"<p>Two gas syringes are joined by a tube of copper. The copper is heated strongly and [[85.0 cm³]] of air is pushed back and forth over it until the volume stops changing. After cooling to room temperature, [[67.5 cm³]] of gas is left.</p><p>[[Calculate]] the percentage by volume of oxygen in the air, to 3 significant figures.</p>",
a:20.6,tol:0.06,unit:"%",ok:"17.5 ÷ 85.0 × 100 = 20.6 %.",hint:"Find the volume of oxygen used first (start − end), then divide by the start volume.",
w:[[25.9,0.1,"You divided by the end volume. Divide by the start volume (85.0 cm³)."],[79.4,0.1,"That is the percentage of gas left over, not the oxygen used."],[17.5,0.05,"That is the volume of oxygen in cm³. Now make it a percentage."]],
W:["The hot copper reacts with oxygen to form black copper(II) oxide.","V(oxygen) = 85.0 − 67.5 = 17.5 cm³","% oxygen = 17.5 ÷ 85.0 × 100 = 20.588...","= <b>20.6 %</b> (3 s.f.). Cool before reading: hot gas expands."]}},

{id:"na",name:"Sodium and potassium in water",type:"Describe",marks:4,
title:"Observations when sodium and potassium react with water",
spec:["Spec 2.1 Group 1 metals with water","Spec 2.2 trend in reactivity"],
q:"<p>A teacher adds a small piece of sodium to a large trough of water containing a few drops of universal indicator. She then repeats this with potassium.</p><p>[[Describe]] what the students would [[see]] in each case. <b>(4)</b></p>",
M:["Sodium floats and moves around","Fizzes, melts into a ball, gets smaller / disappears","Indicator turns purple (alkaline solution)","Potassium: same but faster, with a lilac flame"],
foot:"2Na(s) + 2H_2O(l) → 2NaOH(aq) + H_2(g)",
S:[
{t:"Observations only",x:"'Describe what they would see' means observations. Write what your eyes see, not the chemistry.",tip:"'Hydrogen is produced' is not an observation. Write <b>fizzing</b> or <b>bubbles</b>.",L:["Observation = what you **see** (or hear)."],c:"See it? Write it. Explain it? Leave it out."},
{t:"Sodium on the surface",x:"Sodium is less dense than water, so it floats. The gas pushes it around.",L:["{M1}Sodium **floats** and **moves around** on the surface."],m:[0]},
{t:"Sodium reacting",x:"The reaction gives out heat, so the sodium melts into a ball. It fizzes and gets smaller until it disappears.",L:["{M2}It **fizzes**, **melts into a silvery ball** and gets smaller until it **disappears**."],m:[1]},
{t:"The indicator",x:"The solution formed (sodium hydroxide) is an alkali.",L:["{M3}The universal indicator turns **purple** (or blue), showing an **alkaline** solution."],m:[2]},
{t:"Potassium: compare",x:"Potassium does all the same things, but more vigorously. The heat sets the hydrogen alight.",tip:"Write <b>lilac</b> for the flame: it is always accepted. Do not say sodium explodes.",L:["{M4}Potassium does the same but **faster / more vigorously**, and it **burns with a lilac flame**."],m:[3]},
{t:"Summary",x:"<b>Total: 4 marks.</b> The equation is extra. It is not needed for marks here, but it helps you remember the products.",tip:"The most common way to lose marks is writing explanations (\"because it is less dense\") instead of more observations.",L:["{=}2Na(s) + 2H_2O(l) → 2NaOH(aq) + H_2(g)"]}
],
Y:{k:"text",q:"<p>A small piece of lithium is added to water containing universal indicator.</p><p>[[Describe]] what you would see and [[name]] the two products. <b>(5)</b></p>",
P:["Lithium floats","Fizzes steadily / slowly (it does not melt)","Gets smaller slowly and disappears","Indicator turns purple / blue (alkaline)","Products: lithium hydroxide and hydrogen"]}},

{id:"g1trend",name:"Group 1 reactivity trend",type:"Explain",marks:4,
title:"Using evidence to explain and predict the Group 1 trend",
spec:["Spec 2.2 trend in Group 1","Spec 2.3 predicting other alkali metals"],
q:"<div class='tw'><table class='t'><tr><th>Metal</th><th>Reaction with cold water</th></tr><tr><td>lithium</td><td>fizzes steadily; moves slowly</td></tr><tr><td>sodium</td><td>fizzes quickly; melts into a ball; moves around quickly</td></tr><tr><td>potassium</td><td>fizzes very quickly; melts; hydrogen catches fire with a lilac flame</td></tr></table></div><p>(a) [[Explain]] how these observations show the trend in reactivity in Group 1. <b>(2)</b></p><p>(b) Rubidium is below potassium in Group 1. [[Predict]] how rubidium reacts with water. [[Name]] the products. <b>(2)</b></p>",
M:["Reactivity increases down the group","Evidence: reactions get more vigorous Li → Na → K","Rubidium reacts even more vigorously / explosively","Products: rubidium hydroxide and hydrogen"],
foot:"2Rb(s) + 2H_2O(l) → 2RbOH(aq) + H_2(g)",
S:[
{t:"Put the metals in group order",x:"Lithium is at the top of Group 1. Rubidium is below potassium.",tip:"Explaining this trend with electrons and shells is Chemistry-only (spec 2.4C). On the double award paper you use the <b>evidence</b> from the observations.",L:["Down Group 1: Li → Na → K → Rb"],c:"Down the group = more reactive"},
{t:"(a) State the trend",x:"Say which way reactivity changes.",L:["{M1}Reactivity **increases down the group** (Li < Na < K)."],m:[0]},
{t:"(a) Give the evidence",x:"An Explain question needs evidence from the table. Use comparisons.",tip:"Say <b>more vigorous</b> or <b>faster</b>. Just listing what each metal does, without comparing, may not get the mark.",L:["{M2}The reactions get **more vigorous**: lithium only fizzes steadily, but **potassium reacts so fast that the hydrogen catches fire**."],m:[1]},
{t:"(b) Predict the reaction",x:"Rubidium is further down than potassium, so it is even more reactive.",L:["{M3}Rubidium reacts **even more vigorously than potassium** (it may explode)."],m:[2]},
{t:"(b) Name the products",x:"<b>Total: 4 marks.</b> All Group 1 metals react with water in the same way, which is why they are one family: metal hydroxide + hydrogen.",tip:"The most common lost mark: writing 'rubidium oxide'. With water, Group 1 metals make the <b>hydroxide</b>.",L:["{M4}Products: **rubidium hydroxide** and **hydrogen**.","{=}2Rb(s) + 2H_2O(l) → 2RbOH(aq) + H_2(g)"],m:[3]}
],
Y:{k:"text",q:"<p>Caesium is below rubidium in Group 1.</p><p>[[Predict]] how caesium reacts with water and the pH of the solution formed. [[Explain]] your predictions. <b>(4)</b></p>",
P:["Caesium reacts very vigorously / explosively (more than rubidium)","Because reactivity increases down Group 1","It forms caesium hydroxide and hydrogen","The solution is strongly alkaline, pH 13–14, because it contains hydroxide (OH^-) ions"]}},

{id:"halogen",name:"Halogen displacement",type:"Explain",marks:4,
title:"Chlorine water and potassium bromide solution",
spec:["Spec 2.7 halogen displacement","Spec 2.5 halogen colours and states"],
q:"<p>A student adds chlorine water to colourless potassium bromide solution.</p><p>(a) [[State]] the colour change. <b>(1)</b></p><p>(b) [[Explain]] why a reaction happens. <b>(1)</b></p><p>(c) Write the [[balanced]] equation for the reaction. <b>(2)</b></p>",
M:["Colourless → orange (yellow-orange)","Chlorine more reactive than bromine, so displaces it","Correct formulae: Cl_2, KBr, KCl, Br_2","Balanced: Cl_2 + 2KBr → 2KCl + Br_2"],
foot:"Halogen solutions: chlorine pale green · bromine orange · iodine brown.",
S:[
{t:"Know the order",x:"Reactivity in Group 7 decreases down the group. A more reactive halogen displaces a less reactive one from its compound.",L:["Group 7 reactivity: Cl > Br > I"],c:"A halogen displaces the halides BELOW it"},
{t:"(a) The colour change",x:"Bromine forms in the solution. Bromine in water is orange.",tip:"Accept yellow, orange or orange-brown. Do not write 'red-brown liquid': that is pure bromine, not a solution.",L:["{M1}The solution turns from colourless to **orange**."],m:[0]},
{t:"(b) Why it happens",x:"Compare the two halogens.",tip:"Explaining this with electrons is Chemistry-only (spec 2.8C). Here, reactivity is enough.",L:["{M2}Chlorine is **more reactive than bromine**, so it **displaces bromine** from potassium bromide."],m:[1]},
{t:"(c) Write the formulae",x:"Halogens are diatomic: Cl_2, Br_2. Potassium bromide is KBr, potassium chloride is KCl.",L:["{M3}Cl_2 + KBr → KCl + Br_2"],m:[2]},
{t:"(c) Balance it",x:"There are 2 Br on the right, so you need 2KBr. Then 2KCl balances K and Cl.",L:["{= M4}Cl_2(aq) + **2**KBr(aq) → **2**KCl(aq) + Br_2(aq)"],m:[3]},
{t:"Predict the reverse",x:"<b>Total: 4 marks.</b> A less reactive halogen cannot displace a more reactive one.",tip:"The most common lost mark: writing Br or Cl (single atoms) in the equation. Halogen molecules are always X_2.",L:["iodine + potassium bromide → **no reaction** (iodine is less reactive than bromine)"]}
],
Y:{k:"text",q:"<p>Bromine water is added to colourless potassium iodide solution.</p><p>[[State]] the colour change, [[explain]] it, and write the [[balanced]] equation. <b>(4)</b></p>",
P:["Colourless → brown","Bromine is more reactive than iodine, so it displaces iodine","Correct formulae: Br_2, KI, KBr, I_2","Balanced: Br_2 + 2KI → 2KBr + I_2"]}},

{id:"plan",name:"Identify an unknown solid",type:"Describe",marks:6,
title:"Plan: show a solid is potassium carbonate",
spec:["Spec 2.45 flame test method","Spec 2.46 flame colours","Spec 2.48 carbonate test"],
q:"<p>A technician finds a jar of white solid. She thinks it is potassium carbonate.</p><p>[[Describe]] tests to show that the solid contains [[potassium ions]] and [[carbonate ions]]. Give the [[results]] you would expect. <b>(6)</b></p>",
M:["Clean wire (nichrome/platinum) dipped in the solid","Hold in a hot (blue) Bunsen flame","Lilac flame shows K^+","Add dilute hydrochloric acid","Fizzing (effervescence)","Gas turns limewater milky: CO_2, so CO_3^2-"],
foot:"Two ions, two tests: flame test for the cation; acid + limewater for the carbonate.",
S:[
{t:"Plan two tests",x:"A compound has a positive ion and a negative ion. Test for each one separately.",L:["K^+ → flame test. &nbsp; CO_3^2- → add acid, test the gas."],c:"Test for each ion separately"},

(function(){
var P=PAGE;
function fmt(s){return s.replace(/\[\[(.+?)\]\]/g,'<span class="hl">$1</span>').replace(/\*\*(.+?)\*\*/g,'<b class="k">$1</b>').replace(/_(\d+|r(?![a-z]))/g,'<sub>$1</sub>').replace(/\^(\d?)([+-])/g,function(m,a,b){return '<sup>'+a+(b=='-'?'−':'+')+'</sup>';});}

  $('lab').textContent='IGCSE Chemistry · '+P.year+' · '+P.group+' · Exam-style question · '+q.marks+' mark'+(q.marks>1?'s':'');
  $('qt').innerHTML=q.title;
  $('tags').innerHTML=q.spec.map(function(s){return '<span class="tag">'+s+'</span>';}).join('');
  $('qbox').innerHTML=q.q;
  $('chips').innerHTML=q.M.map(function(m,j){return '<div class="chip"><b>M'+(j+1)+'</b>'+m+'</div>';}).join('');

  $('foot').innerHTML=q.foot||'';$('foot').hidden=!q.foot;

function line(x){

  var el=h('div','ln'+(fin?' fin':''),tg),body=h('span','tx',x);el.appendChild(body);return {el:el,body:body};
}
function typeOne(b,t,done){
  var tx=[];(function walk(n){for(var c=n.firstChild;c;c=c.nextSibling){if(c.nodeType==3){tx.push([c,c.nodeValue]);c.nodeValue='';}else walk(c);}})(b);
  var i=0,j=0;(function tick(){if(t!==tok)return;var n=SP[spd][1];while(n>0&&i<tx.length){var f=tx[i][1],a=Math.min(n,f.length-j);j+=a;n-=a;tx[i][0].nodeValue=f.slice(0,j);if(j>=f.length){i++;j=0;}}if(i<tx.length)setTimeout(tick,SP[spd][0]);else done();})();
}
function typeQ(list,t){var k=0;list.forEach(function(b){b.parentNode.style.display='none';});(function nx(){if(t!==tok||k>=list.length)return;var b=list[k++];b.parentNode.style.display='';typeOne(b,t,nx);})();}
function render(anim){
