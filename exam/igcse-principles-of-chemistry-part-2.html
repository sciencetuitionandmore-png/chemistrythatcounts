{t:`Aluminium oxide`,d:`The total positive charge must equal the total negative charge. The lowest common multiple of 3 and 2 is 6.`,a:[{h:`(i) 2 × (+3) = +6 and 3 × (−2) = −6 → <span class="k">Al<sub>2</sub>O<sub>3</sub></span>`,m:`M1`}],e:[`M1`],co:`total positive charge = total negative charge`,cl:`Key rule`},
{t:`Calcium nitrate`,d:`One Ca<sup>2+</sup> needs two NO<sub>3</sub><sup>−</sup> ions. Put the nitrate in brackets because there is more than one.`,a:[{h:`(ii) Ca<sup>2+</sup> + 2 NO<sub>3</sub><sup>−</sup> → <span class="k">Ca(NO<sub>3</sub>)<sub>2</sub></span>`,m:`M2`}],e:[`M2`],tip:`CaNO<sub>32</sub> or CaNO<sub>3</sub>2 does not score. Brackets are needed around a compound ion when there is more than one.`},
{t:`Ammonium sulfate`,d:`Ammonium is a positive ion, so it is written first. Two NH<sub>4</sub><sup>+</sup> balance one SO<sub>4</sub><sup>2−</sup>.`,a:[{h:`(iii) 2 NH<sub>4</sub><sup>+</sup> + SO<sub>4</sub><sup>2−</sup> → <span class="k">(NH<sub>4</sub>)<sub>2</sub>SO<sub>4</sub></span>`,m:`M3`}],e:[`M3`]},
{t:`Check the answers`,d:`Total: 3 marks. Do not write the charges in the final formula. Use capital letters carefully: Co is cobalt, CO is carbon monoxide.`,a:[{h:`Al<sub>2</sub>O<sub>3</sub> &nbsp;&nbsp; Ca(NO<sub>3</sub>)<sub>2</sub> &nbsp;&nbsp; (NH<sub>4</sub>)<sub>2</sub>SO<sub>4</sub>`,c:`fin`}]}],
foot:`Balance the charges. Use brackets for more than one compound ion.`,
y:{k:`txt`,q:`<p><mark>Write</mark> the formula of <mark>iron(III) hydroxide</mark>. Type it, e.g. CaCl2.</p>`,acc:[`Fe(OH)3`],
ok:`Correct: one Fe<sup>3+</sup> needs three OH<sup>−</sup>, so Fe(OH)<sub>3</sub>.`,bad:`Not quite. Iron(III) is Fe<sup>3+</sup>; hydroxide is OH<sup>−</sup>. Check brackets and capital letters.`,
wrong:[{a:`FeOH3`,m:`Put brackets around the hydroxide ion: Fe(OH)<sub>3</sub>.`},{a:`Fe(OH)2`,m:`That is iron(II) hydroxide. Iron(III) means Fe<sup>3+</sup>.`},{a:`FeOH`,m:`Fe<sup>3+</sup> needs three OH<sup>−</sup> ions to balance the charge.`},{a:`Fe3OH`,m:`Charges: Fe is 3+, OH is 1−. You need three OH, not three Fe.`}],
w:[`iron(III) → Fe<sup>3+</sup>; hydroxide → OH<sup>−</sup>`,`one Fe<sup>3+</sup> (+3) needs three OH<sup>−</sup> (3 × −1 = −3)`,`<b>Fe(OH)<sub>3</sub></b>`]}},

{id:`nacl`,name:`High melting point of NaCl`,type:`Explain`,marks:3,title:`Why sodium chloride has a high melting point`,spec:[`Giant ionic lattice`],
q:`<p>Sodium chloride melts at <mark>801 °C</mark>.</p><p><mark>Explain</mark>, in terms of <mark>structure and bonding</mark>, why sodium chloride has a high melting point.</p>`,
mk:[[`M1`,`giant ionic lattice`],[`M2`,`strong attraction between oppositely charged ions`],[`M3`,`lots of energy to overcome`]],
steps:[
{t:`Name the structure`,d:`Na<sup>+</sup> and Cl<sup>−</sup> ions are arranged in a regular pattern that repeats in all directions.`,a:[{g:`lat`},{h:`Sodium chloride has a <span class="k">giant ionic lattice</span>.`,m:`M1`}],e:[`M1`],tip:`The word "giant" matters. It tells the examiner there is a huge number of ions and bonds.`},
{t:`Describe the bonding`,d:`Name the force and the particles. The particles are ions, not atoms or molecules.`,a:[{h:`There are <span class="k">strong electrostatic attractions</span> between the <span class="k">oppositely charged ions</span>.`,m:`M2`}],e:[`M2`],tip:`Writing "molecules" or "intermolecular forces" for sodium chloride loses this mark. Ionic compounds do not contain molecules.`},
{t:`Link to energy`,d:`To melt, the ions must break free from their fixed positions. Strong forces, and many of them, need a lot of energy.`,a:[{h:`A <span class="k">lot of energy</span> is needed to <span class="k">overcome</span> these many strong attractions, so the melting point is high.`,m:`M3`}],e:[`M3`],co:`many strong forces → lots of energy → high melting point`,cl:`Key phrase`},
{t:`Summary`,d:`Total: 3 marks. The most common lost mark: calling the bonds "covalent" or talking about "breaking molecules".`,a:[{h:`Giant ionic lattice · strong attraction between oppositely charged ions · lots of energy to overcome`,c:`fin`}]}],
foot:`Structure → type of force → how strong → how much energy.`,
y:{k:`wr`,q:`<p>Magnesium oxide melts at 2852 °C. Sodium chloride melts at 801 °C. Both are ionic. <mark>Explain</mark> why magnesium oxide has a higher melting point. (3 marks)</p>`,
p:[`Both have giant ionic lattices.`,`The ions in magnesium oxide have higher charges (Mg<sup>2+</sup> and O<sup>2−</sup>) than in sodium chloride (Na<sup>+</sup> and Cl<sup>−</sup>).`,`So the electrostatic attraction between the ions is stronger, and more energy is needed to overcome it.`]}},

{id:`cond`,name:`Conductivity of ionic compounds`,type:`Explain`,marks:3,title:`Why potassium chloride conducts only when molten or dissolved`,spec:[`Ionic compounds and conductivity`],
q:`<p>A student tests potassium chloride, KCl, to see if it conducts electricity.</p>
<div class="tw"><table class="dt"><tr><th>State of KCl</th><th>Conducts electricity?</th></tr><tr><td>solid</td><td>no</td></tr><tr><td>molten (liquid)</td><td>yes</td></tr><tr><td>dissolved in water</td><td>yes</td></tr></table></div><p><mark>Explain</mark> these results.</p>`,
mk:[[`M1`,`solid: ions in fixed positions`],[`M2`,`molten / aqueous: ions free to move`],[`M3`,`moving ions carry charge`]],
steps:[
{t:`Which particles are present?`,d:`To conduct, a substance needs charged particles that can move.`,a:[`Potassium chloride is made of <span class="k">ions</span>: K<sup>+</sup> and Cl<sup>−</sup>.`],co:`conducting needs charged particles that can move`,cl:`Key idea`},
{t:`The solid`,d:`In the lattice the ions can only vibrate. They cannot move from place to place.`,a:[{h:`In the solid, the ions are held in <span class="k">fixed positions</span>, so they <span class="k">cannot move</span>.`,m:`M1`}],e:[`M1`]},
{t:`Molten or dissolved`,d:`Melting breaks down the lattice. Dissolving separates the ions among water molecules.`,a:[{h:`When molten or dissolved in water, the ions are <span class="k">free to move</span>,`,m:`M2`}],e:[`M2`]},
{t:`Link to charge`,d:`Total: 3 marks. The commonest mistake is to write "electrons move". In an ionic compound it is the ions that move.`,a:[{h:`so the moving ions can <span class="k">carry charge</span> through the liquid.`,m:`M3`}],e:[`M3`],tip:`"Electrons are free to move" scores 0 for M2 and M3 in an ionic compound.`}],
foot:`Ionic: conducts when molten or aqueous (ions move). Simple molecular: does not conduct (no ions).`,
y:{k:`wr`,q:`<p>A solution of sugar in water does not conduct electricity. A solution of sodium chloride in water does. <mark>Explain</mark> the difference. (3 marks)</p>`,
p:[`Sugar is a covalent (simple molecular) substance.`,`So sugar solution contains no ions (no charged particles that can move).`,`Sodium chloride solution contains ions that are free to move and carry charge.`]}},

{id:`cov`,name:`Dot-and-cross: CO<sub>2</sub>`,type:`Draw`,marks:3,title:`Dot-and-cross diagram for carbon dioxide`,spec:[`Covalent bonding`,`Covalent dot-and-cross`],
q:`<p>Carbon dioxide, CO<sub>2</sub>, is a simple molecular substance. Its displayed formula is <span class="eq">O=C=O</span></p><p><mark>Draw</mark> a dot-and-cross diagram for a molecule of carbon dioxide. Show <mark>outer electrons only</mark>.</p><p class="data">[atomic numbers: C = 6 &nbsp; O = 8]</p>`,
mk:[[`M1`,`two shared pairs between C and each O`],[`M2`,`two lone pairs on each O`],[`M3`,`8 outer electrons on every atom`]],
steps:[
{t:`Count the outer electrons`,d:`Carbon needs 4 more electrons. Each oxygen needs 2 more. So carbon shares two pairs with each oxygen.`,a:[`C: 2.<span class="k">4</span> (4 outer electrons, crosses) &nbsp; O: 2.<span class="k">6</span> (6 outer electrons, dots)`],co:`C needs 4 more · each O needs 2 more`,cl:`Key data`},
{t:`Draw the atoms`,d:`Draw three overlapping circles: O, C, O. The shared electrons go in the overlaps.`,a:[{g:`co2`,l:1,id:`d`}]},
{t:`Two shared pairs on each side`,d:`Each shared pair has one dot (from O) and one cross (from C). So there are 4 electrons in each overlap.`,a:[{g:`co2`,l:2,id:`d`},{h:`Each oxygen shares <span class="k">two pairs</span> of electrons with carbon: a <span class="k">double bond</span>.`,m:`M1`}],e:[`M1`],tip:`A very common error is one shared pair between C and O. The "=" in O=C=O means two shared pairs.`},
{t:`Add the non-bonding pairs`,d:`Oxygen has 6 outer electrons. 2 are used in bonding, so 4 are left as two pairs.`,a:[{g:`co2`,l:3,id:`d`},{h:`Each oxygen also has <span class="k">two non-bonding pairs</span> (lone pairs).`,m:`M2`}],e:[`M2`]},
{t:`Check every atom`,d:`Total: 3 marks. Count dots and crosses: 4 crosses on C, 6 dots on each O. Marks are lost for single bonds, missing lone pairs, or mixing up dots and crosses.`,a:[{h:`Check: C has 8 outer electrons; each O has 8. Electrons shown = 4 + 6 + 6 = <span class="k">16</span>.`,m:`M3`}],e:[`M3`]}],
foot:`Shared pair = covalent bond. Single bond: 1 pair · double bond: 2 pairs · triple bond: 3 pairs.`,
y:{k:`wr`,q:`<p>Nitrogen (atomic number 7) exists as N<sub>2</sub> molecules. Sketch a dot-and-cross diagram for N<sub>2</sub> on paper. Then <mark>describe</mark> it below. (3 marks)</p>`,
p:[`Each nitrogen atom has 5 outer electrons (dots on one atom, crosses on the other).`,`There are three shared pairs between the two atoms (a triple bond).`,`Each N atom has one non-bonding (lone) pair, so each atom has 8 outer electrons.`]}},

{id:`ch4`,name:`Low boiling point of methane`,type:`Explain`,marks:3,title:`Why methane has a low boiling point`,spec:[`Simple molecular substances`,`Intermolecular forces`],
q:`<p>Methane, CH<sub>4</sub>, boils at <mark>−162 °C</mark>. The covalent bonds between the carbon and hydrogen atoms in methane are <mark>strong</mark>.</p><p><mark>Explain</mark> why methane has a low boiling point.</p>`,
mk:[[`M1`,`simple molecular`],[`M2`,`weak intermolecular forces`],[`M3`,`little energy to overcome them`]],
steps:[
{t:`Name the structure`,d:`Methane is made of small, separate molecules. Each one is one carbon atom joined to four hydrogen atoms.`,a:[{h:`Methane has a <span class="k">simple molecular</span> structure.`,m:`M1`}],e:[`M1`]},
{t:`Forces between molecules`,d:`When methane boils, the molecules move apart. Only the forces between the molecules are overcome.`,a:[{h:`The <span class="k">intermolecular forces</span> (forces <span class="k">between</span> the molecules) are <span class="k">weak</span>.`,m:`M2`}],e:[`M2`]},
{t:`Covalent bonds are not broken`,d:`This is why the strong bonds in the question do not matter for boiling.`,a:[`The strong covalent bonds <span class="k">inside</span> each molecule are <span class="k">not broken</span> when methane boils.`],co:`boiling separates molecules; it does not break them`,cl:`Key phrase`,tip:`"The covalent bonds are weak" or "the covalent bonds break when it boils" is wrong, and can cancel a mark.`},
{t:`Link to energy`,d:`Little energy is needed, so a low temperature is enough.`,a:[{h:`So only a <span class="k">little energy</span> is needed to overcome the intermolecular forces.`,m:`M3`}],e:[`M3`]},
{t:`Summary`,d:`Total: 3 marks. Most marks are lost by saying that covalent bonds break on boiling.`,a:[{h:`Simple molecules · weak intermolecular forces · little energy needed to overcome them`,c:`fin`}]}],
foot:`Simple molecular: strong bonds inside molecules, weak forces between molecules.`,
y:{k:`wr`,q:`<p>Chlorine, Cl<sub>2</sub> (M<sub>r</sub> = 71), boils at −34 °C. Bromine, Br<sub>2</sub> (M<sub>r</sub> = 160), boils at 59 °C. <mark>Explain</mark> why bromine has a higher boiling point than chlorine. (3 marks)</p>`,
p:[`Both are simple molecular substances.`,`Bromine molecules have a higher relative molecular mass, so the intermolecular forces between them are stronger.`,`So more energy is needed to overcome the intermolecular forces in bromine (no covalent bonds break).`]}},

{id:`carbon`,name:`Diamond and graphite`,type:`Explain`,marks:6,title:`Comparing the properties of diamond and graphite`,spec:[`Giant covalent structures`,`Diamond, graphite and C<sub>60</sub>`],
q:`<p>Diamond and graphite both contain only carbon atoms. Diamond is used in drill tips for cutting rock. Graphite is used as a lubricant, and as electrodes because it conducts electricity.</p><p><mark>Explain</mark>, in terms of <mark>structure and bonding</mark>, why diamond is very hard but graphite is soft and slippery, and why graphite <mark>conducts electricity</mark>.</p>`,
mk:[[`M1`,`diamond: each C bonded to 4`],[`M2`,`rigid 3D network → hard`],[`M3`,`graphite: each C bonded to 3, layers`],[`M4`,`weak forces between layers`],[`M5`,`layers slide → soft`],[`M6`,`delocalised electrons move → conducts`]],
steps:[
{t:`Start with what is the same`,d:`Then compare. Link the two halves with "whereas" or "but".`,a:[`Both diamond and graphite have <span class="k">giant covalent</span> structures, with strong covalent bonds between carbon atoms.`],tip:`In a 6-mark question you must explain BOTH substances. An answer about only one is limited to low marks.`},
{t:`Diamond: four bonds per atom`,d:`The atoms form a tetrahedral network that extends in all three directions.`,a:[{h:`In diamond, each carbon atom forms <span class="k">four</span> strong covalent bonds to other carbon atoms.`,m:`M1`}],e:[`M1`]},
{t:`Diamond: why it is hard`,d:`There are no weak planes, so the structure is very hard to scratch or break.`,a:[{h:`This makes a <span class="k">rigid 3D network</span>. A lot of energy is needed to break the many strong bonds, so diamond is very <span class="k">hard</span>.`,m:`M2`}],e:[`M2`]},
{t:`Graphite: layers`,d:`Within each layer, the covalent bonds are strong.`,a:[{h:`In graphite, each carbon atom forms <span class="k">three</span> covalent bonds, in flat <span class="k">layers</span> of hexagons.`,m:`M3`}],e:[`M3`]},
{t:`Graphite: why it is soft`,d:`The layers are held together only weakly, so they can move over each other.`,a:[{h:`There are only <span class="k">weak forces between the layers</span>,`,m:`M4`},{h:`so the layers can <span class="k">slide</span> over each other. Graphite is soft and slippery.`,m:`M5`}],e:[`M4`,`M5`],tip:`There are no covalent bonds between the layers. Write "weak forces between layers", not "weak covalent bonds".`},
{t:`Graphite: conductivity`,d:`Total: 6 marks. Carbon has 4 outer electrons; only 3 are used in graphite. Many students forget to explain the conductivity at all.`,a:[{h:`Each carbon in graphite has one <span class="k">delocalised electron</span>. These electrons are <span class="k">free to move</span> through the structure and carry charge, so graphite conducts. Diamond has no delocalised electrons.`,m:`M6`}],e:[`M6`],co:`diamond: 4 bonds, no free electrons · graphite: 3 bonds, 1 delocalised electron per C`,cl:`Key comparison`,tip:`"Free electrons" is fine. "Free ions" in graphite scores 0.`}],
foot:`Count the bonds per carbon atom: 4 (diamond) or 3 (graphite). Everything else follows.`,
y:{k:`wr`,q:`<p>Buckminsterfullerene, C<sub>60</sub>, is another form of carbon. It is made of separate C<sub>60</sub> molecules. <mark>Explain</mark> why C<sub>60</sub> is much softer than diamond and has a much lower melting point. (3 marks)</p>`,
p:[`C<sub>60</sub> has a simple molecular structure (separate molecules).`,`The intermolecular forces between C<sub>60</sub> molecules are weak.`,`So little energy is needed to separate the molecules; in diamond, many strong covalent bonds must be broken.`]}},

{id:`data`,name:`Deduce the structure`,type:`Interpret data`,marks:4,title:`Using data to decide the type of structure`,spec:[`Structure and properties`],
q:`<p>The table shows some properties of three substances, A, B and C.</p>
<div class="tw"><table class="dt"><tr><th>Substance</th><th>Melting point (°C)</th><th>Boiling point (°C)</th><th>Conducts when solid?</th><th>Conducts when liquid?</th></tr><tr><td>A</td><td>770</td><td>1420</td><td>no</td><td>yes</td></tr><tr><td>B</td><td>−95</td><td>69</td><td>no</td><td>no</td></tr><tr><td>C</td><td>1713</td><td>2950</td><td>no</td><td>no</td></tr></table></div>
<p>(a) <mark>Identify</mark> the substance with a giant ionic structure and the substance with a simple molecular structure. (2)</p><p>(b) <mark>Explain</mark> why substance C is likely to have a giant covalent structure. (2)</p>`,
mk:[[`M1`,`A giant ionic`],[`M2`,`B simple molecular`],[`M3`,`C: very high mp, strong covalent bonds`],[`M4`,`C: no conduction even when liquid`]],
steps:[
{t:`Scan the data`,d:`Each type of structure has a "fingerprint". Use both the melting point and the conductivity.`,a:[`<span class="mono">Look at: melting point · conducts as solid? · conducts as liquid?</span>`],co:`giant ionic: high mp, conducts only when liquid · simple molecular: low mp, never conducts · giant covalent: very high mp, does not conduct (except graphite)`,cl:`Fingerprints`},
{t:`Giant ionic`,d:`A has a high melting point and conducts only when liquid. Ions are fixed in the solid but free to move in the liquid.`,a:[{h:`(a) <span class="k">A</span> has a giant ionic structure.`,m:`M1`}],e:[`M1`],tip:`"Identify" needs only the letter. A short reason does no harm.`},
{t:`Simple molecular`,d:`B has very low melting and boiling points (it is a liquid at room temperature) and never conducts.`,a:[{h:`<span class="k">B</span> has a simple molecular structure.`,m:`M2`}],e:[`M2`]},
{t:`C: melting point`,d:`Simple molecular substances have low melting points, so C is not simple molecular.`,a:[{h:`(b) C has a <span class="k">very high melting point</span>, so a lot of energy is needed to break <span class="k">many strong covalent bonds</span>.`,m:`M3`}],e:[`M3`]},
{t:`C: conductivity`,d:`Total: 4 marks. An ionic compound would conduct when molten. Students lose M4 by using only the melting point, which on its own could also mean ionic.`,a:[{h:`C does <span class="k">not conduct, even when liquid</span>, so it has no ions that can move. It is not ionic.`,m:`M4`}],e:[`M4`]}],
foot:`Use two pieces of evidence: melting point and conductivity.`,
y:{k:`wr`,q:`<p>Substance D contains only carbon. It does not melt below 3500 °C, it is insoluble in water and it conducts electricity when solid. <mark>Suggest</mark> what D is and <mark>explain</mark> the data. (3 marks)</p>`,
p:[`D is graphite.`,`Very high melting point: it is giant covalent, so many strong covalent bonds must be broken.`,`It conducts because it has delocalised electrons that are free to move through the structure.`]}}
],
ck:[
{t:`Explain how ions form when atoms lose or gain electrons.`,p:[`ion`]},
{t:`Know the charges of ions: groups 1, 2, 3, 5, 6, 7; Ag<sup>+</sup>, Cu<sup>2+</sup>, Fe<sup>2+</sup>, Fe<sup>3+</sup>, Pb<sup>2+</sup>, Zn<sup>2+</sup>; H<sup>+</sup>, OH<sup>−</sup>, NH<sub>4</sub><sup>+</sup>, CO<sub>3</sub><sup>2−</sup>, NO<sub>3</sub><sup>−</sup>, SO<sub>4</sub><sup>2−</sup>.`,p:[`form`]},
{t:`Write the formulae of compounds made from these ions.`,p:[`form`]},
{t:`Draw dot-and-cross diagrams for ionic compounds (groups 1, 2, 3 with groups 5, 6, 7; outer electrons only).`,p:[`ion`]},
{t:`Explain ionic bonding as strong electrostatic attraction between oppositely charged ions.`,p:[`ion`,`nacl`]},
{t:`Explain why giant ionic lattices have high melting and boiling points.`,p:[`nacl`]},
{t:`Explain why ionic compounds conduct when molten or dissolved, but not when solid.`,p:[`cond`]},
{t:`Know that a covalent bond is a shared pair of electrons, held by attraction between the nuclei and the shared pair.`,p:[`cov`]},
{t:`Draw dot-and-cross diagrams for molecules: H<sub>2</sub>, O<sub>2</sub>, N<sub>2</sub>, Cl<sub>2</sub>, HCl, H<sub>2</sub>O, NH<sub>3</sub>, CO<sub>2</sub>, CH<sub>4</sub>, C<sub>2</sub>H<sub>6</sub>, C<sub>2</sub>H<sub>4</sub>.`,p:[`cov`]},
{t:`Explain why simple molecular substances have low melting and boiling points (weak intermolecular forces).`,p:[`ch4`]},
{t:`Explain why melting and boiling points of simple molecular substances usually rise with relative molecular mass.`,p:[`ch4`]},
{t:`Explain why giant covalent substances have high melting and boiling points.`,p:[`carbon`,`data`]},
{t:`Explain how the structures of diamond, graphite and C<sub>60</sub> fullerene affect hardness and conductivity.`,p:[`carbon`]},
{t:`Know that covalent compounds do not usually conduct electricity, and explain why.`,p:[`cond`]},
{t:`Use melting point and conductivity data to decide the type of structure of a substance.`,p:[`data`]}
]};

function type(nodes){jobs=[];nodes.forEach(function(n){if(/\bdg\b/.test(n.className))return;var tag=n.querySelector('.mt'),ts=[],w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT,null),t;while((t=w.nextNode())){if(tag&&tag.contains(t))continue;ts.push([t,t.nodeValue])}ts.forEach(function(x){x[0].nodeValue=''});if(tag)tag.classList.add('wait');n.style.visibility='hidden';jobs.push({n:n,ts:ts,tag:tag})});
var j=0,ti=0,ci=0;
tick=function(){var c=SP[spd].n;while(c>0){var job=jobs[j];if(!job){stopType();return}job.n.style.visibility='';var cur=job.ts[ti];if(!cur){if(job.tag)job.tag.classList.remove('wait');j++;ti=0;ci=0;continue}ci++;cur[0].nodeValue=cur[1].slice(0,ci);if(ci>=cur[1].length){ti++;ci=0}if(/\S/.test(cur[1].charAt(ci-1)))c--}};
if(jobs.length)tm=setInterval(tick,SP[spd].ms)}
function stopType(){if(tm){clearInterval(tm);tm=null}jobs.forEach(function(job){job.ts.forEach(function(x){x[0].nodeValue=x[1]});job.n.style.visibility='';if(job.tag)job.tag.classList.remove('wait')});jobs=[]}
function next(){var N=Q[qi].steps.length;if(k<N){k++;draw(true)}}
function back(){if(k>0){k--;draw(false)}}
function replay(){if(k===0)k=1;draw(true)}
$('next').addEventListener('click',next);$('back').addEventListener('click',back);$('replay').addEventListener('click',replay);
function setSpd(s){spd=s;[].forEach.call($('speed').children,function(b){b.setAttribute('aria-pressed',+b.dataset.s===s?'true':'false')});if(tm){clearInterval(tm);tm=setInterval(tick,SP[spd].ms)}}
[].forEach.call($('speed').children,function(b){b.addEventListener('click',function(){setSpd(+b.dataset.s)})});setSpd(1);
document.addEventListener('keydown',function(e){var t=e.target&&e.target.tagName;if(/INPUT|TEXTAREA|SELECT/.test(t)||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'){e.preventDefault();next()}else if(e.key==='ArrowLeft'){e.preventDefault();back()}});
/* your turn */
function norm(s){return String(s).replace(/\s+/g,'').replace(/[₀-₉]/g,function(c){return String(c.charCodeAt(0)-8320)})}
function your(){var y=Q[qi].y,b=$('your'),h='<h2>Your turn</h2><div class="qbox">'+y.q+'</div>',calc=y.k!=='wr';
if(calc)h+='<div class="row"><label class="sr" for="yin">Your answer</label><input id="yin" autocomplete="off" spellcheck="false" '+(y.k==='num'?'inputmode="decimal" placeholder="Your answer"':'placeholder="Formula"')+'><span class="unit">'+(y.u||'')+'</span><button type="button" class="btn pri" id="ychk">Check</button><button type="button" class="btn" id="yshow">Show worked answer</button></div><p class="fb" id="yfb" role="status"></p><div class="work" id="ywork" hidden></div>';
else h+='<label class="mono" for="yta">Write your answer</label><textarea id="yta" rows="5"></textarea><div class="row"><button type="button" class="btn pri" id="yshow">Show model answer</button></div><div class="work model" id="ywork" hidden></div>';
b.innerHTML=h;var wk=$('ywork'),sh=$('yshow');
if(calc){wk.innerHTML=y.w.map(function(l,i){return '<div class="wl" style="animation-delay:'+(i*0.5)+'s">'+l+'</div>'}).join('');
var inp=$('yin'),fb=$('yfb');
var chk=function(){var v=inp.value.trim(),ok=false,msg=y.bad;if(!v){fb.className='fb no';fb.textContent='Type an answer first.';return}
if(y.k==='num'){var x=parseFloat(v.replace(',','.').replace(/[^0-9.\-]/g,''));if(isNaN(x)){fb.className='fb no';fb.textContent='Type a number.';return}
if(Math.abs(x-y.ans)<=y.tol)ok=true;else(y.wrong||[]).forEach(function(r){if(Math.abs(x-r.v)<=r.t)msg=r.m})}
else{var n=norm(v);if(y.acc.some(function(a){return norm(a)===n}))ok=true;else(y.wrong||[]).forEach(function(r){if(norm(r.a)===n)msg=r.m})}
fb.className='fb '+(ok?'ok':'no');fb.innerHTML=(ok?'✓ ':'✗ ')+(ok?y.ok:msg)};
$('ychk').addEventListener('click',chk);inp.addEventListener('keydown',function(e){if(e.key==='Enter')chk()});
sh.addEventListener('click',function(){wk.hidden=!wk.hidden;sh.textContent=wk.hidden?'Show worked answer':'Hide worked answer';if(!wk.hidden)[].forEach.call(wk.children,function(c){c.style.animation='none';void c.offsetWidth;c.style.animation=''})})}
else{var N=y.p.length;wk.innerHTML='<p class="mono">Model answer · Tick each point you made</p>'+y.p.map(function(p,i){return '<label><input type="checkbox"><span><b>'+(i+1)+'.</b> '+p+'</span></label>'}).join('')+'<p class="score" id="ysc">0 / '+N+'</p>';
wk.addEventListener('change',function(){$('ysc').textContent=wk.querySelectorAll('input:checked').length+' / '+N});
sh.addEventListener('click',function(){wk.hidden=!wk.hidden;sh.textContent=wk.hidden?'Show model answer':'Hide model answer'})}}
/* checklist */
var KEY='howto-'+D.key,R={};try{R=JSON.parse((ST&&ST.getItem(KEY))||'{}')||{}}catch(e){R={}}
function save(){try{if(ST)ST.setItem(KEY,JSON.stringify(R))}catch(e){}}
var LBL=[['n','Not yet'],['m','Nearly'],['g','Got it']];
function ck(){var box=$('cklist');box.innerHTML='';D.ck.forEach(function(r,i){var row=document.createElement('div');row.className='ckr';
row.innerHTML='<span class="ckn mono">'+(r.s||'•')+'</span><span class="ckt">'+r.t+'</span><span class="pills" role="group" aria-label="Rate this point">'+LBL.map(function(l){return '<button type="button" class="pill p'+l[0]+'" data-i="'+i+'" data-v="'+l[0]+'" aria-pressed="'+(R[i]===l[0])+'">'+l[1]+'</button>'}).join('')+'</span><span class="prac">'+(r.p||[]).map(function(id){var j=-1;Q.forEach(function(q,x){if(q.id===id)j=x});return j<0?'':'<button type="button" class="lnk" data-q="'+j+'">Practise: '+Q[j].name+'</button>'}).join('')+'</span>';box.appendChild(row)});count()}
function count(){var c={n:0,m:0,g:0},T=D.ck.length,u=T;for(var i in R)if(c[R[i]]!=null){c[R[i]]++;u--}
$('ckc').textContent=c.g+' got it · '+c.m+' nearly · '+c.n+' not yet · '+u+' not rated (of '+T+')';
var bar=document.querySelector('.bar');bar.querySelector('.bg').style.width=(100*c.g/T)+'%';bar.querySelector('.bm').style.width=(100*c.m/T)+'%';bar.querySelector('.bn').style.width=(100*c.n/T)+'%'}
$('cklist').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
if(b.dataset.v){var i=b.dataset.i,v=b.dataset.v;if(R[i]===v)delete R[i];else R[i]=v;save();[].forEach.call(b.parentNode.children,function(x){x.setAttribute('aria-pressed',R[i]===x.dataset.v?'true':'false')});count()}
else if(b.dataset.q!=null){select(+b.dataset.q);var w=$('walk');try{w.scrollIntoView({behavior:'smooth',block:'start'})}catch(er){w.scrollIntoView()}}});
$('ckclear').addEventListener('click',function(){R={};save();ck()});
picker();renderQ();your();ck();
})();
