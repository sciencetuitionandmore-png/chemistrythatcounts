"use strict";
/* drawing helpers for dot-and-cross diagrams */
function E(x,y,t){return t==='o'?'<circle cx="'+x+'" cy="'+y+'" r="3.6" fill="#4a44b5"/>':t==='x'?'<path d="M'+(x-3.6)+' '+(y-3.6)+'l7.2 7.2m0-7.2l-7.2 7.2" stroke="#1c2736" stroke-width="1.9"/>':''}
function T(x,y,s,o){o=o||{};return '<text x="'+x+'" y="'+y+'" text-anchor="'+(o.a||'middle')+'" font-size="'+(o.s||18)+'" font-weight="'+(o.w||700)+'" font-family="Lexend,Arial,sans-serif" fill="'+(o.c||'#1c2736')+'">'+s+'</text>'}
function A(cx,cy,sym,pat,r){r=r||34;var P=[[-7,-r],[7,-r],[r,-7],[r,7],[7,r],[-7,r],[-r,7],[-r,-7]],s='';if(pat!==null)s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#5a6878" stroke-width="1.5"/>';s+=T(cx,cy+6,sym);(pat||'').split('').forEach(function(t,i){s+=E(cx+P[i][0],cy+P[i][1],t)});return s}
function B(cx,cy,r,ch){var a=cx-r-9,b=cx+r+9,t=cy-r-7,h=2*r+14;return '<path d="M'+(a+6)+' '+t+'h-6v'+h+'h6M'+(b-6)+' '+t+'h6v'+h+'h-6" fill="none" stroke="#1c2736" stroke-width="1.7"/>'+T(b+4,t+10,ch,{a:'start',s:15})}

var DG={};
var DATA={key:`y10-principles`,h1:`Principles of chemistry part 1: answer it mark by mark`,year:`Year 10`,group:`Principles of chemistry part 1`,
qs:[
{id:`diff`,name:`Diffusion of gases`,type:`Explain`,marks:4,title:`Why the white ring forms nearer one end of the tube`,spec:[`1.1 particles in solids, liquids, gases`,`1.3 diffusion`],
q:`<p>A student puts a cotton wool pad soaked in concentrated ammonia solution in one end of a long glass tube. At the same time, she puts a pad soaked in concentrated hydrochloric acid in the other end. She seals both ends.</p>
<div class="fig" style="max-width:440px"><svg viewBox="0 0 440 104" role="img" aria-label="Long glass tube: ammonia pad at the left end, hydrochloric acid pad at the right end, white ring closer to the right end"><rect x="20" y="34" width="400" height="34" rx="17" fill="#f7fafc" stroke="#5a6878" stroke-width="1.5"/><rect x="27" y="39" width="30" height="24" rx="6" fill="#dfe6ee" stroke="#5a6878"/><rect x="383" y="39" width="30" height="24" rx="6" fill="#dfe6ee" stroke="#5a6878"/><rect x="281" y="35" width="11" height="32" fill="#ffffff" stroke="#1c2736" stroke-width="1.3" stroke-dasharray="2 2"/><path d="M286 28V35" stroke="#1c2736" stroke-width="1.2"/><text x="286" y="22" text-anchor="middle" font-family="Atkinson Hyperlegible,Arial,sans-serif" font-size="14" fill="#1c2736" font-weight="700">white ring</text><text x="22" y="90" font-family="Atkinson Hyperlegible,Arial,sans-serif" font-size="14" fill="#1c2736">ammonia</text><text x="418" y="90" text-anchor="end" font-family="Atkinson Hyperlegible,Arial,sans-serif" font-size="14" fill="#1c2736">hydrochloric acid</text></svg></div>
<p>After a few minutes, a white ring of solid ammonium chloride forms inside the tube.</p>
<p><span class="eq">NH<sub>3</sub>(g) + HCl(g) → NH<sub>4</sub>Cl(s)</span></p>
<p><mark>Explain</mark> why the white ring forms <mark>closer to the hydrochloric acid end</mark> of the tube.</p>
<p class="data">[M<sub>r</sub>: NH<sub>3</sub> = 17 &nbsp; HCl = 36.5]</p>`,
mk:[[`M1`,`particles move randomly (diffuse)`],[`M2`,`react where they meet`],[`M3`,`NH<sub>3</sub> has lower M<sub>r</sub>`],[`M4`,`NH<sub>3</sub> moves faster, travels further`]],
steps:[
{t:`Particles move randomly`,d:`Gas particles move quickly and in random directions. They hit air particles, so they spread along the tube slowly.`,a:[{h:`Ammonia and hydrogen chloride particles <span class="k">move randomly</span> and spread out through the air in the tube. This is <span class="k">diffusion</span>.`,m:`M1`}],e:[`M1`],tip:`Write "particles" or "molecules". Do not say the gas "flows" or "is pushed" along the tube.`},
{t:`They react where they meet`,d:`Ammonium chloride is a solid, so you see it as a white ring where the two gases meet.`,a:[{h:`The white ring forms where the NH<sub>3</sub> and HCl particles <span class="k">meet and react</span> to make ammonium chloride.`,m:`M2`}],e:[`M2`]},
{t:`Compare the masses`,d:`Use the data in the question. At the same temperature, particles with a lower mass move faster.`,a:[{h:`Ammonia particles have a <span class="k">lower mass</span> (M<sub>r</sub> = 17) than hydrogen chloride particles (M<sub>r</sub> = 36.5).`,m:`M3`}],e:[`M3`],co:`lower M<sub>r</sub> → particles move faster → diffuse faster`,cl:`Key phrase`},
{t:`Link speed to distance`,d:`Finish the explanation. Say what the faster speed means for where the gases meet.`,a:[{h:`So ammonia particles <span class="k">diffuse faster</span> and travel <span class="k">further</span> in the same time. They meet nearer the HCl end.`,m:`M4`}],e:[`M4`]},
{t:`Check your answer`,d:`Total: 4 marks. The most common lost mark: writing "ammonia is lighter" but never saying that it moves faster.`,a:[{h:`Random movement → meet and react → NH<sub>3</sub> lighter → NH<sub>3</sub> faster, so ring nearer HCl.`,c:`fin`}],tip:`Do not accept "the gases are attracted to each other" or "ammonia is stronger". These score 0.`}],
foot:`Diffusion: particles spread from where there are many to where there are few. Lighter particles diffuse faster.`,
y:{k:`wr`,q:`<p>A student puts one small crystal of purple potassium manganate(VII) into a beaker of water. After an hour, all the water is pale purple. She then adds 10 cm³ of this solution to 90 cm³ of water. The colour becomes even paler.</p><p><mark>Explain</mark> these observations in terms of <mark>particles</mark>. (4 marks)</p>`,
p:[`The crystal dissolves: particles leave the solid and move into the water.`,`The particles move randomly (diffusion), so the colour spreads through all of the water.`,`When more water is added, the same number of purple particles spread through a larger volume.`,`So the particles are further apart; the solution is diluted and looks paler.`]}},

{id:`sep`,name:`Pure crystals from a mixture`,type:`Describe`,marks:6,title:`Getting pure, dry copper(II) sulfate crystals from a mixture with sand`,spec:[`1.9 separation methods`,`Choosing a method`],
q:`<p>A student has a mixture of sand and copper(II) sulfate. Copper(II) sulfate dissolves in water. Sand does not dissolve in water.</p><p><mark>Describe</mark> how the student could obtain <mark>pure, dry crystals</mark> of copper(II) sulfate from the mixture.</p>`,
mk:[[`M1`,`dissolve in water`],[`M2`,`filter to remove sand`],[`M3`,`heat to evaporate some water`],[`M4`,`leave to cool / crystallise`],[`M5`,`filter off the crystals`],[`M6`,`dry the crystals`]],
steps:[
{t:`Plan the method`,d:`Find the property that is different. Copper(II) sulfate is soluble but sand is insoluble. So: dissolve, filter, then crystallise.`,a:[`<span class="mono">Plan: dissolve → filter → crystallise → dry</span>`],co:`dissolve → filter → crystallise → dry`,cl:`Key plan`,tip:`In a 6-mark "describe" question, write the steps in order. Each clear step can earn a mark. Name the apparatus.`},
{t:`Dissolve`,d:`Water is the solvent. Stirring and warming help the solid dissolve faster.`,a:[{h:`Add the mixture to <span class="k">water</span> in a beaker. Stir (and warm) until the copper(II) sulfate <span class="k">dissolves</span>.`,m:`M1`}],e:[`M1`]},
{t:`Filter off the sand`,d:`The solution passes through the paper. It is called the filtrate. The sand is left behind.`,a:[{h:`<span class="k">Filter</span> the mixture using filter paper in a funnel. The sand stays in the paper as the <span class="k">residue</span>.`,m:`M2`}],e:[`M2`],tip:`Do not write that the copper(II) sulfate is the residue. It is dissolved, so it goes through the filter paper.`},
{t:`Heat to the crystallisation point`,d:`Remove only some of the water. The solution becomes saturated. If you boil it to dryness, you get a powder, not crystals.`,a:[{h:`<span class="k">Heat</span> the filtrate in an evaporating basin to evaporate <span class="k">some</span> of the water, until crystals form on a cold glass rod dipped in it.`,m:`M3`}],e:[`M3`],tip:`"Heat until all the water has gone" usually loses this mark for hydrated crystals like copper(II) sulfate.`},
{t:`Cool to form crystals`,d:`Copper(II) sulfate is less soluble in cold water, so crystals form as the solution cools.`,a:[{h:`Leave the hot solution to <span class="k">cool</span> so that crystals form.`,m:`M4`}],e:[`M4`]},
{t:`Collect and dry`,d:`Total: 6 marks. The word "dry" is in the question, so you must say how to dry the crystals. Many students stop after the first filtration.`,a:[{h:`<span class="k">Filter</span> (or pour off the liquid) to collect the crystals.`,m:`M5`},{h:`<span class="k">Dry</span> the crystals between sheets of filter paper or leave them in a warm place.`,m:`M6`}],e:[`M5`,`M6`],tip:`Do not dry the crystals by heating them strongly. That removes the water of crystallisation.`}],
foot:`Soluble solid + insoluble solid: dissolve → filter → crystallise → dry.`,
y:{k:`wr`,q:`<p>Seawater contains dissolved salts. <mark>Describe</mark> how a student can obtain pure water from seawater by <mark>simple distillation</mark>. (4 marks)</p>`,
p:[`Heat the seawater in a flask so that the water boils and turns into vapour.`,`The water vapour passes into a condenser.`,`The condenser is cooled by cold water, so the vapour condenses into liquid water.`,`Pure water (the distillate) is collected in a beaker. The salts stay behind in the flask.`]}},

{id:`rf`,name:`R<sub>f</sub> values`,type:`Calculation`,marks:3,title:`Identifying a dye from its R<sub>f</sub> value`,spec:[`Paper chromatography`,`R<sub>f</sub> values`,`Core practical`],
q:`<p>A student uses paper chromatography to investigate food colouring F. The diagram shows the chromatogram.</p><div class="fig" style="max-width:360px"><svg viewBox="0 0 330 230" role="img" aria-label="Chromatogram: baseline at the bottom; upper spot 5.2 cm above baseline; lower spot; solvent front 8.0 cm above baseline"><rect x="90" y="8" width="110" height="214" fill="#fbfbf7" stroke="#5a6878" stroke-width="1.5"/><path d="M90 40H200" stroke="#4a44b5" stroke-width="1.6" stroke-dasharray="5 4"/><path d="M90 200H200" stroke="#1c2736" stroke-width="1.5"/><circle cx="145" cy="200" r="4" fill="none" stroke="#5a6878"/><ellipse cx="145" cy="96" rx="9" ry="6.5" fill="#e07a1f"/><ellipse cx="145" cy="152" rx="9" ry="6.5" fill="#e3c01c"/><path d="M114 98V198" stroke="#1c2736" stroke-width="1.4"/><path d="M110 104L114 96L118 104M110 192L114 200L118 192" fill="none" stroke="#1c2736" stroke-width="1.4"/><path d="M214 42V198" stroke="#1c2736" stroke-width="1.4"/><path d="M210 48L214 40L218 48M210 192L214 200L218 192" fill="none" stroke="#1c2736" stroke-width="1.4"/><text x="84" y="152" text-anchor="end" font-family="Atkinson Hyperlegible,Arial,sans-serif" font-size="14" fill="#1c2736">5.2 cm</text><text x="222" y="125" font-family="Atkinson Hyperlegible,Arial,sans-serif" font-size="14" fill="#1c2736" font-weight="700">8.0 cm</text><text x="222" y="44" font-family="Atkinson Hyperlegible,Arial,sans-serif" font-size="14" fill="#1c2736">solvent front</text><text x="222" y="204" font-family="Atkinson Hyperlegible,Arial,sans-serif" font-size="14" fill="#1c2736">baseline</text><text x="145" y="216" text-anchor="middle" font-family="Atkinson Hyperlegible,Arial,sans-serif" font-size="14" fill="#1c2736" font-weight="700">F</text></svg></div>
<p>The table shows the R<sub>f</sub> values of four dyes in the same solvent.</p>
<div class="tw"><table class="dt"><tr><th>Dye</th><th>P</th><th>Q</th><th>R</th><th>S</th></tr><tr><th>R<sub>f</sub> value</th><td>0.30</td><td>0.48</td><td>0.65</td><td>0.82</td></tr></table></div>
<p><mark>Calculate</mark> the R<sub>f</sub> value of the <mark>upper spot</mark> in F. Use your answer and the table to <mark>identify</mark> this dye.</p>`,
mk:[[`M1`,`R<sub>f</sub> = 5.2 ÷ 8.0`],[`M2`,`0.65`],[`M3`,`dye R`]],
steps:[
{t:`Measure from the baseline`,d:`Both distances are measured from the baseline (the pencil start line). The upper spot moved 5.2 cm. The solvent front moved 8.0 cm.`,a:[`Distance moved by the spot = <span class="k">5.2 cm</span>`,`Distance moved by the solvent front = <span class="k">8.0 cm</span>`],co:`spot 5.2 cm · solvent front 8.0 cm`,cl:`Key data`,tip:`Measure to the centre of the spot. Never measure from the bottom edge of the paper.`},
{t:`Write the formula and substitute`,d:`R<sub>f</sub> compares how far the spot moved with how far the solvent moved. The spot distance goes on top.`,a:[`R<sub>f</sub> = distance moved by spot ÷ distance moved by solvent front`,{h:`R<sub>f</sub> = <span class="k">5.2 ÷ 8.0</span>`,m:`M1`}],e:[`M1`],tip:`An R<sub>f</sub> value is always less than 1. If you get more than 1, you divided the wrong way round.`},
{t:`Calculate`,d:`Divide. R<sub>f</sub> has no units because it is one distance divided by another.`,a:[{h:`R<sub>f</sub> = <span class="k">0.65</span>`,m:`M2`}],e:[`M2`],co:`R<sub>f</sub> = 0.65`,cl:`Key quantity`},
{t:`Match with the table`,d:`The same dye in the same solvent always has the same R<sub>f</sub> value. Find 0.65 in the table.`,a:[{h:`0.65 matches <span class="k">dye R</span>`,m:`M3`}],e:[`M3`],tip:`If your R<sub>f</sub> is wrong, you can still get this mark if your dye matches your own value ("error carried forward").`},
{t:`Final answer`,d:`Total: 3 marks. Most marks are lost by measuring from the bottom of the paper or by dividing the wrong way round.`,a:[{h:`R<sub>f</sub> = 0.65 (no units); the dye is R`,c:`fin`}]}],
foot:`R<sub>f</sub> = distance moved by spot ÷ distance moved by solvent front (both measured from the baseline).`,
y:{k:`num`,q:`<p>In another chromatogram, a spot moves <mark>3.6 cm</mark> and the solvent front moves <mark>7.5 cm</mark> from the baseline. <mark>Calculate</mark> the R<sub>f</sub> value of the spot. Give your answer to <mark>two decimal places</mark>.</p>`,ans:0.48,tol:0.004,u:``,
ok:`Correct: 3.6 ÷ 7.5 = 0.48. This matches dye Q.`,bad:`Not quite. Divide the spot distance by the solvent front distance.`,
wrong:[{v:2.08,t:0.02,m:`You divided the solvent distance by the spot distance. An R<sub>f</sub> value must be less than 1.`}],
w:[`R<sub>f</sub> = distance moved by spot ÷ distance moved by solvent front`,`R<sub>f</sub> = 3.6 ÷ 7.5`,`<b>R<sub>f</sub> = 0.48</b> (no units)`]}},

{id:`ar`,name:`Relative atomic mass`,type:`Calculation`,marks:3,title:`Relative atomic mass of copper from its isotopes`,spec:[`Isotopes`,`Calculating A<sub>r</sub>`],
q:`<p>Copper has two isotopes, copper-63 and copper-65. The table shows their percentage abundances.</p>
<div class="tw"><table class="dt"><tr><th>Isotope</th><th>Mass number</th><th>Percentage abundance (%)</th></tr><tr><td>copper-63</td><td>63</td><td>69.2</td></tr><tr><td>copper-65</td><td>65</td><td>30.8</td></tr></table></div>
<p><mark>Calculate</mark> the relative atomic mass of copper. Give your answer to <mark>one decimal place</mark>.</p>`,
mk:[[`M1`,`(63 × 69.2) + (65 × 30.8)`],[`M2`,`÷ 100 = 63.616`],[`M3`,`63.6`]],
steps:[
{t:`Know what A<sub>r</sub> means`,d:`A<sub>r</sub> is the average mass of an atom, taking into account how common each isotope is. So you need a weighted average, not a simple average.`,a:[`A<sub>r</sub> = [(mass × % abundance) + (mass × % abundance)] ÷ 100`],tip:`Isotopes are atoms of the same element with the same number of protons but different numbers of neutrons. This definition is often asked first.`},
{t:`Multiply and add`,d:`Multiply each mass number by its percentage abundance. Then add the two answers.`,a:[{h:`(63 × 69.2) + (65 × 30.8)`,m:`M1`},`= 4359.6 + 2002.0 = <span class="k">6361.6</span>`],e:[`M1`],co:`total = 6361.6`,cl:`Key quantity`},
{t:`Divide by 100`,d:`The abundances add up to 100%, so divide by 100.`,a:[{h:`6361.6 ÷ 100 = <span class="k">63.616</span>`,m:`M2`}],e:[`M2`],tip:`Check: the answer must be between 63 and 65, and closer to 63, because copper-63 is more common.`},
{t:`Round as asked`,d:`Total: 3 marks. The question asks for one decimal place. A<sub>r</sub> has no units. The most common error is a simple average: (63 + 65) ÷ 2 = 64.`,a:[{h:`A<sub>r</sub> of copper = 63.6`,m:`M3`,c:`fin`}],e:[`M3`],tip:`Give the number of decimal places the question asks for. 63.616 or 64 does not get the last mark.`}],
foot:`Weighted average: add up (mass × abundance) for each isotope, then ÷ 100.`,
y:{k:`num`,q:`<p>Boron has two isotopes: boron-10 (abundance <mark>19.9%</mark>) and boron-11 (abundance <mark>80.1%</mark>). <mark>Calculate</mark> the relative atomic mass of boron to <mark>one decimal place</mark>.</p>`,ans:10.8,tol:0.011,u:``,
ok:`Correct: (10 × 19.9 + 11 × 80.1) ÷ 100 = 10.801, so 10.8.`,bad:`Not quite. Multiply each mass by its abundance, add them, then divide by 100.`,
wrong:[{v:10.5,t:0.01,m:`That is a simple average. Weight each mass by its abundance.`},{v:1080.1,t:0.5,m:`Remember to divide by 100.`},{v:10.2,t:0.01,m:`You have swapped the abundances. Boron-11 is the more common isotope.`}],
w:[`(10 × 19.9) + (11 × 80.1) = 199 + 881.1 = 1080.1`,`1080.1 ÷ 100 = 10.801`,`<b>A<sub>r</sub> = 10.8</b>`]}},

{id:`pt`,name:`Electrons and the periodic table`,type:`Explain`,marks:4,title:`Using electronic configuration to place element X`,spec:[`Electronic configuration`,`Groups and periods`],
q:`<p>Element X has atomic number <mark>17</mark>. Fluorine has atomic number 9.</p><p><mark>Explain</mark>, in terms of <mark>electrons</mark>, which group and which period X is in, and why X has <mark>similar chemical properties</mark> to fluorine.</p>`,
mk:[[`M1`,`2.8.7`],[`M2`,`3 shells → period 3`],[`M3`,`7 outer electrons → group 7`],[`M4`,`same number of outer electrons as F`]],
steps:[
{t:`Write the configuration`,d:`Atomic number 17 means 17 protons. A neutral atom also has 17 electrons. Fill the shells: 2, then 8, then the rest.`,a:[{h:`X has 17 electrons: <span class="k">2.8.7</span>`,m:`M1`}],e:[`M1`],co:`X = 2.8.7`,cl:`Key quantity`,tip:`For the first 20 elements, shells fill 2, 8, 8, 2. Check that the numbers add up to the atomic number.`},
{t:`Period from the number of shells`,d:`The number of occupied shells is the period number.`,a:[{h:`X has <span class="k">three occupied shells</span>, so it is in <span class="k">period 3</span>.`,m:`M2`}],e:[`M2`]},
{t:`Group from the outer electrons`,d:`For groups 1 to 7, the number of electrons in the outer shell is the group number.`,a:[{h:`X has <span class="k">7 electrons in its outer shell</span>, so it is in <span class="k">group 7</span>.`,m:`M3`}],e:[`M3`]},
{t:`Compare with fluorine`,d:`Reactions involve the outer electrons. The same number of outer electrons means the elements react in a similar way. (X is chlorine.)`,a:[`Fluorine is 2.7.`,{h:`X and fluorine have the <span class="k">same number of outer electrons</span> (7), so they react in a similar way; each atom gains one electron.`,m:`M4`}],e:[`M4`]},
{t:`Check your answer`,d:`Total: 4 marks. Most students lose the last mark by writing only "they are in the same group". Say why: the same number of outer electrons.`,a:[{h:`2.8.7 · period 3 · group 7 · same number of outer electrons as F`,c:`fin`}],tip:`Do not confuse group and period. Group = column = outer electrons. Period = row = number of shells.`}],
foot:`Shells → period. Outer electrons → group (groups 1–7). Full outer shell → group 0.`,
y:{k:`wr`,q:`<p>Element Z has atomic number <mark>20</mark>. Argon has atomic number 18.</p><p><mark>Explain</mark>, using electronic configurations, the group and period of Z, and why argon is unreactive but Z is not. (4 marks)</p>`,
p:[`Z has the electronic configuration 2.8.8.2.`,`Z has four occupied shells, so it is in period 4; it has 2 outer electrons, so it is in group 2.`,`Argon is 2.8.8, so its outer shell is full.`,`A full outer shell is stable, so argon does not need to lose or gain electrons; Z can lose its 2 outer electrons.`]}},

{id:`eqn`,name:`Balanced equation`,type:`Equation`,marks:3,title:`Writing the equation for sodium and water`,spec:[`Balanced equations`,`State symbols`],
q:`<p>Sodium reacts with water. The products are sodium hydroxide solution and hydrogen gas.</p><p><mark>Write</mark> a <mark>balanced</mark> equation for this reaction. Include <mark>state symbols</mark>.</p>`,
mk:[[`M1`,`correct formulae`],[`M2`,`balanced`],[`M3`,`state symbols`]],
steps:[
{t:`Write the word equation`,d:`Start with words, so that you do not miss a reactant or a product.`,a:[`sodium + water → sodium hydroxide + hydrogen`]},
{t:`Write the correct formulae`,d:`Hydrogen gas is diatomic, so it is H<sub>2</sub>. Never change a formula to make an equation balance.`,a:[{h:`Na + H<sub>2</sub>O → NaOH + <span class="k">H<sub>2</sub></span>`,m:`M1`}],e:[`M1`],tip:`These elements exist as diatomic molecules: H<sub>2</sub>, N<sub>2</sub>, O<sub>2</sub>, F<sub>2</sub>, Cl<sub>2</sub>, Br<sub>2</sub>, I<sub>2</sub>.`},
{t:`Count the atoms`,d:`Count each type of atom on each side. Hydrogen does not balance: 2 on the left, 3 on the right.`,a:[`<span class="mono">Left: Na 1 · H 2 · O 1 &nbsp;|&nbsp; Right: Na 1 · H 3 · O 1</span>`],co:`H does not balance yet`,cl:`Check`},
{t:`Balance with big numbers`,d:`Put 2 in front of NaOH and H<sub>2</sub>O. Then put 2 in front of Na. Check: Na 2, H 4, O 2 on both sides.`,a:[{h:`<span class="k">2</span>Na + <span class="k">2</span>H<sub>2</sub>O → <span class="k">2</span>NaOH + H<sub>2</sub>`,m:`M2`}],e:[`M2`],tip:`Only change the big numbers in front of formulae. Changing H<sub>2</sub>O to H<sub>2</sub>O<sub>2</sub> makes a different substance.`},
{t:`Add state symbols`,d:`Total: 3 marks. (s) solid, (l) liquid, (g) gas, (aq) dissolved in water. A common error is to write water as (aq). Pure water is a liquid, (l).`,a:[{h:`2Na(<span class="k">s</span>) + 2H<sub>2</sub>O(<span class="k">l</span>) → 2NaOH(<span class="k">aq</span>) + H<sub>2</sub>(<span class="k">g</span>)`,m:`M3`,c:`fin`}],e:[`M3`]}],
foot:`Words → formulae → count atoms → balance with big numbers → state symbols.`,
y:{k:`wr`,q:`<p>Aluminium burns in oxygen to form solid aluminium oxide, Al<sub>2</sub>O<sub>3</sub>. <mark>Write</mark> the <mark>balanced</mark> equation for this reaction, with <mark>state symbols</mark>. (3 marks)</p>`,
p:[`Correct formulae: Al + O<sub>2</sub> → Al<sub>2</sub>O<sub>3</sub>`,`Balanced: 4Al + 3O<sub>2</sub> → 2Al<sub>2</sub>O<sub>3</sub>`,`State symbols: 4Al(s) + 3O<sub>2</sub>(g) → 2Al<sub>2</sub>O<sub>3</sub>(s)`]}},

{id:`mass`,name:`Reacting masses and % yield`,type:`Calculation`,marks:4,title:`Heating calcium carbonate: mass of product and percentage yield`,spec:[`Reacting masses`,`Percentage yield`],
q:`<p>Calcium carbonate decomposes when it is heated strongly.</p><p><span class="eq">CaCO<sub>3</sub>(s) → CaO(s) + CO<sub>2</sub>(g)</span></p><p>A student heats <mark>25.0 g</mark> of calcium carbonate.</p>
<p>(a) <mark>Calculate</mark> the maximum mass of calcium oxide that can form.</p><p>(b) The student obtains <mark>11.2 g</mark> of calcium oxide. <mark>Calculate</mark> the percentage yield.</p><p class="data">[A<sub>r</sub>: C = 12 &nbsp; O = 16 &nbsp; Ca = 40]</p>`,
mk:[[`M1`,`0.250 mol CaCO<sub>3</sub>`],[`M2`,`14.0 g CaO`],[`M3`,`11.2 ÷ 14.0 × 100`],[`M4`,`80.0 %`]],
steps:[
{t:`Work out the M<sub>r</sub> values`,d:`Add up the relative atomic masses of all the atoms in each formula.`,a:[`M<sub>r</sub>(CaCO<sub>3</sub>) = 40 + 12 + (3 × 16) = <span class="k">100</span>`,`M<sub>r</sub>(CaO) = 40 + 16 = <span class="k">56</span>`]},
{t:`Change mass to moles`,d:`moles = mass ÷ M<sub>r</sub>`,a:[{h:`moles of CaCO<sub>3</sub> = 25.0 ÷ 100 = <span class="k">0.250 mol</span>`,m:`M1`}],e:[`M1`],co:`0.250 mol CaCO<sub>3</sub>`,cl:`Key quantity`},
{t:`Use the equation ratio`,d:`The equation shows that 1 CaCO<sub>3</sub> gives 1 CaO. So the moles of CaO are the same.`,a:[`ratio CaCO<sub>3</sub> : CaO = 1 : 1, so moles of CaO = <span class="k">0.250 mol</span>`],tip:`Always look at the big numbers in the balanced equation before you move from one substance to another.`},
{t:`Change moles back to mass`,d:`mass = moles × M<sub>r</sub>. This is the maximum (theoretical) mass.`,a:[{h:`(a) mass of CaO = 0.250 × 56 = <span class="k">14.0 g</span>`,m:`M2`}],e:[`M2`],co:`theoretical yield = 14.0 g`,cl:`Key quantity`},
{t:`Use the percentage yield formula`,d:`Percentage yield compares the mass you actually made with the maximum mass.`,a:[{h:`% yield = (actual ÷ theoretical) × 100 = (11.2 ÷ 14.0) × 100`,m:`M3`}],e:[`M3`],tip:`Put the actual mass on top. A yield above 100% means you divided the wrong way round.`},
{t:`Final answers`,d:`Total: 4 marks. The usual lost mark: using 25.0 g as the theoretical yield in part (b). Use the mass of the product, 14.0 g.`,a:[{h:`(a) 14.0 g &nbsp;&nbsp; (b) 80.0 %`,m:`M4`,c:`fin`}],e:[`M4`]}],
foot:`The mole map: mass → moles → (equation ratio) → moles → mass.`,
y:{k:`num`,q:`<p>Magnesium burns in oxygen.</p><p><span class="eq">2Mg(s) + O<sub>2</sub>(g) → 2MgO(s)</span></p><p><mark>Calculate</mark> the maximum mass of magnesium oxide formed when <mark>4.8 g</mark> of magnesium burns.</p><p class="data">[A<sub>r</sub>: O = 16 &nbsp; Mg = 24]</p>`,ans:8.0,tol:0.05,u:`g`,
ok:`Correct: 0.20 mol Mg gives 0.20 mol MgO, and 0.20 × 40 = 8.0 g.`,bad:`Not quite. Find moles of Mg (mass ÷ A<sub>r</sub>), use the 2 : 2 ratio, then multiply by M<sub>r</sub>(MgO) = 40.`,
wrong:[{v:16,t:0.1,m:`The ratio Mg : MgO is 2 : 2, which is 1 : 1. Do not double the moles.`},{v:4,t:0.05,m:`The ratio Mg : MgO is 2 : 2, which is 1 : 1. Do not halve the moles.`},{v:3.2,t:0.05,m:`That is the mass of oxygen only. Use M<sub>r</sub>(MgO) = 24 + 16 = 40.`}],
w:[`moles of Mg = 4.8 ÷ 24 = 0.20 mol`,`ratio Mg : MgO = 2 : 2 = 1 : 1, so 0.20 mol MgO`,`M<sub>r</sub>(MgO) = 24 + 16 = 40`,`<b>mass of MgO = 0.20 × 40 = 8.0 g</b>`]}},

{id:`emp`,name:`Formula of a metal oxide`,type:`Calculation`,marks:4,title:`Empirical formula of magnesium oxide (core practical)`,spec:[`Empirical formula`,`Core practical: metal oxide`],
q:`<p>A student heats magnesium ribbon in a crucible with a lid. She lifts the lid a little from time to time. The magnesium reacts with oxygen in the air to form magnesium oxide.</p>
<div class="tw"><table class="dt"><tr><th>Measurement</th><th>Mass (g)</th></tr><tr><td>crucible + lid</td><td>25.40</td></tr><tr><td>crucible + lid + magnesium</td><td>25.88</td></tr><tr><td>crucible + lid + magnesium oxide (after heating)</td><td>26.20</td></tr></table></div>
<p><mark>Calculate</mark> the empirical formula of magnesium oxide. <mark>Show your working.</mark></p><p class="data">[A<sub>r</sub>: O = 16 &nbsp; Mg = 24]</p>`,
mk:[[`M1`,`mass of O = 0.32 g`],[`M2`,`moles: 0.020 and 0.020`],[`M3`,`ratio 1 : 1`],[`M4`,`MgO`]],
steps:[
{t:`Find the masses that reacted`,d:`Subtract to find the mass of magnesium. The extra mass after heating is the oxygen that joined the magnesium.`,a:[`mass of Mg = 25.88 − 25.40 = <span class="k">0.48 g</span>`,{h:`mass of O = 26.20 − 25.88 = <span class="k">0.32 g</span>`,m:`M1`}],e:[`M1`],tip:`The lid is lifted to let oxygen in, but only a little so that magnesium oxide smoke does not escape. Lost smoke makes the oxygen mass too small.`},
{t:`Divide by A<sub>r</sub>`,d:`Change each mass into moles of atoms by dividing by the relative atomic mass.`,a:[`moles of Mg = 0.48 ÷ 24 = <span class="k">0.020</span>`,{h:`moles of O = 0.32 ÷ 16 = <span class="k">0.020</span>`,m:`M2`}],e:[`M2`],tip:`Use 16 for oxygen atoms, not 32 for O<sub>2</sub>. A formula counts atoms.`},
{t:`Find the simplest ratio`,d:`Divide both numbers by the smaller one.`,a:[{h:`Mg : O = 0.020 ÷ 0.020 : 0.020 ÷ 0.020 = <span class="k">1 : 1</span>`,m:`M3`}],e:[`M3`],co:`Mg : O = 1 : 1`,cl:`Key ratio`},
{t:`Write the formula`,d:`Total: 4 marks. The most common mistake is to use 0.80 g (the mass of magnesium oxide) as the mass of oxygen. Subtract first.`,a:[{h:`Empirical formula = MgO`,m:`M4`,c:`fin`}],e:[`M4`]}],
foot:`mass → moles (÷ A<sub>r</sub>) → divide by the smallest → whole-number ratio → formula.`,
y:{k:`txt`,q:`<p>An oxide of iron is heated in a stream of hydrogen. <mark>1.60 g</mark> of the oxide gives <mark>1.12 g</mark> of iron. <mark>Calculate</mark> the empirical formula of the iron oxide. Type the formula, e.g. MgO.</p><p class="data">[A<sub>r</sub>: O = 16 &nbsp; Fe = 56]</p>`,acc:[`Fe2O3`],
ok:`Correct: Fe : O = 0.020 : 0.030 = 2 : 3, so Fe<sub>2</sub>O<sub>3</sub>.`,bad:`Not quite. First find the mass of oxygen: 1.60 − 1.12 g. Check capital letters too.`,
wrong:[{a:`FeO`,m:`The ratio is 1 : 1.5, not 1 : 1. Multiply both numbers by 2.`},{a:`Fe3O2`,m:`Ratio the wrong way round. There is more oxygen than iron.`},{a:`FeO1.5`,m:`Formulae need whole numbers. Multiply 1 : 1.5 by 2.`}],
w:[`mass of O = 1.60 − 1.12 = 0.48 g`,`moles of Fe = 1.12 ÷ 56 = 0.020 &nbsp; moles of O = 0.48 ÷ 16 = 0.030`,`ratio = 0.020 : 0.030 = 1 : 1.5 = 2 : 3`,`<b>Empirical formula = Fe<sub>2</sub>O<sub>3</sub></b>`]}}
],
ck:[
{s:`1.1`,t:`Describe the arrangement, movement and energy of particles in solids, liquids and gases.`,p:[`diff`]},
{s:`1.2`,t:`Name and explain the changes of state: melting, freezing, boiling, evaporating, condensing and subliming.`,p:[`diff`]},
{s:`1.3`,t:`Use particles to explain experiments on diffusion of gases and dilution of coloured solutions.`,p:[`diff`]},
{s:`1.4`,t:`Know the meaning of solvent, solute, solution and saturated solution.`,p:[`sep`]},
{s:`1.7`,t:`Decide whether a substance is an element, a compound or a mixture.`},
{s:`1.8`,t:`A pure substance melts and boils at one fixed temperature; a mixture melts or boils over a range.`},
{s:`1.9`,t:`Describe filtration, crystallisation, simple distillation, fractional distillation and paper chromatography.`,p:[`sep`]},
{t:`Choose the right separation method for a mixture and explain the choice.`,p:[`sep`]},

]};

(function(){
var D=DATA,Q=D.qs;
var ST=(function(){try{var s=window.localStorage,t='__t';s.setItem(t,t);s.removeItem(t);return s}catch(e){return null}})();
function $(id){return document.getElementById(id)}
var qi=0,k=0,spd=1,tm=null,jobs=[],tick=null;
var SP=[{ms:40,n:1},{ms:17,n:1},{ms:12,n:4}];
var ms=function(n){return n+' mark'+(n>1?'s':'')};
$('h1').textContent=D.h1;$('ckh').textContent=D.group+': spec checklist';
function picker(){var p=$('picker');p.innerHTML='';Q.forEach(function(q,i){var b=document.createElement('button');b.type='button';b.className='qc';b.setAttribute('aria-pressed',i===qi?'true':'false');b.innerHTML='<b>'+q.name+'</b><span class="mono">'+q.type+' · '+ms(q.marks)+'</span>';b.addEventListener('click',function(){select(i)});p.appendChild(b)})}
function select(i){stopType();qi=i;k=0;picker();renderQ();your()}
function renderQ(){var q=Q[qi];
$('qlab').textContent='IGCSE Chemistry · '+D.year+' · '+D.group+' · Exam-style question · '+ms(q.marks);
$('qtitle').innerHTML=q.title;
$('qtags').innerHTML=q.spec.map(function(s){return '<span class="tag">'+s+'</span>'}).join('');
$('qbox').innerHTML=q.q;
$('chips').innerHTML=q.mk.map(function(m){return '<li class="chip" data-m="'+m[0]+'"><b>'+m[0]+'</b>'+m[1]+'</li>'}).join('');
$('dots').innerHTML=q.steps.map(function(){return '<span></span>'}).join('');
$('foot').innerHTML=q.foot||'';$('foot').hidden=!q.foot;
draw(false)}
function lines(n){var q=Q[qi],out=[];for(var s=0;s<n;s++){(q.steps[s].a||[]).forEach(function(L){if(typeof L==='string')L={h:L};var o={};for(var p in L)o[p]=L[p];o.s=s+1;if(o.id){for(var j=0;j<out.length;j++)if(out[j].id===o.id){out[j]=o;return}}out.push(o)})}return out}
function draw(anim){stopType();var q=Q[qi],N=q.steps.length,box=$('lines'),fresh=[];box.innerHTML='';
if(k===0)box.innerHTML='<p class="ph">Your answer will build here, one mark at a time. Press <b>Next step</b> to begin.</p>';
lines(k).forEach(function(L){var d=document.createElement('div');d.className='ln'+(L.c?' '+L.c:'');
if(L.g){d.className+=' dg';d.innerHTML=DG[L.g](L.l||1)}else d.innerHTML=L.h;
if(L.m){var t=document.createElement('span');t.className='mt';t.textContent=L.m;d.appendChild(t)}
box.appendChild(d);if(anim&&L.s===k)fresh.push(d);else d.className+=' still'});
var co=null,cl='';for(var s=0;s<k;s++)if(q.steps[s].co){co=q.steps[s].co;cl=q.steps[s].cl||'Key point'}
$('callout').hidden=!co;if(co)$('callout').innerHTML='<div class="mono">'+cl+'</div><div>'+co+'</div>';
var got={};for(s=0;s<k;s++)(q.steps[s].e||[]).forEach(function(m){got[m]=1});
[].forEach.call($('chips').children,function(c){c.classList.toggle('on',!!got[c.dataset.m])});
[].forEach.call($('dots').children,function(d,i){d.className=i<k-1?'done':i===k-1?'cur':''});
var sc=$('step');
if(k===0)sc.innerHTML='<div class="mono">Start · '+N+' steps</div><h3>Read the question first</h3><p>'+(q.read||('This is a <b>'+q.type.toLowerCase()+'</b> question worth <b>'+ms(q.marks)+'</b>. Find the command word and the key data (in yellow). Then press <b>Next step</b>.'))+'</p>';
else{var st=q.steps[k-1];sc.innerHTML='<div class="mono">Step '+k+' of '+N+'</div><h3>'+st.t+'</h3><p>'+st.d+'</p>'+(st.tip?'<div class="tip"><b>Exam tip:</b> '+st.tip+'</div>':'')}
$('back').disabled=k===0;$('next').disabled=k===N;
if(fresh.length)type(fresh)}
function type(nodes){jobs=[];nodes.forEach(function(n){if(/\bdg\b/.test(n.className))return;var tag=n.querySelector('.mt'),ts=[],w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT,null),t;while((t=w.nextNode())){if(tag&&tag.contains(t))continue;ts.push([t,t.nodeValue])}ts.forEach(function(x){x[0].nodeValue=''});if(tag)tag.classList.add('wait');n.style.visibility='hidden';jobs.push({n:n,ts:ts,tag:tag})});
var j=0,ti=0,ci=0;
tick=function(){var c=SP[spd].n;while(c>0){var job=jobs[j];if(!job){stopType();return}job.n.style.visibility='';var cur=job.ts[ti];if(!cur){if(job.tag)job.tag.classList.remove('wait');j++;ti=0;ci=0;continue}ci++;cur[0].nodeValue=cur[1].slice(0,ci);if(ci>=cur[1].length){ti++;ci=0}if(/\S/.test(cur[1].charAt(ci-1)))c--}};
if(jobs.length)tm=setInterval(tick,SP[spd].ms)}
function stopType(){if(tm){clearInterval(tm);tm=null}jobs.forEach(function(job){job.ts.forEach(function(x){x[0].nodeValue=x[1]});job.n.style.visibility='';if(job.tag)job.tag.classList.remove('wait')});jobs=[]}
function next(){var N=Q[qi].steps.length;if(k<N){k++;draw(true)}}
function back(){if(k>0){k--;draw(false)}}
function replay(){if(k===0)k=1;draw(true)}
$('next').addEventListener('click',next);$('back').addEventListener('click',back);$('replay').addEventListener('click',replay);
function setSpd(s){spd=s;[].forEach.call($('speed').children,function(b){b.setAttribute('aria-pressed',+b.dataset.s===s?'true':'false')});if(tm){clearInterval(tm);tm=setInterval(tick,SP[spd].ms)}}
[].forEach.call($('speed').children,function(b){b.addEventListener('click',function(){setSpd(+b.dataset.s)})});setSpd(1);
document.addEventListener('keydown',function(e){var t=e.target&&e.target.tagName;if(/INPUT|TEXTAREA|SELECT/.test(t)||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight'){e.preventDefault();next()}else if(e.key==='ArrowLeft'){e.preventDefault();back()}});
/* your turn */
function norm(s){return String(s).replace(/\s+/g,'').replace(/[₀-₉]/g,function(c){return String(c.charCodeAt(0)-8320)})}
function your(){var y=Q[qi].y,b=$('your'),h='<h2>Your turn</h2><div class="qbox">'+y.q+'</div>',calc=y.k!=='wr';
if(calc)h+='<div class="row"><label class="sr" for="yin">Your answer</label><input id="yin" autocomplete="off" spellcheck="false" '+(y.k==='num'?'inputmode="decimal" placeholder="Your answer"':'placeholder="Formula"')+'><span class="unit">'+(y.u||'')+'</span><button type="button" class="btn pri" id="ychk">Check</button><button type="button" class="btn" id="yshow">Show worked answer</button></div><p class="fb" id="yfb" role="status"></p><div class="work" id="ywork" hidden></div>';
else h+='<label class="mono" for="yta">Write your answer</label><textarea id="yta" rows="5"></textarea><div class="row"><button type="button" class="btn pri" id="yshow">Show model answer</button></div><div class="work model" id="ywork" hidden></div>';
b.innerHTML=h;var wk=$('ywork'),sh=$('yshow');
if(calc){wk.innerHTML=y.w.map(function(l,i){return '<div class="wl" style="animation-delay:'+(i*0.5)+'s">'+l+'</div>'}).join('');
var inp=$('yin'),fb=$('yfb');
var chk=function(){var v=inp.value.trim(),ok=false,msg=y.bad;if(!v){fb.className='fb no';fb.textContent='Type an answer first.';return}
if(y.k==='num'){var x=parseFloat(v.replace(',','.').replace(/[^0-9.\-]/g,''));if(isNaN(x)){fb.className='fb no';fb.textContent='Type a number.';return}
if(Math.abs(x-y.ans)<=y.tol)ok=true;else(y.wrong||[]).forEach(function(r){if(Math.abs(x-r.v)<=r.t)msg=r.m})}
else{var n=norm(v);if(y.acc.some(function(a){return norm(a)===n}))ok=true;else(y.wrong||[]).forEach(function(r){if(norm(r.a)===n)msg=r.m})}
fb.className='fb '+(ok?'ok':'no');fb.innerHTML=(ok?'✓ ':'✗ ')+(ok?y.ok:msg)};
$('ychk').addEventListener('click',chk);inp.addEventListener('keydown',function(e){if(e.key==='Enter')chk()});
sh.addEventListener('click',function(){wk.hidden=!wk.hidden;sh.textContent=wk.hidden?'Show worked answer':'Hide worked answer';if(!wk.hidden)[].forEach.call(wk.children,function(c){c.style.animation='none';void c.offsetWidth;c.style.animation=''})})}
else{var N=y.p.length;wk.innerHTML='<p class="mono">Model answer · Tick each point you made</p>'+y.p.map(function(p,i){return '<label><input type="checkbox"><span><b>'+(i+1)+'.</b> '+p+'</span></label>'}).join('')+'<p class="score" id="ysc">0 / '+N+'</p>';
wk.addEventListener('change',function(){$('ysc').textContent=wk.querySelectorAll('input:checked').length+' / '+N});
sh.addEventListener('click',function(){wk.hidden=!wk.hidden;sh.textContent=wk.hidden?'Show model answer':'Hide model answer'})}}
/* checklist */
var KEY='howto-'+D.key,R={};try{R=JSON.parse((ST&&ST.getItem(KEY))||'{}')||{}}catch(e){R={}}
function save(){try{if(ST)ST.setItem(KEY,JSON.stringify(R))}catch(e){}}
var LBL=[['n','Not yet'],['m','Nearly'],['g','Got it']];
function ck(){var box=$('cklist');box.innerHTML='';D.ck.forEach(function(r,i){var row=document.createElement('div');row.className='ckr';
row.innerHTML='<span class="ckn mono">'+(r.s||'•')+'</span><span class="ckt">'+r.t+'</span><span class="pills" role="group" aria-label="Rate this point">'+LBL.map(function(l){return '<button type="button" class="pill p'+l[0]+'" data-i="'+i+'" data-v="'+l[0]+'" aria-pressed="'+(R[i]===l[0])+'">'+l[1]+'</button>'}).join('')+'</span><span class="prac">'+(r.p||[]).map(function(id){var j=-1;Q.forEach(function(q,x){if(q.id===id)j=x});return j<0?'':'<button type="button" class="lnk" data-q="'+j+'">Practise: '+Q[j].name+'</button>'}).join('')+'</span>';box.appendChild(row)});count()}
function count(){var c={n:0,m:0,g:0},T=D.ck.length,u=T;for(var i in R)if(c[R[i]]!=null){c[R[i]]++;u--}
$('ckc').textContent=c.g+' got it · '+c.m+' nearly · '+c.n+' not yet · '+u+' not rated (of '+T+')';
var bar=document.querySelector('.bar');bar.querySelector('.bg').style.width=(100*c.g/T)+'%';bar.querySelector('.bm').style.width=(100*c.m/T)+'%';bar.querySelector('.bn').style.width=(100*c.n/T)+'%'}
$('cklist').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
if(b.dataset.v){var i=b.dataset.i,v=b.dataset.v;if(R[i]===v)delete R[i];else R[i]=v;save();[].forEach.call(b.parentNode.children,function(x){x.setAttribute('aria-pressed',R[i]===x.dataset.v?'true':'false')});count()}
else if(b.dataset.q!=null){select(+b.dataset.q);var w=$('walk');try{w.scrollIntoView({behavior:'smooth',block:'start'})}catch(er){w.scrollIntoView()}}});
$('ckclear').addEventListener('click',function(){R={};save();ck()});
picker();renderQ();your();ck();
})();
</script>
