<style>
:root{--paper:#f2f5f8;--sheet:#fff;--ink:#1c2736;--muted:#5a6878;--line:#cdd6df;--accent:#4a44b5;--accent-soft:#e7e6fb;--good:#1d7a46;--good-soft:#e2f3e8;--bad:#b3261e;--bad-soft:#fbe8e6;--hl:#fff1c7;--amber:#e0a526;--amber-ink:#875700;--amber-soft:#fff8e7}

.bar{height:8px;border-radius:99px;background:var(--paper);overflow:hidden;display:flex;margin:12px 0 6px;border:1px solid var(--line)}
.bar i{display:block;height:100%}
.crow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}

.crow p{margin:0}
.pills{display:flex;gap:6px;flex-wrap:wrap}

.prac{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:4px 14px}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;cursor:pointer;font-size:15px;text-align:left}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

<script>
var PAGE={key:"y10-inorganic",year:"Year 10",group:"Inorganic chemistry part 1",
qs:[
{id:"salt",name:"Pure, dry salt crystals",type:"Describe",marks:6,
title:"Preparing pure, dry copper(II) sulfate crystals",
spec:["Spec 2.39 soluble salt from an insoluble reactant","Spec 2.42 core practical: copper(II) sulfate crystals"],
q:"<p>Copper(II) sulfate is a soluble salt. It can be made from copper(II) oxide, an insoluble black solid, and dilute sulfuric acid.</p><span class='eq'>CuO(s) + H_2SO_4(aq) → CuSO_4(aq) + H_2O(l)</span><p>[[Describe]] how a student could prepare a [[pure, dry]] sample of [[hydrated copper(II) sulfate crystals]], starting from copper(II) oxide and dilute sulfuric acid. <b>(6)</b></p>",
M:["Warm the dilute sulfuric acid","Add CuO until in excess (black solid left)","Filter to remove the excess CuO","Heat to evaporate some water / to crystallisation point","Leave to cool so crystals form","Filter off crystals and dry them (filter paper / warm place)"],
foot:"The salt method: react with excess → filter → crystallise → dry.",
S:[
{t:"Warm the acid",x:"Start with the acid in a beaker. Warming it makes the copper(II) oxide react faster.",tip:"Say <b>warm</b> or <b>heat gently</b>. Do not boil the acid.",L:["{M1}Pour about 50 cm³ of dilute sulfuric acid into a beaker and **warm it gently**."],m:[0]},
{t:"Add the base until it is in excess",x:"Add the solid a little at a time and stir. Stop when some black solid stays at the bottom and does not dissolve.",tip:"Why excess? It makes sure <b>all the acid reacts</b>, so there is no acid left in the salt. 'Add copper(II) oxide' alone does not score: you must show it is in excess.",L:["{M2}Add copper(II) oxide a spatula at a time, stirring, **until some black solid is left over** (the copper(II) oxide is in excess)."],m:[1],c:"Excess CuO = all the acid has been used up"},
{t:"Filter off the excess solid",x:"The blue solution is what you want. The black solid in the filter paper is the unreacted copper(II) oxide.",tip:"A common mistake: 'filter, and the crystals are left in the filter paper'. At this stage the salt is <b>dissolved</b> in the filtrate.",L:["{M3}**Filter** the mixture to remove the excess copper(II) oxide. Collect the blue filtrate."],m:[2]},
{t:"Evaporate some of the water",x:"Heat the filtrate in an evaporating basin. Stop when the solution is concentrated: crystals appear on a cold glass rod dipped into it.",tip:"Do <b>not</b> heat to dryness. That removes the water of crystallisation and gives white anhydrous powder, not blue hydrated crystals.",L:["{M4}Heat the filtrate in an evaporating basin to **evaporate some of the water**, until crystals form on a cold glass rod (the crystallisation point)."],m:[3],c:"Crystallisation point: crystals form on a cold glass rod"},
{t:"Let crystals form",x:"As the hot concentrated solution cools, the salt is less soluble, so crystals grow.",L:["{M5}Leave the solution to **cool**, so that crystals form."],m:[4]},
{t:"Separate and dry the crystals",x:"Remove the crystals from the remaining solution, then dry them without strong heating.",L:["{M6}**Filter off the crystals** and **dry** them by patting with filter paper (or leave them in a warm place)."],m:[5]},
{t:"Check the order",x:"<b>Total: 6 marks.</b> One mark for each clear step, in a sensible order. Name the apparatus (beaker, filter funnel, evaporating basin) to make each step clear.",tip:"The most common way to lose marks is heating the solution to dryness, or forgetting to filter off the excess copper(II) oxide.",L:["{=}Warm acid → add CuO in excess → filter → evaporate some water → cool → filter and dry crystals"]}
],
Y:{k:"text",q:"<p>Zinc sulfate is a soluble salt. Zinc carbonate is insoluble.</p><p>[[Describe]] how you could make pure, dry crystals of zinc sulfate from zinc carbonate and dilute sulfuric acid. <b>(6)</b></p>",
P:["Add zinc carbonate to (warm) dilute sulfuric acid a little at a time, stirring","Keep adding until fizzing stops / solid is left over (zinc carbonate in excess)","Filter to remove the excess zinc carbonate","Heat the filtrate to evaporate some water (to the crystallisation point)","Leave to cool so that crystals form","Filter off the crystals and dry them between filter papers / in a warm place"]}},

{id:"disp",name:"Displacement results",type:"Explain",marks:4,
title:"Using displacement results to order metals",
spec:["Spec 2.16 displacement reactions","Spec 2.17 order of reactivity"],
q:"<p>A student adds small pieces of four metals to solutions of metal sulfates. The table shows her results.</p><div class='tw'><table class='t'><tr><th>Metal</th><th>magnesium sulfate</th><th>zinc sulfate</th><th>iron(II) sulfate</th><th>copper(II) sulfate</th></tr><tr><th>magnesium</th><td class='c'>–</td><td class='c'>✓</td><td class='c'>✓</td><td class='c'>✓</td></tr><tr><th>zinc</th><td class='c'>✗</td><td class='c'>–</td><td class='c'>✓</td><td class='c'>✓</td></tr><tr><th>iron</th><td class='c'>✗</td><td class='c'>✗</td><td class='c'>–</td><td class='c'>✓</td></tr><tr><th>copper</th><td class='c'>✗</td><td class='c'>✗</td><td class='c'>✗</td><td class='c'>–</td></tr></table></div><p class='data'>✓ = reaction &nbsp; ✗ = no reaction &nbsp; – = not tested</p><p>(a) [[State]] [[two]] observations when zinc is added to copper(II) sulfate solution. <b>(2)</b></p><p>(b) [[Explain]] how the results show the order of reactivity of the four metals. <b>(2)</b></p>",
M:["Brown / pink-brown solid forms","Blue colour of the solution fades","More reactive metal displaces less reactive metal from its compound","Mg displaces all, Cu none: Mg > Zn > Fe > Cu"],
foot:"Zn(s) + CuSO_4(aq) → ZnSO_4(aq) + Cu(s)",
S:[
{t:"Read the table",x:"Each ✓ means the metal pushed another metal out of its compound. Count the ticks for each metal.",L:["Ticks: magnesium 3, zinc 2, iron 1, copper 0."],c:"More ticks = more reactive metal"},
{t:"(a) First observation: the solid",x:"Zinc displaces copper. Copper metal is a brown (pink-brown) solid, so you see it form on the zinc.",tip:"Observations are what you <b>see</b>. 'Copper is formed' is a conclusion, not an observation: say <b>brown solid</b>.",L:["{M1}A **brown solid** forms on the zinc."],m:[0]},
{t:"(a) Second observation: the solution",x:"Copper(II) sulfate solution is blue. Zinc sulfate solution is colourless. So the blue colour fades.",tip:"Write <b>colourless</b>, not 'clear'. A solution can be clear and still coloured.",L:["{M2}The **blue colour** of the solution **fades** (it becomes colourless)."],m:[1]},
{t:"(b) Give the rule",x:"Explain questions need the reason. Displacement only happens when the metal added is more reactive.",L:["{M3}A **more reactive metal displaces a less reactive metal** from a solution of its compound."],m:[2]},
{t:"(b) Use the evidence and give the order",x:"<b>Total: 4 marks.</b> Quote the results: magnesium displaces all three metals; copper displaces none.",tip:"Marks are lost by giving the order with no evidence from the table. Always link the order to the ticks.",L:["{M4}Magnesium displaces all three other metals but **copper displaces none**, so the order is:","{=}most reactive  Mg > Zn > Fe > Cu  least reactive"],m:[3]}
],
Y:{k:"text",q:"<p>Metal X reacts with lead(II) nitrate solution and with copper(II) nitrate solution. X does not react with zinc nitrate solution.</p><p>[[Explain]] where X fits in the reactivity series. <b>(3)</b></p>",
P:["X displaces lead and copper, so X is more reactive than lead and copper","X does not displace zinc, so X is less reactive than zinc","X is between zinc and lead in the series (e.g. it could be iron)"]}},

{id:"redox",name:"Oxidised or reduced?",type:"Explain",marks:4,
title:"Redox: oxygen, electrons and agents",
spec:["Spec 2.20 oxidation, reduction, redox and agents"],
q:"<p>The thermite reaction is used to weld railway lines.</p><span class='eq'>Fe_2O_3(s) + 2Al(s) → Al_2O_3(s) + 2Fe(l)</span><p>(a) [[Identify]] the substance oxidised and the substance reduced. [[Explain]] your answer [[in terms of oxygen]]. <b>(2)</b></p><p>Zinc reacts with copper(II) ions:</p><span class='eq'>Zn(s) + Cu^2+(aq) → Zn^2+(aq) + Cu(s)</span><p>(b) [[Explain]], [[in terms of electrons]], why zinc is the reducing agent. <b>(2)</b></p>",
M:["Aluminium oxidised: gains oxygen","Iron(III) oxide reduced: loses oxygen","Zinc atoms lose electrons (are oxidised)","Zinc gives electrons to Cu^2+, so it reduces them"],
foot:"OIL RIG: Oxidation Is Loss, Reduction Is Gain (of electrons).",
S:[
{t:"Follow the oxygen",x:"Look at where the oxygen starts and where it ends.",L:["Fe_2O_3 → Fe : loses oxygen. &nbsp; Al → Al_2O_3 : gains oxygen."],c:"Gain of oxygen = oxidation. Loss of oxygen = reduction."},
{t:"(a) Substance oxidised",x:"Name the substance, then give the reason with the word 'gains'.",L:["{M1}**Aluminium is oxidised** because it **gains oxygen**."],m:[0]},
{t:"(a) Substance reduced",x:"Name the compound, iron(III) oxide, not just 'iron'.",tip:"Here aluminium is the <b>reducing agent</b> and iron(III) oxide is the <b>oxidising agent</b>. Redox means reduction and oxidation happen together.",L:["{M2}**Iron(III) oxide is reduced** because it **loses oxygen**."],m:[1]},
{t:"Follow the electrons",x:"There is no oxygen in (b), so use electrons. A charge going up means electrons were lost.",tip:"You do not need half-equations on the double award paper. Just say which particle loses or gains electrons.",L:["Zn → Zn^2+ : 2 electrons lost. &nbsp; Cu^2+ → Cu : 2 electrons gained."],c:"OIL RIG: Oxidation Is Loss of electrons, Reduction Is Gain"},
{t:"(b) Zinc is oxidised",x:"Zinc atoms lose two electrons each and become zinc ions.",L:["{M3}**Zinc atoms lose electrons** to form zinc ions, so zinc is oxidised."],m:[2]},
{t:"(b) So zinc is the reducing agent",x:"<b>Total: 4 marks.</b> A reducing agent gives electrons to another substance and so reduces it.",tip:"The most common mistake: 'zinc is reduced, so it is the reducing agent'. No! The reducing agent is itself <b>oxidised</b>.",L:["{M4}Zinc **gives its electrons to the copper(II) ions**, so it reduces them. Zinc is the reducing agent.","{=}Reducing agent: Zn (is oxidised) · Oxidising agent: Cu^2+ (is reduced)"],m:[3]}
],
Y:{k:"text",q:"<p>Burning magnesium keeps burning in carbon dioxide:</p><span class='eq'>2Mg(s) + CO_2(g) → 2MgO(s) + C(s)</span><p>[[Identify]] the oxidising agent and the reducing agent. [[Explain]] your answer in terms of oxygen. <b>(4)</b></p>",
P:["Magnesium gains oxygen, so magnesium is oxidised","Carbon dioxide loses oxygen, so carbon dioxide is reduced","Magnesium is the reducing agent","Carbon dioxide is the oxidising agent"]}},

{id:"galv",name:"Galvanising when scratched",type:"Explain",marks:3,
title:"Why galvanised steel still does not rust when scratched",
spec:["Spec 2.19 preventing rusting"],
q:"<p>Steel buckets are often <b>galvanised</b>. They are coated with a thin layer of zinc.</p><p>[[Explain]] how galvanising stops the iron in the steel from rusting, [[even when the zinc layer is scratched]]. <b>(3)</b></p>",
M:["Zinc layer is a barrier to water and oxygen","Zinc is more reactive than iron","Zinc corrodes instead of iron (sacrificial protection)"],
foot:"Rust is hydrated iron(III) oxide. Iron needs water and oxygen to rust.",
S:[
{t:"Spot the two parts",x:"The question has two situations: the zinc layer unbroken, and the zinc layer scratched. You need an idea for each.",L:["Part 1: coating not broken. &nbsp; Part 2: coating scratched."],c:"Barrier + sacrificial protection"},
{t:"Unbroken layer: a barrier",x:"Iron needs both water and oxygen to rust. The coating keeps them away.",L:["{M1}The zinc coating is a **barrier**: it stops **water and oxygen** reaching the iron."],m:[0]},
{t:"Scratched: compare reactivity",x:"When scratched, the iron is exposed. Now reactivity matters.",tip:"'Zinc is reactive' scores nothing. You must compare: <b>more reactive than iron</b>.",L:["{M2}Zinc is **more reactive than iron**."],m:[1]},
{t:"Scratched: zinc corrodes first",x:"<b>Total: 3 marks.</b> The zinc reacts with water and oxygen instead of the iron. The zinc is 'sacrificed'.",tip:"Do not say 'zinc rusts': only iron rusts. Say zinc <b>corrodes</b> or <b>is oxidised</b>. 'Zinc loses electrons more easily than iron' is also accepted.",L:["{M3}So the **zinc corrodes instead of the iron** (it is oxidised first). This is **sacrificial protection**."],m:[2]}
],

  each($('rows').children,function(row,i){var v=R[i];if(v===0||v===1||v===2)n[v]++;each(row.querySelectorAll('.pills button'),function(b){b.setAttribute('aria-pressed',(+b.getAttribute('data-v')===v)?'true':'false');});});
  var u=T-n[0]-n[1]-n[2],bar=$('bar').children;
  bar[0].style.width=(100*n[2]/T)+'%';bar[1].style.width=(100*n[1]/T)+'%';bar[2].style.width=(100*n[0]/T)+'%';
  $('counts').textContent=n[2]+' got it · '+n[1]+' nearly · '+n[0]+' not yet · '+u+' not rated (of '+T+')';
}
$('clr').onclick=function(){R={};save();paint();};
paint();sel(0);
})();
</script>
